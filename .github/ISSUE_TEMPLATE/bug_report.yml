name: Bug report
description: Something behaves differently from what the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        One thing helps more than anything else here: **whether the failure was visible**.
        A bug that shows an error is annoying; a bug that silently serves the wrong thing is
        the class we care most about. Say which one you hit.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Ideally the exact request. Redact slugs and URLs — never paste a secret.
      placeholder: |
        curl -i "http://localhost:3000/api/doc?preview=1&stream=1&url=..."
    validations: { required: true }
  - type: input
    id: contract
    attributes:
      label: Output of GET /api/doc?contract=1
      description: Version, contract number and plugin state. Contains no secrets by design.
    validations: { required: true }
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options: [Docker image, npm + bin/serve.js, Serverless (Vercel or similar), Embedded in another app, Other]
    validations: { required: true }
  - type: input
    id: source
    attributes:
      label: Where do the documents come from?
      placeholder: local folder / Supabase Storage / our own file route
