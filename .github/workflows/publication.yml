# LE CONTRÔLE QUI N'A BESOIN DE PERSONNE.
#
# ⚠️ La garde ajoutée dans `ci.yml` écrit un avertissement dans le résumé de la course. Le second
# hôte a fait la remarque qui la disqualifie comme garde principale : un avertissement dans un
# résumé ne se voit QUE SI QUELQU'UN OUVRE LA COURSE. Or les trois fois où la publication a échoué
# — 0.1.15 publiée sans son correctif, 0.1.25 publiée cassée, 0.1.35 jamais publiée — c'est un HÔTE
# qui a trouvé, en comparant le registre à l'annonce. Personne n'avait ouvert la course.
#
# Celui-ci ne demande à personne de regarder : il compare périodiquement ce que le registre sert à
# ce que `main` déclare, et OUVRE UNE ISSUE quand les deux divergent depuis plus d'une heure. Une
# issue notifie ; un résumé attend.
#
# ⚠️ Le délai d'une heure n'est pas de la prudence, c'est la condition pour que l'alarme veuille
# dire quelque chose : entre une fusion et la fin d'une publication il s'écoule légitimement
# quelques minutes. Une alarme qui se déclenche à chaque fusion serait ignorée en une semaine —
# exactement le mécanisme du badge qu'on regarde sans le lire.
#
# Et il se TAIT tout seul : l'issue se referme quand le registre rattrape. Une alarme qu'il faut
# éteindre à la main finit par rester allumée.
name: publication

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# ⚠️ RIEN EN ÉCRITURE À LA RACINE — LE DROIT VA AU JOB QUI S'EN SERT, ET À LUI SEUL.
#
# Une permission posée ici est accordée à TOUS les jobs, y compris à ceux que personne n'a encore
# écrits. Le jour où quelqu'un ajoute une étape à ce fichier, elle hérite d'un droit d'écriture
# qu'il n'a pas demandé et qu'il ne verra pas — c'est un privilège qui s'accorde par oubli.
#
# La règle est tenue par `tools/permissions-workflows.mjs`, qui refuse toute écriture à la racine.
permissions:
  contents: read

jobs:
  ecart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write           # ouvrir et refermer les issues de dérive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }

      # ⚠️ CE JOB N'INSTALLAIT RIEN, ET SA DERNIÈRE ÉTAPE EST MORTE EN SILENCE PENDANT DIX-NEUF
      # HEURES. `tools/exemples-en-retard.mjs` importe `exemples-epingles.mjs`, qui a gagné une
      # dépendance à `semver` dans la 0.1.137 (#386) — pour comparer des INTERVALLES de version au
      # lieu d'exiger une chaîne littérale, ce qui était le bon changement. À partir de cette
      # publication, l'étape jetait `ERR_MODULE_NOT_FOUND` avant d'avoir rien mesuré.
      #
      # ⚠️ ET C'EST LE PIRE ENDROIT OÙ CASSER. Le job devient rouge, donc « ça se voit » — mais sur
      # la page des exécutions planifiées, que personne n'ouvre. Pendant ce temps l'issue que cette
      # étape entretient restait FIGÉE sur son dernier état vrai (elle annonçait encore 0.1.128
      # alors que le registre servait 0.1.138) : une alerte périmée qui a l'air vivante est pire
      # qu'une alerte absente. Les étapes précédentes, elles, ont continué de fonctionner — c'est
      # pourquoi l'écart de version s'est bien signalé puis refermé tout seul.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - id: mesure
        name: What main declares vs what the registry serves
        run: |
          locale=$(node -p "require('./package.json').version")
          publiee=$(npm view discovery-media-player version 2>/dev/null || echo "")
          # ⚠️ Registre injoignable ⇒ on ne conclut rien. Une alarme fondée sur une absence de
          # réponse crie au loup à la première coupure, et c'est comme ça qu'on cesse de l'écouter.
          if [ -z "$publiee" ]; then echo "ecart=indetermine" >> "$GITHUB_OUTPUT"; exit 0; fi
          # ⚠️ DEPUIS QUAND `main` PORTE-T-ELLE CETTE VERSION-LÀ ?
          #
          # Première version : la date du dernier commit touchant `package.json`. Le second hôte a
          # montré la porte que ça laisse — une montée de dépendance, un `description` corrigé, un
          # script ajouté, et le compteur repart alors que la version non publiée, elle, n'a pas
          # bougé. L'alarme se tairait pour une raison qui n'a rien à voir avec elle.
          #
          # Dependabot est actif ici : ce cas n'est pas hypothétique, il est programmé.
          #
          # `git log -L` sur la ligne `version` date exactement ce dont on parle, et rien de ce qui
          # l'accompagne d'habitude. Repli sur le fichier entier si `-L` ne rend rien : mieux vaut
          # une alarme un peu trop tardive qu'une alarme muette.
          pose=$(git log -L '/"version":/,+1:package.json' --format=%ct -s 2>/dev/null | head -1)
          [ -n "$pose" ] || pose=$(git log -1 --format=%ct -- package.json)
          age=$(( $(date +%s) - pose ))
          echo "main=$locale registre=$publiee age=${age}s"
          echo "locale=$locale" >> "$GITHUB_OUTPUT"
          echo "publiee=$publiee" >> "$GITHUB_OUTPUT"
          if [ "$locale" = "$publiee" ]; then echo "ecart=non" >> "$GITHUB_OUTPUT"
          elif [ "$age" -lt 3600 ]; then echo "ecart=recent" >> "$GITHUB_OUTPUT"
          else echo "ecart=oui" >> "$GITHUB_OUTPUT"; fi

      - name: Speak up, or shut up
        env:
          GH_TOKEN: ${{ github.token }}
          ECART: ${{ steps.mesure.outputs.ecart }}
          LOCALE: ${{ steps.mesure.outputs.locale }}
          PUBLIEE: ${{ steps.mesure.outputs.publiee }}
        run: |
          TITRE="Version non publiée : main déclare une version que le registre ne sert pas"
          existante=$(gh issue list --state open --search "$TITRE in:title" --json number --jq '.[0].number // empty')

          if [ "$ECART" != "oui" ]; then
            # ⚠️ Se taire fait partie du travail : une alarme qu'il faut éteindre à la main reste allumée.
            if [ -n "$existante" ] && [ "$ECART" = "non" ]; then
              gh issue close "$existante" --comment "Le registre sert $PUBLIEE. Rien à faire."
            fi
            exit 0
          fi

          corps=$(printf '%s\n' \
            "\`main\` déclare **$LOCALE**, le registre sert **$PUBLIEE**, et c'est le cas depuis plus d'une heure." \
            "" \
            "Le code est fusionné, le CHANGELOG l'annonce, et l'artefact n'existe pas. Rien n'a échoué :" \
            "c'est ce qui rend ce cas difficile à voir." \
            "" \
            "Il manque probablement le tag :" \
            "" \
            '```bash' \
            "git checkout main && git pull && git tag -a v$LOCALE -m \"$LOCALE\" && git push origin v$LOCALE" \
            '```' \
            "" \
            "Puis vérifier dans le TARBALL publié, pas dans l'intention." \
            "" \
            "_Cette issue se referme seule quand le registre rattrape._")

          if [ -n "$existante" ]; then
            gh issue comment "$existante" --body "$corps"
          else
            gh issue create --title "$TITRE" --body "$corps"
          fi

      # ⚠️ npm PUBLIÉ MAIS IMAGE VERSIONNÉE MANQUANTE (P1 onzième audit — l'image 0.1.81 a manqué
      # parce que son workflow a échoué en silence, non bloquant). Le contrôle horaire vérifie donc
      # AUSSI que la version servie par npm a son image sur GHCR ; sinon, il ouvre/entretient une
      # issue. Une image manquante ne casse pas un consommateur npm, mais casse un consommateur
      # Docker — et rien d'autre ne le disait.
      - name: The published npm version has its container image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publiee=$(npm view discovery-media-player version 2>/dev/null || echo "")
          [ -n "$publiee" ] || { echo "registre npm injoignable — on ne conclut rien"; exit 0; }
          depot=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          jeton=$(curl -s "https://ghcr.io/token?scope=repository:$depot:pull" | jq -r '.token // empty')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $jeton" -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/$depot/manifests/v$publiee")
          TITRE="Image de conteneur manquante pour la version publiée"
          existante=$(gh issue list --state open --search "$TITRE in:title" --json number --jq '.[0].number // empty')
          if [ "$code" = "200" ]; then
            echo "image v$publiee servie (200)"
            [ -n "$existante" ] && gh issue close "$existante" --comment "L'image v$publiee est servie. Rien à faire." || true
          else
            echo "::warning::npm sert $publiee mais l'image v$publiee répond $code sur GHCR"
            corps="npm sert **$publiee**, mais \`ghcr.io/$depot:v$publiee\` répond **$code** — l'image de cette version n'est pas publiée. Relancer le workflow Image pour \`v$publiee\` (dispatch), puis vérifier le manifeste et les deux architectures. _Se referme seule quand l'image apparaît._"
            if [ -n "$existante" ]; then gh issue comment "$existante" --body "$corps"; else gh issue create --title "$TITRE" --body "$corps"; fi
          fi

      # ⚠️ `latest` POINTE-T-IL BIEN LA VERSION PUBLIÉE ? (P2 treizième audit — filet du cas où une
      # promotion aurait été perdue et personne ne pointe latest sur le plus haut.) On compare le
      # digest de `latest` à celui de `v${version npm}` ; s'ils diffèrent, on ouvre une issue — un
      # `docker buildx imagetools create --tag …:latest …:v$publiee` la ferme.
      - name: latest points at the published version's digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publiee=$(npm view discovery-media-player version 2>/dev/null || echo "")
          [ -n "$publiee" ] || { echo "registre npm injoignable — on ne conclut rien"; exit 0; }
          depot=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          jeton() { curl -s "https://ghcr.io/token?scope=repository:$depot:pull" | jq -r '.token // empty'; }
          digest() { curl -sI -H "Authorization: Bearer $(jeton)" -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/$depot/manifests/$1" | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}'; }
          dver=$(digest "v$publiee"); dlat=$(digest latest)
          [ -n "$dver" ] || { echo "image v$publiee absente — déjà couvert par l'étape précédente"; exit 0; }
          TITRE="latest ne pointe pas la dernière version"
          existante=$(gh issue list --state open --search "$TITRE in:title" --json number --jq '.[0].number // empty')
          if [ "$dver" = "$dlat" ]; then
            echo "latest pointe bien v$publiee ($dver)"
            [ -n "$existante" ] && gh issue close "$existante" --comment "latest pointe v$publiee. Rien à faire." || true
          else
            echo "::warning::latest ($dlat) != v$publiee ($dver)"
            corps="\`latest\` pointe **$dlat**, mais la version publiée **v$publiee** a le digest **$dver** — une promotion a été perdue. Réconcilier : \`docker buildx imagetools create --tag ghcr.io/$depot:latest ghcr.io/$depot:v$publiee\`. _Se referme seule quand les digests convergent._"
            if [ -n "$existante" ]; then gh issue comment "$existante" --body "$corps"; else gh issue create --title "$TITRE" --body "$corps"; fi
          fi

      # ⚠️ LES EXEMPLES DEVIENNENT ROUGES SANS QUE PERSONNE N'AIT RIEN POUSSÉ (P1, revue externe
      # du 21/08). `tools/exemples-epingles.mjs` compare les exemples au REGISTRE VIVANT et tolère
      # les deux dernières versions servies. Donc le jour où une publication sort, un exemple resté
      # sur l'avant-dernière bascule hors fenêtre — et la CI rougit sur TOUTES LES PR OUVERTES,
      # dont aucune n'a touché aux exemples. C'est arrivé à deux PR pendant que 0.1.127 puis
      # 0.1.128 sortaient.
      #
      # Le refus est juste, et on ne le desserre pas : fusionner une de ces branches laisserait
      # `main` deux versions derrière. Ce qui manquait, c'est l'avertissement pendant le SURSIS —
      # la publication de marge entre « plus la dernière » et « plus dans les deux dernières ».
      #
      # La décision vit dans `tools/exemples-en-retard.mjs`, avec son banc, et importe la règle de
      # la garde plutôt que d'en garder un second exemplaire. Cette étape ne fait que la rapporter.
      - id: retard
        name: Are the examples one publication away from turning every PR red?
        run: node tools/exemples-en-retard.mjs

      - name: Speak up while there is still slack, or shut up
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNALER: ${{ steps.retard.outputs.signaler }}
          DERNIERE: ${{ steps.retard.outputs.derniere }}
          CORPS: ${{ steps.retard.outputs.corps }}
        run: |
          TITRE="Les exemples prennent du retard sur le registre"
          existante=$(gh issue list --state open --search "$TITRE in:title" --json number --jq '.[0].number // empty')

          # ⚠️ Registre injoignable ⇒ on ne touche à RIEN : ni ouvrir, ni fermer. Fermer sur une
          # absence de réponse effacerait une alerte encore vraie.
          [ "$SIGNALER" = "indetermine" ] && exit 0

          if [ "$SIGNALER" = "non" ]; then
            # Se taire fait partie du travail : une alarme qu'il faut éteindre à la main reste allumée.
            [ -n "$existante" ] && gh issue close "$existante" --comment "Les exemples sont sur $DERNIERE. Rien à faire." || true
            exit 0
          fi

          if [ -n "$existante" ]; then gh issue comment "$existante" --body "$CORPS"; else gh issue create --title "$TITRE" --body "$CORPS"; fi
