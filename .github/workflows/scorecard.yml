# ⚠️ CE DÉPÔT AFFIRME SA RIGUEUR PARTOUT — actions épinglées au commit, CodeQL, provenance npm,
# permissions minimales. Une affirmation jamais éprouvée n'est pas une propriété (c'est la règle
# d'init.sql, retournée sur nos pratiques elles-mêmes). Scorecard est le tiers qui recompte :
# l'OpenSSF mesure ces pratiques de l'extérieur, chaque semaine, et PUBLIE le résultat — le badge
# du README pointe vers le détail, pas vers une auto-déclaration. Une pratique qui se dégrade
# (une action dé-épinglée, un jeton trop large) fait bouger un score public au lieu de s'installer.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Hebdomadaire même sans commit : le score dépend aussi de l'écosystème (dépendances,
    # règles de la forge), qui bouge sans nous.
    - cron: "17 6 * * 1"

permissions: read-all

jobs:
  # Renommé en même temps que celui de `codeql.yml` : deux contrôles nommés `analyze` ne se
  # distinguaient que par leur workflow, ce qu'une liste de contrôles requis ne sait pas dire.
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # déposer le SARIF dans l'onglet Sécurité
      id-token: write # signer le résultat publié (publish_results)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
