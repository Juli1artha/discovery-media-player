name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ⚠️ Node 24 pour son npm ≥ 11.5 : c'est la version minimale qui sait s'authentifier
          # auprès de npm par OIDC (« trusted publisher »). Sur Node 20, npm 10 ignore
          # simplement le jeton d'identité et retombe sur NODE_AUTH_TOKEN — donc, une fois le
          # jeton supprimé, une publication qui échoue pour une raison qui n'a rien à voir avec
          # la configuration qu'on vient de faire.
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test

      # ⚠️ La version publiée est celle que sert `?contract=1`. Les laisser diverger ferait mentir
      # le seul point sur lequel un hôte peut épingler ce qu'il vise.
      - name: Tag matches package version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}" \
            || { echo "::error::tag ${GITHUB_REF_NAME} != package.json version"; exit 1; }

      # ⚠️ Rejouable. Une publication est faite de plusieurs étapes, et si l'une échoue après
      # `npm publish`, relancer le workflow buterait sur « cette version existe déjà » — un échec
      # qui masque le vrai. Une version déjà publiée est un succès, pas une erreur.
      - name: Publish to npm (skip if already there)
        run: |
          V=$(node -p 'require("./package.json").version')
          if npm view "discovery-media-player@$V" version >/dev/null 2>&1; then
            echo "::notice::discovery-media-player@$V est déjà publié — étape sautée"
          else
            npm publish --provenance --access public
          fi
        # Aucun NODE_AUTH_TOKEN : l'authentification passe par OIDC (`id-token: write` plus haut)
        # et l'éditeur de confiance déclaré côté npm. Plus aucun secret stocké, plus rien à faire
        # expirer, plus rien à voler. C'est aussi la voie que npm impose progressivement — les
        # jetons qui contournent la 2FA sont en cours de restriction.

      # ⚠️ `github.repository` conserve la casse du compte (`Juli1artha`), or un nom d'image doit
      # être en minuscules. La construction échouait au tout dernier moment, après la publication
      # npm — c'est-à-dire à l'endroit le plus coûteux pour se tromper.
      - name: Image name, lowercased
        id: img
        run: echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:${{ github.ref_name }}
            ${{ steps.img.outputs.ref }}:latest
