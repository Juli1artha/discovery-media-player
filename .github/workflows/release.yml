name: Release

on:
  push:
    tags: ["v*"]
  # ⚠️ RÉCUPÉRATION : trois sorties (0.1.67 → 0.1.69) ont publié npm puis échoué sur les notes —
  # GitHub Release, image, SBOM et provenance sautés, TROIS FOIS SANS QUE PERSONNE NE LE VOIE
  # (celui qui publiait surveillait `npm view`, un artefact sur cinq — septième audit). Le
  # dispatch rejoue la sortie d'un tag existant : npm est sauté (déjà publié), le reste se refait.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à rejouer (ex. v0.1.69)"
        required: true

# ⚠️ RIEN PAR DÉFAUT. CHAQUE JOB DEMANDE CE QU'IL LUI FAUT, ET RIEN D'AUTRE (P1, revue externe
# du 21/08). Avant ce découpage, un job unique portait `contents: write` + `id-token: write` du
# premier `checkout` à la dernière étape — donc AUSSI pendant celle qui télécharge le paquet
# fraîchement publié depuis npm et l'EXÉCUTE (`require`, `player.init`, `player.handler`).
#
# Ce n'est pas une inquiétude de principe : cette étape existe justement parce qu'une version
# publiée s'est révélée cassée à l'exécution (0.1.25). Faire tourner du code venu du registre dans
# un environnement capable de frapper un jeton de publication npm et d'écrire dans le dépôt est le
# contraire du deny-by-default que ce dépôt applique partout ailleurs.
#
# Les CINQ jeux ci-dessous sont DISJOINTS, et c'est la propriété qui compte — pas leur nombre.
# Fusionner deux jobs quelconques rendrait un droit élevé à une étape qui n'en a pas besoin :
#
#   verifier  contents:read + actions:read     → ne publie rien, ne modifie rien
#   publier   contents:read + id-token:write   → SEUL à pouvoir frapper l'identité npm
#   eprouver  contents:read                    → exécute du code TÉLÉCHARGÉ, donc le moins de droits
#   attester  + attestations:write             → signe le tarball, n'exécute rien de téléchargé
#   annoncer  contents:write                   → SEUL à écrire, et n'exécute rien de téléchargé
#
# ⚠️ `attester` est un job À PART, et pas des droits en plus sur `annoncer`. Poser `id-token` et
# `attestations` sur celui qui porte déjà `contents: write` aurait défait la propriété ci-dessus au
# moment même où on l'invoque.
#
# ⚠️ L'image de conteneur (packages/attestations) a migré dans .github/workflows/image.yml —
# elle se construit sur le même tag, EN PARALLÈLE, hors du chemin critique de la publication npm.
permissions: {}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ── 1. VÉRIFIER — rien n'est publié tant que tout ceci n'est pas vrai ────────────────────────
  verifier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # ⚠️ `gh run list` interroge l'API Actions. Le dépôt étant public, la lecture passait jusqu'ici
      # sans que le droit soit déclaré — elle cesserait le jour où il deviendrait privé, et
      # l'échec serait imputé à la CI plutôt qu'aux permissions. On le déclare.
      actions: read
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      # ⚠️ LA SEULE ENTRÉE DE CE DÉPÔT QUE PERSONNE NE RELIT. Tout le reste arrive par une PR, donc
      # sous des yeux ; `workflow_dispatch` non — un collaborateur tape une chaîne dans un champ et
      # elle part directement dans `ref:` de quatre checkouts et dans le nom de la GitHub Release.
      #
      # Elle n'est pas injectable aujourd'hui : `TAG` est LU comme variable d'environnement
      # (`${TAG}`) dans les blocs `run:`, jamais interpolée par `${{ }}` — c'est la règle qui vaut
      # déjà pour les entrées non fiables de `cla.yml`. Mais « pas injectable » et « validée » sont
      # deux choses différentes, et la seconde manquait : une faute de frappe partait jusqu'au
      # checkout pour échouer là-bas, sur un message qui parle de `ref` introuvable et pas de la
      # valeur saisie. Un compte compromis, lui, disposait d'un champ libre sur le workflow qui
      # PUBLIE.
      #
      # On refuse donc ici, en premier, avant tout accès au dépôt : la forme `vX.Y.Z` est la seule
      # que ce projet tague, et `tools/release-preflight.mjs` la confronte ensuite au manifeste.
      - name: The dispatch input looks like a tag of this project
        env:
          TAG_SAISI: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG_SAISI" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::« $TAG_SAISI » n'a pas la forme vX.Y.Z — ce dépôt ne tague que celle-là"; exit 1 ;;
          esac
          printf '%s\n' "$TAG_SAISI" | grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' \
            || { echo "::error::« $TAG_SAISI » contient autre chose qu'une version"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          # ⚠️ L'HISTORIQUE COMPLET EST NÉCESSAIRE À L'ÉTAPE D'ASCENDANCE CI-DESSOUS. Un clone
          # superficiel (le défaut) n'a pas d'ancêtres : `merge-base` y répondrait « non » pour
          # TOUT commit, y compris légitime — une garde qui refuse tout ne garde rien.
          fetch-depth: 0

      # ⚠️ UNE CI VERTE NE DIT PAS QUE LE COMMIT EST DANS `main`.
      #
      # Le contrôle voisin exige que la CI du commit exact soit verte. Une branche de PR a
      # exactement ça : sa CI est verte, et elle n'est pas fusionnée. Rien n'empêchait donc de
      # taguer par erreur la tête d'une PR en cours et de la PUBLIER — un artefact portant le nom
      # du projet, contenant du code que personne n'a approuvé, et que la protection des tags rend
      # ensuite difficile à retirer (P1, audit externe du 22/08).
      #
      # `--is-ancestor` répond exactement à la question posée, et il la pose dans le bon sens : un
      # ancien tag légitime EST un ancêtre de `main`, donc une sortie reste rejouable par dispatch
      # — ce qui est la raison d'être du dispatch. Un commit de PR non fusionné ne l'est pas.
      #
      # Placé AVANT l'attente de la CI : il coûte une seconde, là où l'autre peut attendre trente
      # minutes avant de refuser pour une raison qu'on connaissait déjà.
      - name: The tagged commit belongs to main
        run: |
          git fetch --quiet origin main
          sha=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "$sha est un ancêtre de origin/main — le tag désigne du code fusionné"
          else
            echo "::error::$sha n'est PAS un ancêtre de origin/main — ce tag désigne un commit qui n'appartient pas à la branche par défaut (branche de PR non fusionnée, historique réécrit, mauvais dépôt). On ne publie pas du code que personne n'a fusionné."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # La même majeure que `publier`, pour que les tests qui autorisent la sortie tournent sur
          # le runtime qui la fera. La raison du 24 est écrite là où elle contraint : job `publier`.
          node-version: "24"
          cache: npm
      - run: npm ci

      # ⚠️ LA 0.1.68 A ÉTÉ PUBLIÉE PENDANT QUE SA CI ÉTAIT ROUGE. Ce workflow ne lançait que
      # `npm test` : les bancs navigateur et base, la parité de schéma, les gardes de forme —
      # tout ce que la CI vérifie — n'empêchaient RIEN. On ne duplique pas la CI ici : on EXIGE
      # la sienne, celle du commit exact que le tag désigne, entièrement verte. Publier sur du
      # rouge est le trou jumeau d'une fusion sans protection de branche, côté publication.
      #
      # ⚠️ ET CODEQL EN FAIT PARTIE DEPUIS LE 22/08 (P1, audit externe). Il n'était attendu nulle
      # part : ni dans les contrôles requis de `main`, ni ici, qui n'attendait que le workflow
      # « CI ». Une alerte de sécurité rouge pouvait donc traverser la fusion PUIS la publication
      # sans jamais rien bloquer — un contrôle qui tourne, qui s'affiche, et qui n'a aucun pouvoir.
      # Le vert de CodeQL est cité dans le README ; il vaut mieux qu'il engage à quelque chose.
      #
      # ⚠️ CE CONTRÔLE DÉPEND DE LA RÉTENTION DES COURSES DE LA FORGE, comme celui de la CI avant
      # lui : rejouer par dispatch un tag plus vieux que la fenêtre de rétention ne trouvera plus
      # de course et refusera. C'est le bon sens de l'erreur — on ne publie pas sans verdict — mais
      # c'est un refus qu'il faut savoir lire plutôt que découvrir.
      - name: The exact commit is green on CI and on CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          attendre() {
            nom="$1"
            for i in $(seq 1 40); do
              etat=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$sha" --workflow "$nom" --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
              case "$etat" in
                "completed success") echo "$nom : verte sur $sha"; return 0 ;;
                "completed "*) echo "::error::$nom a conclu « $etat » sur $sha — on ne publie pas sur du rouge"; return 1 ;;
                "") echo "$nom : aucune course encore visible pour $sha ($i/40)" ;;
                *) echo "$nom : en cours, $etat ($i/40)" ;;
              esac
              sleep 45
            done
            echo "::error::$nom ne s'est jamais terminée sur $sha — on ne publie pas sans verdict"
            return 1
          }
          attendre CI || exit 1
          attendre CodeQL || exit 1

      - run: npm test

      # ⚠️ La version publiée est celle que sert `?contract=1`. Les laisser diverger ferait mentir
      # le seul point sur lequel un hôte peut épingler ce qu'il vise.
      - name: Tag matches package version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "${TAG}" \
            || { echo "::error::tag ${TAG} != package.json version"; exit 1; }

      # ── Notes de version : la section du CHANGELOG, pas un journal de commits ────────────────
      # Un changelog écrit à la main dit POURQUOI ; une liste de commits dit quoi. La Release
      # reprend la section de cette version, et échoue si elle n'existe pas — écrire la section
      # fait partie de la sortie, pas de la documentation d'après.
      # ⚠️ AVANT `npm publish`, plus jamais après : placée après, cette étape a échoué TROIS
      # sorties de suite (0.1.67 → 0.1.69) en laissant npm publié et tout le reste sauté — une
      # sortie à moitié faite qui s'annonçait faite. Le contrôle qui conditionne une publication
      # se place avant elle, sinon il ne conditionne rien.
      # Récupération (dispatch sur un vieux tag) : la section peut être née APRÈS le tag — on la
      # reprend alors depuis main, en le disant.
      - name: Extract the changelog section (gates the publication)
        id: notes
        run: |
          V="${TAG#v}"
          extraire() { awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' "$1"; }
          extraire CHANGELOG.md > /tmp/notes.md
          if ! test -s /tmp/notes.md; then
            git fetch --quiet origin main
            git show origin/main:CHANGELOG.md > /tmp/chl-main.md 2>/dev/null || true
            [ -f /tmp/chl-main.md ] && extraire /tmp/chl-main.md > /tmp/notes.md
            test -s /tmp/notes.md && echo "::notice::section $V absente du tag — reprise depuis main (récupération)"
          fi
          test -s /tmp/notes.md || { echo "::error::no CHANGELOG section for $V — pas de notes, pas de sortie"; exit 1; }
          { echo "body<<EOFNOTES"; cat /tmp/notes.md; echo "EOFNOTES"; } >> "$GITHUB_OUTPUT"

  # ── 2. PUBLIER — le SEUL job capable de frapper l'identité npm ───────────────────────────────
  #
  # ⚠️ IL NE FAIT QUE ÇA. `id-token: write` autorise à obtenir, par OIDC, une identité qui publie
  # sous ce nom sur le registre. Chaque étape supplémentaire dans ce job serait une étape de plus
  # à s'exécuter à portée de ce droit. Les contrôles sont AVANT (`verifier`), les constats APRÈS
  # (`eprouver`), et aucun des deux n'a besoin d'être ici.
  #
  # ⚠️ CE QUI RESTE, ET QU'ON NE PEUT PAS SORTIR : `npm publish` déclenche `prepublishOnly`
  # (`npm run build && npm test`), et `npm ci` installe l'arbre de développement. Ce code-là tourne
  # donc encore à portée du jeton — mais c'est le code du dépôt, au commit exact que `verifier`
  # vient de déclarer vert, et des dépendances figées par le lockfile. C'est une autre nature de
  # risque que d'exécuter un tarball fraîchement téléchargé du registre, qui, lui, part d'ici.
  publier:
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC : publication npm sans jeton stocké
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # ⚠️ npm ≥ 11.5 est la version minimale qui sait s'authentifier auprès de npm par OIDC.
          # Sur une version antérieure, npm ignore le jeton d'identité et cherche un NODE_AUTH_TOKEN
          # qui n'existe plus — l'échec serait imputé à l'éditeur de confiance.
          node-version: "24"
          cache: npm
      - run: npm ci

      # Rejouable : une sortie fait plusieurs choses, et si l'une échoue après la publication npm,
      # relancer buterait sur « cette version existe déjà » — un échec qui masque le vrai.
      - name: Publish to npm (skip if already there)
        run: |
          V=$(node -p 'require("./package.json").version')
          if npm view "discovery-media-player@$V" version >/dev/null 2>&1; then
            echo "::notice::discovery-media-player@$V is already published — skipped"
          else
            npm publish --provenance --access public
          fi

  # ── 3. ÉPROUVER — le job qui exécute du code VENU DU REGISTRE, donc celui qui a le moins ─────
  #
  # ⚠️ C'EST LE JOB QUI MOTIVAIT LE DÉCOUPAGE. Sa dernière étape installe `discovery-media-player`
  # depuis npm et l'exécute pour rendre une page. Il lui faut lire le dépôt, rien de plus : ni
  # écrire, ni publier. Avant, ces mêmes lignes tournaient avec les deux.
  eprouver:
    needs: publier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      # ⚠️ La démo épingle une version EXACTE (le contrat l'exige pour tout le monde, elle
      # comprise). Elle ne suit donc pas toute seule, et personne ne regarde une démo qui marche :
      # elle est restée trois versions en arrière sans que rien ne le signale. Non bloquant — la
      # démo ne peut pointer une version qu'APRÈS sa publication, donc l'ordre correct est
      # publier puis monter. Mais c'est écrit dans le résumé de la sortie, là où on le lit.
      - name: Is the live demo still on the current version?
        run: |
          V=$(node -p 'require("./package.json").version')
          D=$(node -p 'require("./examples/demo/package.json").dependencies["discovery-media-player"]')
          if [ "$V" != "$D" ]; then
            echo "::notice::the live demo still pins $D — bump examples/demo/package.json to $V"
            echo "⚠️ **La démo en ligne épingle \`$D\`** — à monter en \`$V\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ La démo est sur \`$V\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ⚠️ CE QUI A MANQUÉ LE 14/08 : PERSONNE NE REGARDAIT L'ARTEFACT.
      #
      # Une version a été publiée, annoncée à l'hôte qui l'attendait, et ne contenait pas le
      # correctif promis — un commit resté sur une branche dont la PR était déjà fusionnée. Rien
      # dans la chaîne ne pouvait le voir : les tests tournent sur l'arbre de travail, la CI sur
      # la branche, et les notes de version viennent d'un fichier écrit à la main. C'est l'HÔTE
      # qui l'a trouvé, en comparant deux tarballs npm.
      #
      # Ce résumé liste ce qui a RÉELLEMENT changé dans le paquet depuis la version précédente.
      # Une note de version qui promet un correctif de `server/handler.js` en face d'une liste qui
      # ne le mentionne pas se voit d'un coup d'œil — ce qui est exactement le contrôle qui
      # manquait. Non bloquant : c'est un révélateur, pas une règle.
      - name: What actually changed in the published package
        run: |
          V=$(node -p 'require("./package.json").version')
          # ⚠️ `jq` plutôt qu'un `node -e` : la réponse du registre est une DONNÉE, et elle passait
          # dans un interpréteur JavaScript. Le risque est faible ici — npm rend du JSON — mais la
          # forme dit le contraire de ce que ce dépôt pratique partout ailleurs, et un lecteur
          # pressé y voit une invitation à en écrire un autre.
          PREC=$(npm view discovery-media-player versions --json \
            | jq -r --arg v "$V" '[.[] | select(. != $v)] | last // empty')
          echo "## Contenu réel du paquet" >> "$GITHUB_STEP_SUMMARY"
          # ⚠️ MÊME HASARD QUE CI-DESSOUS : un rejeu sur un tag antérieur à cet outil ne l'aurait
          # pas dans son arbre. On le DIT dans le bloc au lieu de faire échouer la sortie — « on n'a
          # pas pu regarder » n'est pas « rien n'a changé », et une Release amputée de sa table vaut
          # mieux qu'une Release absente.
          if [ ! -f tools/zones-du-tarball.mjs ]; then
            printf '%s\n' "_This tag predates the per-zone comparison, so it was **not made**. This says nothing about what changed._" > "$BLOC"
          elif [ -z "$PREC" ]; then
            echo "Première publication — rien à comparer." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p /tmp/cmp && cd /tmp/cmp
          npm pack "discovery-media-player@$PREC" --silent >/dev/null 2>&1 || exit 0
          mkdir -p a b && tar xzf "discovery-media-player-$PREC.tgz" -C a --strip-components=1
          cd "$GITHUB_WORKSPACE" && npm pack --silent >/dev/null
          tar xzf "discovery-media-player-$V.tgz" -C /tmp/cmp/b --strip-components=1
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Fichiers modifiés entre \`$PREC\` et \`$V\` :" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          diff -rq /tmp/cmp/a /tmp/cmp/b 2>/dev/null | sed 's|/tmp/cmp/[ab]/||g' | sort -u >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ Comparez cette liste aux notes de version : un correctif annoncé dans un fichier absent d'ici n'est pas publié." >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ CE QUI EST PUBLIÉ S'EXÉCUTE-T-IL ? C'EST UN AUTRE AXE.
      #
      # L'étape ci-dessus compare le CONTENU du paquet à la version précédente ; la tâche horaire
      # `publication.yml` vérifie que ce que `main` déclare est bien publié. Aucune des deux
      # n'aurait attrapé 0.1.25 : elle était publiée, conforme à `main`, et son contenu différait
      # bien de 0.1.24. Elle était simplement CASSÉE — un `return var h2={…}` dans le script en
      # ligne, et toute la couche live morte.
      #
      # Ce qui l'a trouvée, c'est un hôte qui a rendu une page depuis le paquet installé. Le second
      # hôte l'a formulé : « le vôtre vérifie que ce qui est écrit est publié, le nôtre que ce qui
      # est publié s'exécute — aucun des deux ne couvre l'autre ».
      #
      # Cette étape ferme cet axe-là, sur le paquet TÉLÉCHARGÉ DEPUIS LE REGISTRE et non sur l'arbre
      # de travail : on l'installe, on rend une page, on COMPILE chacun de ses scripts en ligne.
      # ⚠️ Elle échoue la course. Une version cassée qui reste publiée sans que rien ne le dise est
      # exactement ce qui est arrivé, et ça s'est vu chez un tiers.
      - name: The published package renders and its scripts compile
        run: |
          V=$(node -p 'require("./package.json").version')
          # Le registre met quelques instants à servir une version fraîche.
          for i in $(seq 1 20); do npm view "discovery-media-player@$V" version >/dev/null 2>&1 && break || sleep 6; done
          mkdir -p /tmp/fume && cd /tmp/fume && npm init -y >/dev/null
          # ⚠️ CE `npm i` DEPUIS LE REGISTRE RESTE NON ÉPINGLÉ EN CONNAISSANCE DE CAUSE (Scorecard
          # le signale) : ce test de fumée éprouve précisément CE QUE LE REGISTRE SERT aux vrais
          # consommateurs, minutes après la publication. L'épingler par un lockfile local
          # reviendrait à éprouver notre copie plutôt que la leur — et l'empreinte, elle, est déjà
          # confrontée ailleurs : le job attester refuse si le sha512 du registre diffère du build.
          npm i "discovery-media-player@$V" --silent
          node -e '
            const vm = require("node:vm");
            const P = "/tmp/fume/node_modules/discovery-media-player";
            const id = require.resolve(P + "/server/presentations.js");
            const vraies = require(id);
            require.cache[id] = { id, filename: id, loaded: true, exports: { ...vraies,
              getPresentation: async () => ({ slug: "s1", doc_title: "T", file_name: "d.pdf",
                file_url: "https://x.supabase.co/storage/v1/object/public/r/d.pdf", current_page: 1, active: true }),
              listMessages: async () => [] } };
            const player = require(P);
            player.init({
              plugins: {}, has: () => false,
              storage: { isAllowedUrl: () => true, async fetchFile() { return null; }, async put() {} },
              db: { async request() { return []; }, async selectAll() { return []; } },
              mail: { async send() {} },
              identity: { async verifyToken() { return null; }, roleOf: () => "", isAdmin: () => false, async canManageShares() { return false; } },
              limits: { async allow() { return true; } },
              branding: { async logo() { return ""; }, name: "", poweredBy: "", loaderName: "", async forKey() { return null; }, title: (b) => b },
              errors: { async capture() {} },
              legal: { sourceUrl: "", legalUrl: "", privacyUrl: "", trackingNotice: "", trackingNoticeAnonymous: "", publicUrl: "" },
              config: { supabaseUrl: "https://x.supabase.co", supabasePublishableKey: "k", mapsKey: "", extraFrameAncestors: [] },
            });
            (async () => {
              const res = { statusCode: 0, body: "", setHeader() {}, end(b) { this.body = String(b || ""); } };
              await player.handler({ method: "GET", headers: {}, socket: {}, query: { present: "s1" } }, res);
              const blocs = [...res.body.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)].map((m) => m[1]).filter((c) => c.trim());
              if (!blocs.length) { console.error("::error::la page publiée ne contient aucun script en ligne"); process.exit(1); }
              let ko = 0;
              for (const c of blocs) { try { new vm.Script(c); } catch (e) { ko++; console.error("::error::script en ligne non compilable : " + e.message); } }
              if (ko) process.exit(1);
              console.log("page rendue : " + res.body.length + " octets, " + blocs.length + " scripts, tous compilables");
            })();'

  # ── 4. ATTESTER — le tarball, CONFRONTÉ au registre, puis prouvé ─────────────────────────────
  #
  # ⚠️ CE QU'UN CONSOMMATEUR NE PEUT PAS VÉRIFIER AUJOURD'HUI. La publication npm porte une
  # provenance SLSA depuis longtemps, et elle est excellente — mais elle n'est visible QUE depuis
  # npm. Quelqu'un qui arrive par la page des Releases, ou par l'image de conteneur, n'a rien : les
  # archives sources que GitHub attache automatiquement ne sont ni l'artefact publié ni signées.
  # Il lui reste à faire confiance, ce qui est précisément ce que ce dépôt refuse ailleurs.
  #
  # ⚠️ ET ON N'ATTACHE PAS UN SECOND EXEMPLAIRE NON CONFRONTÉ. Reconstruire un tarball et le poser
  # à côté de celui de npm fabriquerait deux artefacts du même nom : le jour où ils divergent,
  # celui qui vérifie l'un croit avoir vérifié l'autre. `npm pack` est reproductible (vérifié : deux
  # exécutions, même condensat), donc on peut CONFRONTER — le sha512 du tarball local doit être
  # celui que le registre annonce dans `dist.integrity`, sinon on refuse.
  #
  # ⚠️ IL FAUT CONSTRUIRE AVANT DE PACKER, ET JE L'AI APPRIS EN LE RATANT.
  #
  # La première version de ce job packait sans rien installer, au motif que « `npm pack` n'a pas
  # besoin de l'arbre de développement ». C'est vrai, et c'est hors sujet : `dist/` est IGNORÉ PAR
  # GIT et construit par `prepublishOnly` au moment de publier. Le tarball packé sur l'arbre nu ne
  # contient donc pas `dist/` — 308 395 octets au lieu de 311 695 — et la confrontation a refusé,
  # ce qui est exactement ce qu'on lui demande. Le rejeu de v0.1.128 du 22/08 l'a montré en 82
  # secondes ; sans ce rejeu, on l'aurait découvert à la prochaine vraie sortie.
  #
  # `npm ci --ignore-scripts && npm run build && npm pack` reproduit le tarball publié à l'octet
  # près — vérifié sur v0.1.128, même sha256 et même taille que ce que sert le registre.
  #
  # ⚠️ `--ignore-scripts` n'est pas décoratif : ce job porte `id-token` et `attestations` en
  # écriture, et c'est ce qui l'empêche d'exécuter les scripts d'installation des dépendances.
  # Vérifié aussi : la reproduction tient sans eux. Reste la construction elle-même, qui est le
  # code du dépôt — la même chose que `publier` fait déjà sous un droit de même classe.
  attester:
    needs: eprouver
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC : signer l'attestation sans jeton stocké
      attestations: write    # la déposer dans le magasin de la forge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts

      - id: paquet
        name: Build, pack, and confront the tarball with what the registry actually serves
        run: |
          V=$(node -p 'require("./package.json").version')
          # `dist/` est ignoré par git : sans cette construction, le tarball packé ne le contient
          # pas et ne peut pas être celui que le registre sert.
          npm run build --silent >/dev/null
          mkdir -p /tmp/sortie
          npm pack --pack-destination /tmp/sortie --silent >/dev/null
          F=$(ls /tmp/sortie/*.tgz)
          [ -n "$F" ] || { echo "::error::npm pack n'a produit aucun tarball"; exit 1; }

          # ⚠️ LA CONFRONTATION. `dist.integrity` est le sha512 que le registre SERT ; le nôtre doit
          # être le même octet pour octet. S'ils diffèrent, on ne sait pas lequel des deux les gens
          # installent — et attacher le mauvais serait pire que ne rien attacher.
          LOCAL="sha512-$(openssl dgst -sha512 -binary "$F" | base64 -w0)"
          PUBLIE=$(npm view "discovery-media-player@$V" dist.integrity 2>/dev/null || echo "")
          [ -n "$PUBLIE" ] || { echo "::error::le registre n'a pas rendu dist.integrity pour $V — on n'attache pas un tarball qu'on n'a pas pu confronter"; exit 1; }
          if [ "$LOCAL" != "$PUBLIE" ]; then
            echo "::error::le tarball reconstruit DIFFÈRE de celui que npm sert pour $V"
            echo "::error::  local  : $LOCAL"
            echo "::error::  publié : $PUBLIE"
            exit 1
          fi
          echo "tarball confronté : $(basename "$F") — identique à ce que le registre sert"

          ( cd /tmp/sortie && sha256sum "$(basename "$F")" > "$(basename "$F").sha256" )
          echo "chemin=$F" >> "$GITHUB_OUTPUT"

      # ⚠️ L'IMAGE AVAIT SON SBOM, LE PAQUET NON — et c'est le paquet que la plupart des gens
      # installent. `image.yml` produit `sbom: true` depuis toujours ; le tarball npm, lui, ne
      # disait nulle part ce qu'il contient. Un consommateur qui doit répondre « suis-je concerné
      # par cette CVE ? » devait le déduire de `package.json`, à la main, version par version.
      #
      # ⚠️ ICI ET PAS DANS `annoncer`, ET C'EST LE DÉCOUPAGE DE CE WORKFLOW QUI L'IMPOSE. Ma
      # première version le produisait dans `annoncer`, qui portait alors le `npm ci` nécessaire —
      # or `annoncer` est le SEUL job à détenir `contents: write`, et le commentaire en tête de ce
      # fichier dit pourquoi il ne doit rien installer. `attester` a déjà l'arbre, déjà
      # `--ignore-scripts`, et pas le droit d'écrire : le SBOM se fabrique là où le tarball se
      # fabrique, et voyage avec lui.
      #
      # Le nom suit celui du tarball — la VERSION, pas le tag : un SBOM détaché de ce qu'il décrit
      # ne décrit plus rien, et `discovery-media-player-0.1.129.cdx.json` se range de lui-même à
      # côté de `discovery-media-player-0.1.129.tgz`.
      - name: Software bill of materials, beside the tarball it describes
        run: |
          V=$(node -p 'require("./package.json").version')
          CIBLE="/tmp/sortie/discovery-media-player-$V.cdx.json"
          npm sbom --sbom-format cyclonedx --omit=dev > "$CIBLE"
          node -e '
            const f = process.argv[1];
            const b = JSON.parse(require("fs").readFileSync(f, "utf8"));
            if (b.bomFormat !== "CycloneDX") { console.error("::error::" + f + " nest pas un CycloneDX"); process.exit(1); }
            if (!Array.isArray(b.components) || !b.components.length) {
              console.error("::error::SBOM sans composant — il decrirait un paquet vide"); process.exit(1);
            }
            console.log("SBOM : " + b.components.length + " composant(s)");
          ' "$CIBLE"

      # La provenance SLSA de CE fichier exact, vérifiable par `gh attestation verify <tarball>`.
      - uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        id: attestation
        with:
          subject-path: ${{ steps.paquet.outputs.chemin }}

      # ⚠️ « RIEN DE CE QUE L'HÔTE EXÉCUTE N'A CHANGÉ » EST LA PHRASE QUI DÉCIDE D'UNE MONTÉE, et
      # elle était calculée après coup, à la main, par l'hôte de production — deux fois, pour la
      # 0.1.134 puis la 0.1.135. Elle se calcule ici, sur les DEUX TARBALLS.
      #
      # ⚠️ CE QUI COMPTE N'EST PAS LA PHRASE, C'EST QU'ELLE SOIT MÉCANIQUE. Une mention « docs
      # seulement » tapée à la main dans les notes se revérifie — l'hôte l'a dit et l'a fait. Une
      # mention produite par la chaîne se recoupe une fois, puis on s'appuie dessus.
      #
      # ⚠️ ET LE BLOC EST TOUJOURS ÉCRIT, MÊME QUAND ON NE PEUT PAS CONCLURE : un bloc absent
      # disparaîtrait des notes sans un mot, et le lecteur croirait qu'il n'y avait rien à dire.
      # « On n'a pas pu regarder » et « rien n'a changé » ne se ressemblent que si on les tait.
      - name: What changed in the package, by zone, measured on the two tarballs
        env:
          # ⚠️ LA VALEUR SORT DU TEXTE. Interpolée dans le script, elle serait relue par une
          # grammaire qui n'est pas la sienne — et tout caractère auquel CETTE grammaire donne un
          # sens devient un piège, qu'il ferme quelque chose ou non. Par l'environnement, il n'y a
          # plus de grammaire, donc plus de caractère spécial : la question ne se pose plus au lieu
          # de se poser mieux.
          CHEMIN_PAQUET: ${{ steps.paquet.outputs.chemin }}
        run: |
          V=$(node -p 'require("./package.json").version')
          BLOC=/tmp/sortie/zones.md
          mkdir -p /tmp/sortie /tmp/precedent
          PREC=$(npm view discovery-media-player versions --json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",async()=>{
                const {versionPrecedente}=await import("./tools/zones-du-tarball.mjs");
                let v=[]; try{v=JSON.parse(s)}catch{}
                process.stdout.write(versionPrecedente(Array.isArray(v)?v:[v],process.argv[1])||"")})' "$V" || echo "")
          if [ -z "$PREC" ]; then
            printf '%s\n' "_No previous published version to compare against._" > "$BLOC"
          elif ! ( cd /tmp/precedent && npm pack "discovery-media-player@$PREC" >/dev/null 2>&1 ); then
            printf '%s\n' "_The previous package (\`$PREC\`) could not be fetched, so the per-zone comparison was **not made**. This says nothing about what changed._" > "$BLOC"
          else
            node tools/zones-du-tarball.mjs "$(ls /tmp/precedent/*.tgz)" "$CHEMIN_PAQUET" "$PREC" "$V" > "$BLOC"
          fi
          cat "$BLOC"

      # ⚠️ LE NOM DU BUNDLE EST DEVENU UNE PROPRIÉTÉ, ET VOICI CE QU'IL COÛTAIT. L'artefact
      # gardait le nom du fichier temporaire de l'action : `attestation.json`. Or l'OpenSSF
      # Scorecard — la v5.5.0, celle qu'embarque l'action épinglée par scorecard.yml — ne
      # reconnaît une signature de release QU'À son suffixe : `.asc`, `.minisig`, `.sig`,
      # `.sign`, `.sigstore`, `.sigstore.json` (probes/releasesAreSigned/impl.go, vérifié sur le
      # source du tag v5.5.0). Une vraie attestation Sigstore sous le mauvais nom comptait ZÉRO :
      # Signed-Releases 0/10, pour un dépôt qui signe chaque sortie depuis la 0.1.130.
      #
      # `.sigstore.json` n'est pas un déguisement : c'est l'extension que la spécification des
      # bundles Sigstore prescrit pour leur sérialisation JSON, et ce fichier EST un tel bundle.
      # On VÉRIFIE son mediaType avant de poser le nom — poser un nom sans vérifier ce qu'il
      # promet est exactement le mensonge d'étiquette que la garde des actions refuse ailleurs.
      # Et on ne prétend PAS `.intoto.jsonl` (la provenance, comptée 10/10) : le bundle CONTIENT
      # une provenance in-toto dans son enveloppe DSSE, mais il n'est pas ce format-là, et un nom
      # qui annonce un format qu'on ne produit pas ferait de la note un mensonge.
      #
      # Le nom porte la VERSION, comme le tarball et le SBOM : un bundle détaché de ce qu'il
      # signe ne signe plus rien d'identifiable.
      # ⚠️ CE CONTRÔLE N'APPELLE AUCUN FICHIER DU DÉPÔT, ET C'EST LA RAISON DE SA FORME. Un rejeu
      # par `workflow_dispatch` exécute le workflow de `main` contre le CONTENU DU TAG : une étape
      # qui appelle `node tools/…` échoue sur tout tag antérieur à ce fichier — donc exactement sur
      # les sorties que le dispatch existe pour rattraper. `jq` est déjà utilisé par quatre
      # workflows ici et vit sur le runner, pas dans l'arbre.
      #
      # ⚠️ ET IL N'Y A PLUS DE JAVASCRIPT DANS UNE CHAÎNE SHELL. La première écriture était
      # `node -e '…'` entre guillemets simples et contenait « d'attestation » : l'apostrophe fermait
      # la chaîne, bash analysait le JavaScript restant et butait sur une parenthèse. Ce job est mort
      # là à la 0.1.136 — npm publié, aucune Release, aucune attestation. Un `case` sur une variable
      # n'a pas de citation à tenir : la classe est supprimée, pas surveillée.
      #
      # Un nom affirme un format, donc le format se vérifie AVANT de poser « .sigstore.json ».
      - name: Gather what the Release will carry — the bundle under its recognized name
        env:
          # ⚠️ Même raison qu'au-dessus : une valeur qui partage une ligne avec de la syntaxe ne
          # peut pas être délimitée sans lire son contenu — et ce qu'un lecteur ne peut pas
          # délimiter, un analyseur extérieur ne le peut pas non plus.
          BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          V=$(node -p 'require("./package.json").version')
          MT=$(jq -r '.mediaType // ""' "$BUNDLE")
          case "$MT" in
            application/vnd.dev.sigstore.bundle*)
              echo "bundle Sigstore confirme : $MT" ;;
            "")
              echo "::error::$BUNDLE ne declare aucun mediaType — on ne pose pas un nom .sigstore.json qui pretendrait un format absent"
              exit 1 ;;
            *)
              echo "::error::$BUNDLE declare le mediaType « $MT » — attendu application/vnd.dev.sigstore.bundle*. Un nom affirme un format ; celui-ci ne correspond pas"
              exit 1 ;;
          esac
          cp "$BUNDLE" "/tmp/sortie/discovery-media-player-$V.sigstore.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paquet-atteste
          path: /tmp/sortie/
          if-no-files-found: error

  # ── 4. ANNONCER — le SEUL job qui écrit dans le dépôt, et il n'exécute rien de téléchargé ────
  #
  # ⚠️ EN DERNIER, ET C'EST DÉLIBÉRÉ. La Release n'apparaît qu'une fois le paquet publié ÉPROUVÉ :
  # une annonce qui précède la preuve est exactement la sortie « à moitié faite qui s'annonçait
  # faite » que ce workflow a déjà connue trois fois (0.1.67 → 0.1.69).
  #
  # Les notes ne sont pas relues ici : `verifier` les a extraites AVANT toute publication, et les
  # passe en sortie de job. C'est ce qui garantit qu'une section de CHANGELOG manquante arrête la
  # sortie au lieu de la laisser à moitié faite — le contrôle qui conditionne une publication se
  # place avant elle, sinon il ne conditionne rien.
  #
  # ⚠️ LE `checkout` EST GARDÉ, ET C'EST UN CHOIX DE PRUDENCE ASSUMÉ. Ce job n'a besoin que du tag
  # et des notes, donc un clone serait en principe superflu. Mais le comportement de
  # `action-gh-release` sans espace de travail n'a pas pu être vérifié ici, et ce chemin ne
  # s'exerce qu'au moment d'une sortie : une erreur y resterait invisible jusqu'au pire moment.
  # Un clone n'EXÉCUTE rien — c'était l'exécution de code téléchargé, pas la présence des sources,
  # que le découpage visait. `persist-credentials: false` évite au passage de laisser un jeton
  # capable d'écrire dans le `.git/config` du seul job qui peut écrire.
  annoncer:
    needs: [verifier, attester]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # créer la Release GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: paquet-atteste
          path: paquet

      # ⚠️ UN MOTIF QUI NE CORRESPOND À RIEN NE FAIT PAS ÉCHOUER `action-gh-release` : IL SE TAIT.
      #
      # Constaté sur le rejeu du 22/08. Le motif disait `*.jsonl` ; le bundle produit s'appelait
      # alors `attestation.json`. La Release a reçu DEUX fichiers sur les trois promis, et les cinq
      # jobs étaient verts. Une promesse tenue à deux tiers, sans un mot — la garde muette que ce
      # dépôt refuse depuis la 0.1.35, replacée ici par mes soins.
      #
      # Le nom du bundle est depuis posé PAR NOUS dans `attester` (voir le commentaire là-bas :
      # `.sigstore.json`, le suffixe que Scorecard reconnaît comme signature), après vérification
      # de son mediaType. Cette étape reste ce qui transforme un nom qui dériverait — retour au
      # nom de l'action, action qui change son fichier — en refus plutôt qu'en fichier manquant.
      - name: The four files the Release must carry are actually there
        run: |
          manquants=0
          for motif in "paquet/"*.tgz "paquet/"*.tgz.sha256 "paquet/"*.sigstore.json "paquet/"*.cdx.json; do
            if [ ! -e "$motif" ]; then
              echo "::error::aucun fichier pour « $motif » — la Release en porterait un de moins, en silence"
              manquants=1
            fi
          done
          ls -l paquet/
          [ "$manquants" = 0 ] || exit 1

      # ⚠️ Le bloc des zones n'est PAS un fichier attaché — il ne rejoint donc pas la garde de
      # présence d'à côté, dont un banc exige qu'elle soit exactement `files:`. Il a sa protection
      # ici : s'il manquait, le corps de la Release perdrait la table sans un mot, ce qui est
      # précisément ce que cette Release a déjà vécu avec un motif qui ne correspondait à rien.
      - name: Compose the Release body — the notes, what changed by zone, and any provenance gap
        env:
          NOTES: ${{ needs.verifier.outputs.notes }}
          DECLENCHEUR: ${{ github.event_name }}
          SHA_DU_DECLENCHEMENT: ${{ github.sha }}
        run: |
          [ -s paquet/zones.md ] || { echo "::error::paquet/zones.md manquant ou vide — le corps de la Release perdrait la table des zones en silence"; exit 1; }
          printf '%s\n\n' "$NOTES" > corps.md
          cat paquet/zones.md >> corps.md

          # ⚠️ UN REJEU DÉCLENCHÉ AILLEURS QUE SUR LE TAG ATTESTE LE MAUVAIS COMMIT, EN SILENCE.
          # L'attestation nomme la référence du DÉCLENCHEMENT, pas celle du tag : la 0.1.136,
          # rejouée depuis `main`, porte `refs/heads/main` et le commit 4efb5a0b, alors que
          # l'archive vient de d0bfe3d8. Mesuré après coup par un hôte : sur 59 fichiers publiés
          # suivis par git, 0 diffèrent du tag et 32 diffèrent du commit attesté.
          #
          # Ce n'est ni la signature ni les octets qui sont en cause — c'est le LIEN source →
          # artefact. Quelqu'un qui reconstruit depuis le commit nommé obtient un écart qu'il ne
          # peut pas distinguer d'une altération. Et la seule vérification capable d'attraper un
          # vrai remplacement est alors celle qui échoue pour une raison bénigne : on apprend à
          # l'ignorer, ce qui est pire que de ne pas l'avoir.
          #
          # On ne peut pas le corriger ici — l'attestation est déjà signée quand ce job tourne — donc
          # ON LE DIT, dans le corps que le lecteur a sous les yeux au moment de vérifier.
          TAG_SHA=$(git rev-parse HEAD)
          if [ "$DECLENCHEUR" = "workflow_dispatch" ] && [ "$TAG_SHA" != "$SHA_DU_DECLENCHEMENT" ]; then
            {
              printf '\n---\n\n'
              printf '### ⚠️ This release was replayed, and its provenance names another commit\n\n'
              printf 'The attestation records the commit of the **ref this run was dispatched from**, not the tag:\n\n'
              printf '```\n'
              printf 'attested commit   %s   (the dispatch ref)\n' "$SHA_DU_DECLENCHEMENT"
              printf 'tag commit        %s   (what the archive was actually built from)\n' "$TAG_SHA"
              printf '```\n\n'
              printf 'The signature, the builder and the bytes are sound — the archive matches the tag.\n'
              printf 'What diverges is the **source → artefact link**: rebuilding from the attested commit\n'
              printf 'will **not** reproduce this archive, and that mismatch is indistinguishable from\n'
              printf 'tampering unless you know to expect it. Verify against the tag commit above.\n'
            } >> corps.md
            echo "::warning::provenance rejouée : attestée sur $SHA_DU_DECLENCHEMENT, construite depuis $TAG_SHA — l'écart est écrit dans le corps de la Release"
          fi
          wc -l corps.md

      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: corps.md
          generate_release_notes: false
          make_latest: true
          # Le tarball CONFRONTÉ au registre, son condensat, le bundle Sigstore qui le signe —
          # sous le suffixe que Scorecard reconnaît — et le SBOM de ce qu'il contient.
          # `gh attestation verify paquet/*.tgz --repo Juli1artha/discovery-media-player`.
          files: |
            paquet/*.tgz
            paquet/*.tgz.sha256
            paquet/*.sigstore.json
            paquet/*.cdx.json
