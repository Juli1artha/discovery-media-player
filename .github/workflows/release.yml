name: Release

on:
  push:
    tags: ["v*"]
  # ⚠️ RÉCUPÉRATION : trois sorties (0.1.67 → 0.1.69) ont publié npm puis échoué sur les notes —
  # GitHub Release, image, SBOM et provenance sautés, TROIS FOIS SANS QUE PERSONNE NE LE VOIE
  # (celui qui publiait surveillait `npm view`, un artefact sur cinq — septième audit). Le
  # dispatch rejoue la sortie d'un tag existant : npm est sauté (déjà publié), le reste se refait.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à rejouer (ex. v0.1.69)"
        required: true

permissions:
  contents: write        # créer la Release GitHub
  packages: write        # pousser l'image sur ghcr
  id-token: write        # OIDC : publication npm sans jeton stocké
  attestations: write    # provenance de l'image

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # ⚠️ npm ≥ 11.5 est la version minimale qui sait s'authentifier auprès de npm par OIDC.
          # Sur une version antérieure, npm ignore le jeton d'identité et cherche un NODE_AUTH_TOKEN
          # qui n'existe plus — l'échec serait imputé à l'éditeur de confiance.
          node-version: "24"
          cache: npm
      - run: npm ci

      # ⚠️ LA 0.1.68 A ÉTÉ PUBLIÉE PENDANT QUE SA CI ÉTAIT ROUGE. Ce workflow ne lançait que
      # `npm test` : les bancs navigateur et base, la parité de schéma, les gardes de forme —
      # tout ce que la CI vérifie — n'empêchaient RIEN. On ne duplique pas la CI ici : on EXIGE
      # la sienne, celle du commit exact que le tag désigne, entièrement verte. Publier sur du
      # rouge est le trou jumeau d'une fusion sans protection de branche, côté publication.
      - name: The exact commit's CI is entirely green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for i in $(seq 1 40); do
            etat=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$sha" --workflow CI --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
            case "$etat" in
              "completed success") echo "CI verte sur $sha"; exit 0 ;;
              "completed "*) echo "::error::la CI du commit $sha a conclu « $etat » — on ne publie pas sur du rouge"; exit 1 ;;
              "") echo "aucune course CI encore visible pour $sha ($i/40)" ;;
              *) echo "CI en cours : $etat ($i/40)" ;;
            esac
            sleep 45
          done
          echo "::error::la CI de $sha ne s'est jamais terminée — on ne publie pas sans verdict"; exit 1

      - run: npm test

      # ⚠️ La version publiée est celle que sert `?contract=1`. Les laisser diverger ferait mentir
      # le seul point sur lequel un hôte peut épingler ce qu'il vise.
      - name: Tag matches package version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "${TAG}" \
            || { echo "::error::tag ${TAG} != package.json version"; exit 1; }

      # ── Notes de version : la section du CHANGELOG, pas un journal de commits ────────────────
      # Un changelog écrit à la main dit POURQUOI ; une liste de commits dit quoi. La Release
      # reprend la section de cette version, et échoue si elle n'existe pas — écrire la section
      # fait partie de la sortie, pas de la documentation d'après.
      # ⚠️ AVANT `npm publish`, plus jamais après : placée après, cette étape a échoué TROIS
      # sorties de suite (0.1.67 → 0.1.69) en laissant npm publié et tout le reste sauté — une
      # sortie à moitié faite qui s'annonçait faite. Le contrôle qui conditionne une publication
      # se place avant elle, sinon il ne conditionne rien.
      # Récupération (dispatch sur un vieux tag) : la section peut être née APRÈS le tag — on la
      # reprend alors depuis main, en le disant.
      - name: Extract the changelog section (gates the publication)
        id: notes
        run: |
          V="${TAG#v}"
          extraire() { awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' "$1"; }
          extraire CHANGELOG.md > /tmp/notes.md
          if ! test -s /tmp/notes.md; then
            git fetch --quiet origin main
            git show origin/main:CHANGELOG.md > /tmp/chl-main.md 2>/dev/null || true
            [ -f /tmp/chl-main.md ] && extraire /tmp/chl-main.md > /tmp/notes.md
            test -s /tmp/notes.md && echo "::notice::section $V absente du tag — reprise depuis main (récupération)"
          fi
          test -s /tmp/notes.md || { echo "::error::no CHANGELOG section for $V — pas de notes, pas de sortie"; exit 1; }
          { echo "body<<EOFNOTES"; cat /tmp/notes.md; echo "EOFNOTES"; } >> "$GITHUB_OUTPUT"

      # Rejouable : une sortie fait plusieurs choses, et si l'une échoue après la publication npm,
      # relancer buterait sur « cette version existe déjà » — un échec qui masque le vrai.
      - name: Publish to npm (skip if already there)
        run: |
          V=$(node -p 'require("./package.json").version')
          if npm view "discovery-media-player@$V" version >/dev/null 2>&1; then
            echo "::notice::discovery-media-player@$V is already published — skipped"
          else
            npm publish --provenance --access public
          fi

      # ⚠️ La démo épingle une version EXACTE (le contrat l'exige pour tout le monde, elle
      # comprise). Elle ne suit donc pas toute seule, et personne ne regarde une démo qui marche :
      # elle est restée trois versions en arrière sans que rien ne le signale. Non bloquant — la
      # démo ne peut pointer une version qu'APRÈS sa publication, donc l'ordre correct est
      # publier puis monter. Mais c'est écrit dans le résumé de la sortie, là où on le lit.
      - name: Is the live demo still on the current version?
        run: |
          V=$(node -p 'require("./package.json").version')
          D=$(node -p 'require("./examples/demo/package.json").dependencies["discovery-media-player"]')
          if [ "$V" != "$D" ]; then
            echo "::notice::the live demo still pins $D — bump examples/demo/package.json to $V"
            echo "⚠️ **La démo en ligne épingle \`$D\`** — à monter en \`$V\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ La démo est sur \`$V\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      # ⚠️ CE QUI A MANQUÉ LE 14/08 : PERSONNE NE REGARDAIT L'ARTEFACT.
      #
      # Une version a été publiée, annoncée à l'hôte qui l'attendait, et ne contenait pas le
      # correctif promis — un commit resté sur une branche dont la PR était déjà fusionnée. Rien
      # dans la chaîne ne pouvait le voir : les tests tournent sur l'arbre de travail, la CI sur
      # la branche, et les notes de version viennent d'un fichier écrit à la main. C'est l'HÔTE
      # qui l'a trouvé, en comparant deux tarballs npm.
      #
      # Ce résumé liste ce qui a RÉELLEMENT changé dans le paquet depuis la version précédente.
      # Une note de version qui promet un correctif de `server/handler.js` en face d'une liste qui
      # ne le mentionne pas se voit d'un coup d'œil — ce qui est exactement le contrôle qui
      # manquait. Non bloquant : c'est un révélateur, pas une règle.
      - name: What actually changed in the published package
        run: |
          V=$(node -p 'require("./package.json").version')
          PREC=$(npm view discovery-media-player versions --json | node -e '
            let d=""; process.stdin.on("data",c=>d+=c).on("end",()=>{
              const v=JSON.parse(d).filter(x=>x!==process.argv[1]);
              console.log(v[v.length-1]||"");
            })' "$V")
          echo "## Contenu réel du paquet" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$PREC" ]; then
            echo "Première publication — rien à comparer." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p /tmp/cmp && cd /tmp/cmp
          npm pack "discovery-media-player@$PREC" --silent >/dev/null 2>&1 || exit 0
          mkdir -p a b && tar xzf "discovery-media-player-$PREC.tgz" -C a --strip-components=1
          cd "$GITHUB_WORKSPACE" && npm pack --silent >/dev/null
          tar xzf "discovery-media-player-$V.tgz" -C /tmp/cmp/b --strip-components=1
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Fichiers modifiés entre \`$PREC\` et \`$V\` :" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          diff -rq /tmp/cmp/a /tmp/cmp/b 2>/dev/null | sed 's|/tmp/cmp/[ab]/||g' | sort -u >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ Comparez cette liste aux notes de version : un correctif annoncé dans un fichier absent d'ici n'est pas publié." >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ CE QUI EST PUBLIÉ S'EXÉCUTE-T-IL ? C'EST UN AUTRE AXE.
      #
      # L'étape ci-dessus compare le CONTENU du paquet à la version précédente ; la tâche horaire
      # `publication.yml` vérifie que ce que `main` déclare est bien publié. Aucune des deux
      # n'aurait attrapé 0.1.25 : elle était publiée, conforme à `main`, et son contenu différait
      # bien de 0.1.24. Elle était simplement CASSÉE — un `return var h2={…}` dans le script en
      # ligne, et toute la couche live morte.
      #
      # Ce qui l'a trouvée, c'est un hôte qui a rendu une page depuis le paquet installé. Le second
      # hôte l'a formulé : « le vôtre vérifie que ce qui est écrit est publié, le nôtre que ce qui
      # est publié s'exécute — aucun des deux ne couvre l'autre ».
      #
      # Cette étape ferme cet axe-là, sur le paquet TÉLÉCHARGÉ DEPUIS LE REGISTRE et non sur l'arbre
      # de travail : on l'installe, on rend une page, on COMPILE chacun de ses scripts en ligne.
      # ⚠️ Elle échoue la course. Une version cassée qui reste publiée sans que rien ne le dise est
      # exactement ce qui est arrivé, et ça s'est vu chez un tiers.
      - name: The published package renders and its scripts compile
        run: |
          V=$(node -p 'require("./package.json").version')
          # Le registre met quelques instants à servir une version fraîche.
          for i in $(seq 1 20); do npm view "discovery-media-player@$V" version >/dev/null 2>&1 && break || sleep 6; done
          mkdir -p /tmp/fume && cd /tmp/fume && npm init -y >/dev/null
          npm i "discovery-media-player@$V" --silent
          node -e '
            const vm = require("node:vm");
            const P = "/tmp/fume/node_modules/discovery-media-player";
            const id = require.resolve(P + "/server/presentations.js");
            const vraies = require(id);
            require.cache[id] = { id, filename: id, loaded: true, exports: { ...vraies,
              getPresentation: async () => ({ slug: "s1", doc_title: "T", file_name: "d.pdf",
                file_url: "https://x.supabase.co/storage/v1/object/public/r/d.pdf", current_page: 1, active: true }),
              listMessages: async () => [] } };
            const player = require(P);
            player.init({
              plugins: {}, has: () => false,
              storage: { isAllowedUrl: () => true, async fetchFile() { return null; }, async put() {} },
              db: { async request() { return []; }, async selectAll() { return []; } },
              mail: { async send() {} },
              identity: { async verifyToken() { return null; }, roleOf: () => "", isAdmin: () => false, async canManageShares() { return false; } },
              limits: { async allow() { return true; } },
              branding: { async logo() { return ""; }, name: "", poweredBy: "", loaderName: "", async forKey() { return null; }, title: (b) => b },
              errors: { async capture() {} },
              legal: { sourceUrl: "", legalUrl: "", privacyUrl: "", trackingNotice: "", trackingNoticeAnonymous: "", publicUrl: "" },
              config: { supabaseUrl: "https://x.supabase.co", supabasePublishableKey: "k", mapsKey: "", extraFrameAncestors: [] },
            });
            (async () => {
              const res = { statusCode: 0, body: "", setHeader() {}, end(b) { this.body = String(b || ""); } };
              await player.handler({ method: "GET", headers: {}, socket: {}, query: { present: "s1" } }, res);
              const blocs = [...res.body.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)].map((m) => m[1]).filter((c) => c.trim());
              if (!blocs.length) { console.error("::error::la page publiée ne contient aucun script en ligne"); process.exit(1); }
              let ko = 0;
              for (const c of blocs) { try { new vm.Script(c); } catch (e) { ko++; console.error("::error::script en ligne non compilable : " + e.message); } }
              if (ko) process.exit(1);
              console.log("page rendue : " + res.body.length + " octets, " + blocs.length + " scripts, tous compilables");
            })();'

      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          make_latest: true

      # ── Image de conteneur ───────────────────────────────────────────────────────────────────
      - name: Image name, lowercased
        id: img
        run: echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 + arm64 : les serveurs ARM (Graviton, Ampere) et les Mac Apple Silicon sont
      # majoritaires chez les auto-hébergeurs. SBOM et provenance : ce qu'il y a dans l'image et
      # d'où elle vient, vérifiables sans nous croire sur parole.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.img.outputs.ref }}:${{ env.TAG }}
            ${{ steps.img.outputs.ref }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
