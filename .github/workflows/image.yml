# IMAGE DE CONTENEUR — HORS DU CHEMIN CRITIQUE DE LA PUBLICATION.
#
# ⚠️ Le build multi-arch (amd64 + arm64 + SBOM + provenance) dure ~2 min 30 : c'était le plus
# gros poste du workflow Release, et il bloquait la fin de la publication alors que le paquet npm
# — la seule chose dont dépend la montée du studio — était prêt en ~1 min 30. On le sort donc ici :
# ce workflow se déclenche sur le MÊME tag, EN PARALLÈLE de Release. Personne n'attend l'image ;
# Release publie npm et la GitHub Release sans elle.
#
# ⚠️ La garde de complétude reste vraie : l'image est toujours produite pour chaque tag (le
# septième audit l'exigeait). Simplement, elle ne retient plus la publication npm.
name: Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à rejouer (ex. v0.1.78)"
        required: true

# ⚠️ RIEN EN ÉCRITURE À LA RACINE — LE DROIT VA AU JOB QUI S'EN SERT, ET À LUI SEUL.
#
# Une permission posée ici est accordée à TOUS les jobs, y compris à ceux que personne n'a encore
# écrits. `promote-latest` déclarait déjà les siens ; `image` héritait des quatre, dont deux dont
# il n'a besoin que pour l'attestation. Le jour où un troisième job arrive, il hérite de tout.
#
# La règle est tenue par `tools/permissions-workflows.mjs`, qui refuse toute écriture à la racine.
permissions:
  contents: read

# ⚠️ PAS de concurrency au niveau du workflow (P2 douzième audit). Deux tags rapprochés produisent
# deux images VERSIONNÉES distinctes qui ne se marchent pas dessus : les sérialiser ferait qu'un
# troisième tag ANNULE le deuxième en attente (GitHub Actions ne garde qu'une exécution en file),
# et l'image intermédiaire ne naîtrait jamais. Les builds tournent donc en PARALLÈLE ; seule la
# promotion de `latest` — le seul point de course réel — est sérialisée, dans son propre job.
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # pousser l'image sur ghcr
      id-token: write        # OIDC
      attestations: write    # provenance de l'image
    outputs:
      ref: ${{ steps.img.outputs.ref }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Image name, lowercased
        id: img
        run: echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # ⚠️ Le tag doit correspondre EXACTEMENT à la version du package.json de ce commit — sinon on
      # publierait une image sous un nom qui ne dit pas ce qu'elle contient.
      - name: Tag matches package version, and is a strict semver tag
        run: |
          # ⚠️ Regex INLINE, pas le module : ce job checkout le TAG, et un tag ANCIEN (récupération)
          # n'a pas encore `tools/plus-haut-tag.mjs`. La forme du tag est triviale ; la logique de
          # SÉLECTION (tri numérique, invalides ignorés) reste le module, employée par la promotion
          # et le contrôle horaire — c'est là que la divergence coûterait (P3 treizième audit).
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::$TAG n'est pas un tag semver strict vX.Y.Z"; exit 1; }
          test "$TAG" = "v$(node -p 'require("./package.json").version')" \
            || { echo "::error::tag $TAG != v$(node -p 'require(\"./package.json\").version')"; exit 1; }

      # ⚠️ Le plus haut tag n'est PAS calculé ici : un contrôle avant build ne suffit pas (onzième
      # audit) — un vieux build lent pourrait promouvoir `latest` après avoir été dépassé. Il est
      # recalculé JUSTE AVANT la promotion, après le build (étape « Promote latest »).
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 + arm64 : les serveurs ARM (Graviton, Ampere) et les Mac Apple Silicon sont
      # majoritaires chez les auto-hébergeurs. SBOM et provenance : ce qu'il y a dans l'image et
      # d'où elle vient, vérifiables sans nous croire sur parole.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          # ⚠️ SEULEMENT le tag versionné, immuable. `latest` se promeut APRÈS, par retag atomique
          # (étape suivante) — jamais poussé pendant le build, ce qui évite qu'un vieux build lent
          # l'écrase, et la promotion recalcule le plus haut tag JUSTE AVANT.
          tags: ${{ steps.img.outputs.ref }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ⚠️ LE MANIFESTE DU TAG EST-IL SERVI, ET MULTI-ARCH ? (P1 onzième audit — la garde différée
      # avait bien rougi sur l'image 0.1.81 cassée, mais elle vérifiait après un push déjà foireux.)
      # On confirme le tag versionné ET la présence des deux architectures AVANT de toucher latest.
      - name: The versioned image is served, amd64 + arm64
        run: |
          depot=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          jeton=$(curl -s "https://ghcr.io/token?scope=repository:$depot:pull" | jq -r '.token // empty')
          index=$(curl -s -H "Authorization: Bearer $jeton" -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/$depot/manifests/${TAG}")
          echo "$index" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const m=JSON.parse(d);const arch=(m.manifests||[]).map(x=>x.platform&&x.platform.architecture).filter(Boolean);if(!arch.includes('amd64')||!arch.includes('arm64')){console.error('::error::image '+process.env.TAG+' incomplète — arches: '+arch.join(',')||'aucune');process.exit(1)}console.log('image '+process.env.TAG+' servie, arches: '+arch.join(', '))})"

  promote-latest:
    needs: image
    runs-on: ubuntu-latest
    # ⚠️ SEUL point sérialisé : deux promotions de `latest` ne doivent pas se croiser. Un build
    # versionné en retard n'écrase pas `latest` car ce job RECALCULE le plus haut tag ici même.
    concurrency:
      group: image-latest-promote
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      REF: ${{ needs.image.outputs.ref }}
    steps:
      # ⚠️ Checkout de `main`, PAS du tag déclencheur : la promotion a besoin du module et de TOUS
      # les tags, pas de l'arbre source de la version. Un vieux tag (récupération) n'aurait ni l'un
      # ni l'autre. `main` est toujours à jour ; les tags sont récupérés à part.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ Le plus haut tag est recalculé ICI, après le build et juste avant la promotion : un
      # build versionné plus lent qui aurait été dépassé ne promeut plus `latest`. `imagetools
      # create` retague sans reconstruire, en préservant la liste multi-arch et les attestations.
      # ⚠️ RÉCONCILIER `latest` VERS LE PLUS HAUT TAG, pas vers $TAG (P2 treizième audit). L'ancien
      # code ne promouvait que si CE build était le plus haut — mais un groupe de concurrence ne
      # garde qu'un job en attente : si la promotion du tag récent était droppée et qu'un vieux
      # build finissait ensuite, il constatait « je ne suis pas le plus haut » et ne faisait RIEN,
      # laissant `latest` en arrière. En réconciliant vers le plus haut (via tools/plus-haut-tag.mjs,
      # semver strict), N'IMPORTE QUEL job survivant remet `latest` sur le bon — un intermédiaire
      # perdu ne coûte rien. L'image versionnée du plus haut existe toujours (le build la publie).
      - name: Reconcile latest to the highest version tag
        run: |
          plusHaut=$(git tag -l | node tools/plus-haut-tag.mjs)
          [ -n "$plusHaut" ] || { echo "aucun tag de version valide — latest NON touché"; exit 0; }
          depot=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          jeton() { curl -s "https://ghcr.io/token?scope=repository:$depot:pull" | jq -r '.token // empty'; }
          digest() { curl -sI -H "Authorization: Bearer $(jeton)" -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/$depot/manifests/$1" | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}'; }
          # L'image versionnée du plus haut doit exister avant de pointer latest dessus.
          dhaut=$(digest "$plusHaut")
          [ -n "$dhaut" ] || { echo "::error::l'image $plusHaut n'est pas encore servie — réconciliation reportée (le contrôle horaire rattrapera)"; exit 1; }
          docker buildx imagetools create --tag "$REF:latest" "$REF:$plusHaut"
          echo "latest réconcilié vers $plusHaut (déclenché par $TAG)"
          dlat=$(digest latest)
          [ "$dhaut" = "$dlat" ] || { echo "::error::latest ($dlat) ne pointe pas le digest de $plusHaut ($dhaut)"; exit 1; }
          echo "latest et $plusHaut partagent le digest $dhaut"
