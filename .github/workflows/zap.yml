# ⚠️ CE QUE CODEQL NE PEUT PAS VOIR : L'APPLICATION EN MARCHE.
#
# CodeQL lit le code, Scorecard note les pratiques, les 1100 tests appellent le gestionnaire en
# mémoire — et AUCUN des trois ne voit ce qu'un navigateur reçoit vraiment : les en-têtes, les
# CSP, les cookies, tels qu'ils sortent du serveur assemblé. C'est ainsi que la page d'accueil du
# mode dossier a servi du HTML sans CSP ni `nosniff` pendant que la visionneuse, testée en
# mémoire, était irréprochable — trouvé par le PREMIER passage de ce scan (24/08), avant même
# qu'il soit en CI. Un scan dynamique n'est pas une redondance des trois autres : c'est le seul
# des quatre qui regarde par la fenêtre du visiteur.
#
# ⚠️ BASELINE, ET PAS FULL SCAN, PAR DÉCISION. Le scan baseline est PASSIF : il parcourt et
# observe, il n'injecte rien. Le full scan attaque — et une CI qui attaque sa propre instance
# jetable n'apprendrait pas grand-chose de plus, tout en multipliant la durée du job. Les liens
# tracés et la présentation SONT scannés — servis par une base d'essai, observés passivement.
# Le jour où ce dépôt veut les ATTAQUER (full scan actif, payloads), c'est une décision à écrire
# ici, pas une option à cocher.
#
# ⚠️ TOUTE ALERTE NON TRIÉE BLOQUE. La baseline sort en erreur dès qu'une alerte reste au niveau
# WARN (son défaut). Le tri vit dans `.zap/rules.tsv`, une décision écrite par règle — pas de
# `-I` qui transformerait le garde en rapport que personne ne lit.
#
# ⚠️ ET UN SCAN INTERROMPU N'EST PAS UNE ALERTE NON TRIÉE — DEUX ROUGES, DEUX DESTINATAIRES. Le
# 27/08 (course 33102994676), `zap-baseline.py` s'est arrêté sur la surface `doc` sans rendre de
# verdict : pas de ligne de synthèse, et deux rapports téléversés pour trois surfaces. L'étape a
# pourtant annoncé « alerte non triée », envoyant son lecteur trier ce qui n'existait pas. Le
# croisement qui sépare les deux — le code du scanner ET la preuve qu'il a conclu, son rapport —
# vit désormais dans `tools/verdict-zap.mjs`, éprouvé par `tools/__tests__/verdictZap.test.js`.
# Un `||` dans un bloc `run:` ne s'éprouve pas ; c'est pour ça que la décision en est sortie.
name: ZAP

on:
  push:
    branches: [main]
  pull_request:
  # Pas de rendez-vous planifié, et c'est un choix : l'image du scanner est épinglée par
  # condensat (.zap/Dockerfile), donc ses règles ne bougent qu'avec la PR Dependabot qui la
  # monte — laquelle déclenche déjà ce scan. Un hebdomadaire re-scannerait l'identique ;
  # CodeQL garde le sien parce que SES règles, elles, bougent sans commit.

permissions:
  contents: read

concurrency:
  group: zap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # On scanne l'IMAGE LIVRÉE, pas un serveur de développement : c'est elle qui tourne chez
      # les auto-hébergeurs, et c'est donc ses en-têtes à elle qui comptent.
      - name: Build the shipped image
        run: docker build -t player-sous-scan .

      # ⚠️ LES ROUTES À BASE AUSSI, PAS SEULEMENT LE MODE DOSSIER. La visionneuse tracée
      # (/doc/:slug) et la présentation (/present/:slug) portent CHACUNE leur propre politique de
      # sécurité ; sans base elles répondent 404 et le scan ne les regardait pas — le même trou
      # que le banc navigateur avait comblé pour les essais (constat P2-3), comblé par la même
      # doublure : tools/postgrest-en-memoire.cjs, qui refuse plutôt qu'inventer. La graine vit
      # dans tools/zap-base-de-scan.mjs — versionnée et lintée, pas inline dans ce run:.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Start the scan database (in-memory PostgREST double)
        run: |
          # ⚠️ L'URL du document est celle QUE LE CONTENEUR VERRA : /data est son montage, pas le
          # nôtre. C'est le script qui l'exige en paramètre, précisément pour que personne ne
          # confonde les deux mondes.
          node tools/zap-base-de-scan.mjs 54321 file:///data/sample.pdf &
          sleep 1
          # Le préfixe /rest/v1/ est celui que le player emploie — on sonde le chemin qu'il prendra.
          curl -fsS "http://127.0.0.1:54321/rest/v1/commercial_doc_shares?slug=eq.zap-doc" >/dev/null \
            || { echo "::error::la base de scan ne répond pas"; exit 1; }

      # `--network host` : le player doit joindre la doublure sur 127.0.0.1:54321 — un pont
      # Docker l'en séparerait. Le scanner tourne sur le même réseau, plus rien à câbler.
      - name: Start the player — folder mode AND database routes
        run: |
          docker run -d --name player --network host \
            -e SUPABASE_URL=http://127.0.0.1:54321 \
            -e SUPABASE_SERVICE_ROLE_KEY=cle-sans-valeur-de-scan \
            -v "$PWD/examples/demo/documents:/data:ro" player-sous-scan
          for i in $(seq 1 30); do
            curl -fsS localhost:3000/healthz >/dev/null 2>&1 && break; sleep 2
          done
          # ⚠️ UN SCAN D'UN 404 EST VERT ET VIDE — le pire cas, celui que toutes les gardes d'ici
          # refusent. Chaque surface doit répondre 200 AVANT d'être scannée ; et c'est aussi la
          # confrontation des slugs : écrits ici ET dans la graine, deux exemplaires d'un fait,
          # cette boucle est l'étape qui les compare (un slug qui diverge rougit en nommant l'URL).
          for route in /healthz /doc/zap-doc /present/zap-direct; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "localhost:3000$route")
            [ "$code" = "200" ] || { echo "::error::$route répond $code — le scan mesurerait le vide"; docker logs player; exit 1; }
          done
          echo "trois surfaces servies : accueil, lien tracé, présentation"

      # ⚠️ L'ÉTIQUETTE DIT-ELLE LA VÉRITÉ ? Même confrontation que pour l'image Node du
      # Dockerfile racine : le condensat fait foi pour Docker, la version écrite à côté n'est
      # qu'un second exemplaire d'un fait — on demande donc à l'image sa version, et on compare.
      - name: The tag beside the digest tells the truth
        run: |
          docker build -t zap-epingle .zap
          annoncee=$(grep -oE 'zaproxy:[0-9]+\.[0-9]+\.[0-9]+' .zap/Dockerfile | cut -d: -f2)
          [ -n "$annoncee" ] || { echo "::error::.zap/Dockerfile n'annonce pas de version lisible"; exit 1; }
          reelle=$(docker run --rm zap-epingle zap.sh -cmd -version 2>/dev/null | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+$' | tail -1)
          [ -n "$reelle" ] || { echo "::error::l'image n'a pas rendu de version lisible"; exit 1; }
          if [ "$annoncee" != "$reelle" ]; then
            echo "::error::l'image embarque ZAP $reelle, mais .zap/Dockerfile annonce $annoncee — le condensat et l'étiquette ne désignent pas la même chose"
            exit 1
          fi
          echo "ZAP $reelle, étiquette et condensat d'accord"

      # Une passe par surface : le spider ne suit que les liens, et rien ne mène de l'accueil vers
      # un lien tracé — c'est le principe même d'un lien par destinataire. Les trois échouent ou
      # réussissent ENSEMBLE : une seule passe rouge arrêterait le tri au premier constat, alors
      # que le triage de .zap/rules.tsv se décide sur le tableau complet.
      # `/zap/wrk` doit être INSCRIPTIBLE par l'utilisateur `zap` de l'image (le script y copie
      # son plan) — d'où la copie hors du dépôt plutôt qu'un montage de `.zap/` lui-même.
      - name: Baseline scan — three surfaces, untriaged warnings block
        run: |
          mkdir -p /tmp/zap-wrk && cp .zap/rules.tsv /tmp/zap-wrk/ && chmod -R a+rwx /tmp/zap-wrk
          annonces=""
          for paire in "accueil=http://localhost:3000/" "doc=http://localhost:3000/doc/zap-doc" "present=http://localhost:3000/present/zap-direct"; do
            nom="${paire%%=*}" cible="${paire#*=}"
            echo "── scan : $cible"
            # `-r` : le rapport HTML complet, par surface, dans /zap/wrk — la sortie du job ne
            # montre que 5 URL d'exemple par règle ; le rapport montre tout, et c'est lui qu'on
            # ouvre pour trier une alerte nouvelle sans rejouer le scan. C'est AUSSI la preuve
            # qu'un scan est allé au bout : sans lui, un code non nul ne dit rien de ce qu'il a vu.
            code=0
            docker run --rm --network host -v /tmp/zap-wrk:/zap/wrk zap-epingle \
              zap-baseline.py -t "$cible" -c rules.tsv -r "rapport-$nom.html" || code=$?
            annonces="$annonces $nom=$cible=$code"
          done
          # ⚠️ LE VERDICT N'EST PLUS DANS CE SHELL, ET C'EST LE CORRECTIF. Cette ligne portait un
          # `|| echec="$echec $cible"` qui écrasait tous les codes non nuls en un seul fait, puis
          # annonçait « alerte non triée » quelle qu'en fût la cause. Le 27/08, un scan interrompu
          # sans avoir rien trié a donc envoyé son lecteur vers `.zap/rules.tsv`, où il n'y avait
          # rien, et vers un rapport qui n'avait pas été écrit. La décision vit maintenant dans
          # `tools/verdict-zap.mjs`, avec le banc qui la tient — un shell ne s'éprouve pas.
          # shellcheck disable=SC2086 — la séparation en mots EST le passage des annonces.
          node tools/verdict-zap.mjs /tmp/zap-wrk $annonces

      # ⚠️ `if: always()` — c'est quand le scan est ROUGE que le rapport sert : le lire est le
      # premier geste du tri, et il n'existerait pas si l'étape ne s'exécutait qu'au vert.
      - name: Upload the HTML reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapports-zap
          path: /tmp/zap-wrk/rapport-*.html
