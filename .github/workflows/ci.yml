name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Les artefacts navigateur sont COMMITÉS (les plateformes serverless ne construisent rien).
      # Les reconstruire et exiger qu'ils n'aient pas bougé est la seule façon d'éviter qu'une
      # instance serve un bundle plus ancien que sa source, sans que rien ne le signale.
      - name: Generated bundles are up to date
        run: |
          npm run build
          git diff --exit-code -- server/*.generated.js \
            || { echo "::error::server/*.generated.js is stale — run 'npm run build' and commit."; exit 1; }

      # ⚠️ Le paquet doit distribuer du JS compilé et des types, jamais du TypeScript brut : un
      # consommateur sans chaîne de compilation ne pourrait rien en faire.
      - name: The published package ships compiled JS and types
        if: matrix.node == '22'
        run: |
          npm pack --silent >/dev/null
          tar tzf discovery-media-player-*.tgz > /tmp/files.txt
          grep -q 'package/dist/bridge.js'   /tmp/files.txt || { echo "::error::dist/bridge.js missing"; exit 1; }
          grep -q 'package/dist/bridge.d.ts' /tmp/files.txt || { echo "::error::dist/bridge.d.ts missing"; exit 1; }
          ! grep -q 'package/src/'  /tmp/files.txt || { echo "::error::raw TypeScript is being published"; exit 1; }
          ! grep -q '__tests__'     /tmp/files.txt || { echo "::error::tests are being published"; exit 1; }
          node --input-type=module -e "import('./dist/bridge.js').then(m => { if (typeof m.toWire !== 'function') process.exit(1); })"

      # ⚠️ « UN package.json PUBLIÉ DÉCRIT CE QUE LE MAINTENEUR PEUT FAIRE, PAS CE QUE LE
      # CONSOMMATEUR REÇOIT » (second hôte, 19/08) : le champ `scripts` n'est pas filtré par
      # `files` — il annonce donc structurellement plus que le tarball ne contient. Nos trois
      # bancs n'embarquent pas (et ne doivent pas embarquer) ; sans garde, un consommateur qui
      # lance `npm run test:e2e` récolte une erreur de configuration qui ressemble à SON problème.
      # Ce scénario installe le tarball comme un consommateur et exige le refus qui NOMME la
      # situation — pas l'erreur cryptique.
      - name: The published scripts refuse by name outside a clone
        if: matrix.node == '22'
        run: |
          rm -rf /tmp/conso && mkdir -p /tmp/conso && cd /tmp/conso
          npm init -y >/dev/null
          npm i --silent "$GITHUB_WORKSPACE"/discovery-media-player-*.tgz
          cd node_modules/discovery-media-player
          for banc in test test:e2e test:base test:charge test:campagne; do
            if sortie=$(npm run "$banc" 2>&1); then
              echo "::error::npm run $banc a RÉUSSI depuis une installation consommatrice — il n'a rien pu mesurer"
              exit 1
            fi
            echo "$sortie" | grep -q "Clonez le depot" || {
              echo "::error::npm run $banc échoue SANS nommer la situation — le consommateur croira que son installation est cassée"
              echo "$sortie" | tail -5
              exit 1
            }
          done
          echo "les bancs refusent en nommant la situation"

      # ⚠️ « UNE DONNÉE EXPOSÉE EST UNE PROMESSE ; UNE DONNÉE TROUVÉE EST UNE SUPPOSITION SUR
      # VOTRE ARBORESCENCE » (second hôte, 19/08 — deux consommateurs nous lisaient par chemin,
      # et rien ne permettait de le savoir). Le contrat et la politique de rétention sont donc des
      # EXPORTS du paquet : require.resolve les suit à travers tout rangement. Cette étape tient
      # la promesse depuis une installation consommatrice — un export retiré ou un fichier sorti
      # du tarball rougit ici, pas chez un hôte.
      - name: The package EXPOSES its contract and retention policy
        if: matrix.node == '22'
        run: |
          cd /tmp/conso
          node -e "
            const fs = require('fs');
            for (const sub of ['contrat', 'retention']) {
              const p = require.resolve('discovery-media-player/' + sub);
              const n = fs.readFileSync(p, 'utf8').length;
              if (n < 1000) { console.error('::error::' + sub + ' resolu mais quasi vide (' + n + ' octets)'); process.exit(1); }
              console.log(sub + ' : ' + n + ' octets, promis et tenu');
            }"

      # ⚠️ DIX SOUS-CHEMINS PROMIS, CINQ DOCUMENTÉS NULLE PART (troisième audit externe, 21/08).
      # `exports` est une promesse publique : un intégrateur qui découvre `discovery-media-player/
      # shares` ne pouvait savoir ni ce qu'il rend, ni s'il survivrait à la prochaine version. La
      # surface est désormais DÉCLARÉE une fois (tools/surface-publique.mjs, avec ses statuts) et
      # cette étape la confronte à package.json et à docs/API.md — un export ajouté sans être
      # classé rougit, un classement sans export aussi.
      - name: The public surface is declared, documented, and matches package.json
        if: matrix.node == '22'
        run: node tools/surface-publique.mjs

      # ⚠️ `docs/RETENTION.md` PARTAIT EN FRANÇAIS DANS LE TARBALL (P1, audit externe du 21/08) :
      # le document qu'un DPO consulte, exposé en plus comme `discovery-media-player/retention`,
      # pendant que tout le reste de ce qu'un intégrateur lit — README, contrat d'hôte, API,
      # configuration — est en anglais. La règle du dépôt existait (dehors en anglais, traces
      # internes en français), mais seulement dans les têtes : elle a donc été respectée jusqu'au
      # jour où elle ne l'a plus été, sans que rien ne le voie. Le périmètre se DÉRIVE de
      # `package.json#files` — ce qui voyage, se lit — plutôt que d'être une liste de plus à tenir.
      - name: Documents that ship in the package are in English
        if: matrix.node == '22'
        run: node tools/langue-publiee.mjs

      # ⚠️ UN `.d.ts` PARFAIT DANS LE CLONE PEUT ÊTRE ABSENT DU PAQUET PUBLIÉ — il suffit que
      # `files` ne l'embarque pas, et c'est exactement ce qui était arrivé au contrat et à la
      # rétention. On compile donc un consommateur RÉEL contre le TARBALL, en mode strict et
      # avec `types: []` : ce qui prouve du même coup que lire nos types n'oblige personne à
      # installer ceux de Node.
      #
      # ⚠️ ET COMPILER NE SUFFIT PAS : des types trop permissifs compilent aussi. Le banc MUTE la
      # fixture (champ obligatoire retiré, signature fausse, requête sans en-têtes) et EXIGE le
      # rouge à chaque fois. Une garde qu'on n'a jamais vue échouer n'est pas une garde.
      - name: A TypeScript consumer compiles against the tarball, and the types bite
        if: matrix.node == '22'
        run: |
          # mktemp -d : nom imprévisible et permissions restreintes — un chemin fixe sous /tmp
          # est détournable par un lien symbolique pré-posé (CodeQL, alerte haute, corrigée ici).
          FIXTURE=$(mktemp -d)
          cp tools/fixture-types/* "$FIXTURE/"
          cd "$FIXTURE" && npm init -y >/dev/null
          npm i --silent "$GITHUB_WORKSPACE"/discovery-media-player-*.tgz typescript >/dev/null
          node "$GITHUB_WORKSPACE/tools/fixture-types/eprouver.mjs" "$FIXTURE"

      # ⚠️ ET LA PROMESSE SE TIENT DEPUIS UNE INSTALLATION CONSOMMATRICE, PAS DEPUIS LE CLONE.
      # Un sous-chemin peut être déclaré, documenté, et pourtant irrésolvable chez qui installe :
      # il suffit que `files` ne l'embarque pas. C'est exactement ce qui est arrivé au contrat et
      # à la rétention, deux étapes plus haut — la même vérification, étendue à tout ce que la
      # surface annonce comme importable.
      - name: Every public subpath actually resolves for a consumer
        if: matrix.node == '22'
        run: |
          node --input-type=module -e '
            const { publics, formeImportee } = await import("./tools/surface-publique.mjs");
            const { execFileSync } = await import("node:child_process");
            const echecs = [];
            for (const sousChemin of publics()) {
              const importe = formeImportee(sousChemin);
              try {
                execFileSync(process.execPath, ["-e", "require.resolve(" + JSON.stringify(importe) + ")"],
                  { cwd: "/tmp/conso", stdio: "pipe" });
                console.log(importe + " : résolu");
              } catch {
                echecs.push(importe + " — déclaré public, irrésolvable pour un consommateur");
              }
            }
            if (echecs.length) { for (const e of echecs) console.error("::error::" + e); process.exit(1); }
          '

      # ⚠️ Le contrat d'hôte demande une version EXACTE — « une plage fait entrer une version que
      # personne n'a décidé de déployer, le jour où quelqu'un lance npm install pour autre chose ».
      # Deux exemples sur trois disaient `^0.1.0` : un intégrateur qui copie l'exemple récolte
      # exactement ce contre quoi la page qu'il vient de lire le met en garde. La cohérence entre
      # ce qu'on écrit et ce qu'on montre ne se relit pas, elle se garde.
      # ⚠️ `.env.example` est ce qu'un exploitant COPIE. Une variable documentée qui n'y figure pas
      # n'existe pas pour lui — il ne la découvre qu'en cherchant pourquoi quelque chose ne marche
      # pas. `PLAYER_AUTH_URL` a vécu une demi-journée dans ce trou, le jour même de sa sortie :
      # la doc l'annonçait, le fichier à copier l'ignorait.
      - name: The example env file matches the documented variables
        if: matrix.node == '22'
        run: |
          grep -oE '`[A-Z][A-Z0-9_]{2,}`' docs/CONFIGURATION.md | tr -d '`' | sort -u > /tmp/doc.txt
          grep -oE '^[A-Z][A-Z0-9_]+'     .env.example          | sort -u > /tmp/env.txt
          diff=$(comm -3 /tmp/doc.txt /tmp/env.txt) || true
          [ -z "$diff" ] || { echo "::error::.env.example and docs/CONFIGURATION.md disagree:"; echo "$diff"; exit 1; }

      # ⚠️ LA PARITÉ DOC↔EXEMPLE NE VOIT PAS LE CODE. Les deux textes ci-dessus peuvent être
      # parfaitement d'accord… sur une liste incomplète : ELEVENLABS_API_KEY, _VOICE_ID, _MODEL et
      # PLAYER_HOST_AUTH_STORAGE_KEY ont vécu des semaines lus par le code et absents des deux —
      # un exploitant ne les découvrait qu'en lisant la source (constat d'un audit externe, 21/08 ;
      # même trou que PLAYER_AUTH_URL en son temps, un cran plus haut). Cette garde part donc du
      # CODE : toute variable que le runtime lit doit être dans CONFIGURATION.md — et la parité
      # existante la propage dans .env.example.
      #
      # ⚠️ ELLE LIT L'AST, APRÈS DEUX GÉNÉRATIONS TEXTUELLES QUI ONT ÉCHOUÉ. La v1 (grep) rougissait
      # sur un COMMENTAIRE citant une variable — une sonde qui lit du commentaire invente des
      # coupables, leçon déjà écrite sur la garde PostgREST ci-dessous. La v2 (lexer artisanal) a
      # tenu une demi-journée : un troisième audit externe (21/08) a montré qu'une regex contenant
      # un guillemet, après une parenthèse fermante, masquait TOUT le reste du fichier — un faux
      # négatif silencieux, pire qu'une garde absente puisqu'il fait croire au contrôle.
      # L'extracteur (tools/env-lues.mjs) parse désormais avec `typescript`, déjà présent pour le
      # typecheck : un commentaire, une chaîne, une regex ne sont pas des nœuds exécutés, la
      # question ne se pose plus. Il a ses PROPRES tests (tools/__tests__/envLues.test.js, dont un
      # sur du code réel), déclare ses angles morts, et REFUSE ce dont il ne peut pas lire le nom
      # — `process.env[cle]`, capture par reste, propriété calculée — au lieu de le rater.
      - name: Every variable the code reads is documented
        if: matrix.node == '22'
        run: node tools/env-lues.mjs

      # ⚠️ LES LIENS DU CHANGELOG SE SONT ARRÊTÉS À LA 0.1.41 PENDANT 77 VERSIONS. Chaque titre
      # « ## [x.y.z] » promet une référence de comparaison en pied de fichier ; personne n'écrit
      # ces lignes à la main à chaque sortie, donc elles ont cessé sans que rien ne le dise —
      # 76 titres pointaient dans le vide (constat d'un audit externe, 21/08). Même formule que
      # partout : deux exemplaires d'un fait (les titres, les références), une étape qui les
      # confronte. Le bloc se régénère mécaniquement depuis les titres — cette garde vérifie,
      # elle n'exige aucun entretien manuel.
      #
      # ⚠️ LA PRÉSENCE NE SUFFIT PAS : LES BORNES AUSSI. La première version acceptait une URL
      # présente mais FAUSSE — « compare/v0.1.40...v0.1.42 » passait alors que la version
      # précédant la 0.1.42 est la 0.1.41 (contre-audit, 21/08). L'URL attendue se DÉRIVE de
      # l'ordre réel des sections, jamais de « patch − 1 » : l'historique a au moins une
      # discontinuité (0.1.85 suit 0.1.83), et un calcul naïf l'accuserait à tort.
      # ⚠️ LA RÈGLE VIT DANS UN MODULE, PLUS EN LIGNE ICI. Le préflight de publication
      # (tools/release-preflight.mjs) doit poser exactement la même question avant un tag : deux
      # exemplaires d'une règle divergent, personne ne les confronte, et le jour où l'un se corrige
      # l'autre continue de bénir — c'est le défaut que ce dépôt traque partout ailleurs. Un seul
      # module décide (tools/changelog.mjs), il a ses tests, la forge et le préflight l'appellent.
      - name: Every changelog section has its exact comparison link
        if: matrix.node == '22'
        run: node tools/changelog.mjs

      # ⚠️ LA CARTE D'IDENTITÉ EST LA SEULE CHOSE QUE LES HÔTES ÉPINGLENT. Le contrat en montrait
      # une version périmée de cinq publications, à laquelle il manquait deux capacités. Un hôte
      # qui teste la présence d'une capacité d'après la doc conclut qu'elle n'existe pas. La
      # synchroniser à la main est exactement ce qui a échoué — donc on la garde.
      - name: The documented identity card matches the code
        if: matrix.node == '22'
        run: |
          node -e '
            const fs = require("node:fs");
            const src = fs.readFileSync("server/handler.js", "utf8");
            const bloc = src.slice(src.indexOf("capabilities: ["));
            const code = [...bloc.slice(0, bloc.indexOf("]")).matchAll(/"([a-z-]+)"/g)].map(m => m[1]).sort();
            const doc = fs.readFileSync("docs/HOST-CONTRACT.md", "utf8");
            const ligne = doc.split("\n").find(l => l.includes("\"capabilities\""));
            const documentees = [...ligne.matchAll(/"([a-z-]+)"/g)].map(m => m[1]).filter(c => c !== "capabilities").sort();
            const manquantes = code.filter(c => !documentees.includes(c));
            const inventees = documentees.filter(c => !code.includes(c));
            if (manquantes.length || inventees.length) {
              console.error("::error::identity card drift — missing from docs: " + (manquantes.join(", ") || "none") +
                            " | documented but absent from code: " + (inventees.join(", ") || "none"));
              process.exit(1);
            }
            // ATTENTION : cette liste ENUMERE, donc elle ne voit pas ce que personne ny a mis.
            // Trois champs de presence ont ete publies des jours hors contrat sans quelle rougisse.
            // La garde AUTORITAIRE est server/__tests__/carteContrat.test.js : elle rend une vraie
            // carte et compare TOUTES ses cles a lexemple du contrat, dans les deux sens. Ce
            // controle-ci nest quun filet grossier ; ne pas sy fier pour un champ nouveau.
            // (Pas dapostrophe ici : ce script vit dans un node -e en guillemets simples de shell.)
            // Les booléens de configuration doivent apparaître aussi : ils disent ce qui est POSÉ.
            for (const champ of ["separateIssuer", "hostShare", "hostMail", "retentionSweep"]) {
              if (!src.includes(champ + ":")) { console.error("::error::" + champ + " absent du code"); process.exit(1); }
              if (!doc.includes("\"" + champ + "\"")) { console.error("::error::" + champ + " absent du contrat"); process.exit(1); }
            }
            console.log("carte d’identité : " + code.length + " capacités, doc et code d’accord");
          '

      # ⚠️ LE COÛT D'UN PORTAGE NE DOIT PAS GRANDIR EN SILENCE. Les 49 requêtes du cœur sont de
      # la forme `table?colonne=eq.valeur` : rien n'exige la SÉMANTIQUE de PostgREST, seulement sa
      # syntaxe. Une jointure imbriquée ou un `or=()` ajouté un jour changerait ça sans que personne
      # ne le décide — et la doc annonce un chiffre qui deviendrait faux.
      - name: The database surface stays portable-shaped
        if: matrix.node == '22'
        run: |
          # `in.(…)` n'est PAS dans la liste : il se traduit par un `WHERE colonne IN (…)`, donc il
          # ne coûte rien à porter. Ce qui coûte, ce sont les JOINTURES imbriquées et les arbres
          # booléens — là, un portage cesse d'être une traduction et devient une réécriture.
          #
          # ⚠️ ON RETIRE LES COMMENTAIRES AVANT DE CHERCHER. Cette garde lisait tout le fichier, donc
          # aussi les commentaires qui EXPLIQUENT ce qu'elle interdit : écrire « select=a(b) » pour
          # dire « ceci est interdit » la déclenchait. Elle accusait alors du code parfaitement
          # portable, et la seule issue était d'écrire autour d'elle — c'est-à-dire de dégrader
          # l'explication pour satisfaire la garde.
          #
          # Une sonde qui lit du commentaire invente des coupables. Même correction que celle faite
          # le même jour sur la sonde des colonnes de schéma, pour la même raison.
          sans_commentaires=$(grep -vE '^[[:space:]]*//' server/*.js --with-filename --line-number || true)
          exotique=$(printf '%s\n' "$sans_commentaires" | grep -E 'select=[^&`"]*\(|[?&]or=\(|[?&]and=\(|offset=' || true)
          [ -z "$exotique" ] || { echo "::error::PostgREST-specific syntax raises the porting cost:"; echo "$exotique"; exit 1; }
          # ⚠️ ON COMPARE, ON N'AFFICHE PAS. Cette étape se contentait d'imprimer le compte en
          # renvoyant le lecteur vers docs/API.md — deux exemplaires du même fait, et personne pour
          # les mettre côte à côte. Le document annonçait 49 appels « dans trois fichiers » quand il
          # y en avait 51 dans quatre : l'écart s'était installé sans qu'aucune étape ne mente,
          # puisque aucune ne comparait.
          #
          # Un chiffre affiché est une invitation à vérifier ; un chiffre comparé est une garde.
          # Trouvé en appliquant la formule du second hôte : à chaque fois qu'un fait existe en deux
          # exemplaires, quelqu'un doit les confronter au moins une fois — et ici « quelqu'un » peut
          # être cette étape.
          n=$(grep -ho 'PLAYER\.db\.\(request\|selectAll\)' server/*.js | wc -l | tr -d ' ')
          annonce=$(grep -oE '\| Call sites \| \*\*[0-9]+\*\*' docs/API.md | grep -oE '[0-9]+')
          echo "surface base : $n appels — docs/API.md annonce $annonce"
          [ "$n" = "$annonce" ] || { echo "::error::docs/API.md annonce $annonce appels, le code en compte $n. Mettez le document à jour."; exit 1; }
          # ⚠️ ET LA MOITIÉ QU'ON NE COMPARAIT PAS. La même ligne du document annonce aussi un nombre
          # de FICHIERS, et lui n'était gardé par rien : il disait « five » quand le code en comptait
          # SEPT — la dérive exacte que cette étape a été écrite pour empêcher, revenue par le membre
          # de phrase resté hors du périmètre. Une garde dit AUSSI où elle regarde ; celle-ci
          # regardait la moitié de sa propre ligne.
          f=$(grep -l 'PLAYER\.db\.\(request\|selectAll\)' server/*.js | wc -l | tr -d ' ')
          annonceF=$(grep -oE '\| Call sites \|.*in \*\*[0-9]+\*\* files' docs/API.md | grep -oE '[0-9]+' | tail -1)
          echo "surface base : $f fichiers — docs/API.md annonce $annonceF"
          [ -n "$annonceF" ] || { echo "::error::docs/API.md n'annonce plus de nombre de fichiers sous la forme « in **N** files » — la garde ne peut plus comparer"; exit 1; }
          [ "$f" = "$annonceF" ] || { echo "::error::docs/API.md annonce $annonceF fichiers, le code en compte $f. Mettez le document à jour."; exit 1; }

      # ⚠️ UN SCRIPT TIERS ENTRE DANS LA PAGE AVEC NOS DROITS. Version exacte + empreinte, sinon
      # ce qui s'exécute chez le visiteur est décidé par quelqu'un d'autre, sans déploiement.
      # Cette garde ne relit PAS une liste écrite à la main : elle part de l'inventaire exporté par
      # le code, puis vérifie qu'aucune URL de script du gabarit ne lui échappe — c'est ce second
      # temps qui compte, le premier ne prouverait que sa propre cohérence.
      # ⚠️ UN INVENTAIRE QUI N'EST PAS LA SOURCE DÉRIVE — c'est exactement ce qui avait vidé
      # supabase/init.sql de ses cinq migrations. Les attentes de schéma sont désormais déclarées
      # une fois dans server/schema.js ; cette étape refuse tout appel qui les contourne, sans quoi
      # la carte d'identité annoncerait un état complet en ignorant une colonne sondée ailleurs.
      - name: Schema expectations go through the declared inventory
        if: matrix.node == '22'
        run: |
          hors=$(grep -rn 'aLaColonne(' server/*.js | grep -v '^server/schema.js:' || true)
          [ -z "$hors" ] || { echo "::error::sonde de schéma hors inventaire — utilisez attendue(nom) :"; echo "$hors"; exit 1; }
          n=$(grep -c 'migration: "supabase/migrations/' server/schema.js)
          echo "attentes de schéma déclarées : $n"

      - name: Third-party scripts are pinned and fingerprinted
        if: matrix.node == '22'
        run: |
          node -e '
            const fs = require("node:fs");
            const { TIERS } = require("./server/handler.js");
            const echecs = [];

            for (const [cle, t] of Object.entries(TIERS)) {
              if (!/^sha384-[A-Za-z0-9+/]{60,}={0,2}$/.test(t.sri || "")) echecs.push(cle + " : empreinte absente ou mal formée");
              // Une étiquette majeure (@2) ou « latest » suit la dernière publication du tiers :
              // le code servi change alors sans déploiement, et aucune empreinte ne peut tenir.
              if (/@\d+\/|@latest|\/latest\//.test(t.url)) echecs.push(cle + " : version mouvante — " + t.url);
              if (!/\d+\.\d+\.\d+/.test(t.url)) echecs.push(cle + " : pas de version exacte — " + t.url);
            }

            // Toute URL de script du gabarit doit venir de linventaire. Deux CHARGEURS ny entrent
            // pas, et cest structurel : leur réponse change à chaque appel et ils injectent
            // eux-mêmes dautres scripts, donc aucune empreinte nest possible dessus. On les nomme
            // ici AVEC leur raison — une exception écrite se relit, une exception fondue dans le
            // décor devient la règle. Ajouter un tiers demain force donc un choix visible : épinglé
            // et empreinté, ou inscrit ici avec ce quon accepte en connaissance de cause.
            const SANS_EMPREINTE = {
              "maps.googleapis.com": "chargeur de cartes : URL versionnée par un paramètre, réponse variable",
              "accounts.google.com/gsi/client": "chargeur didentité Google : aucune version publiée",
            };
            const src = fs.readFileSync("server/handler.js", "utf8")
              .split("\n").filter((l) => !/^\s*\/\//.test(l)).join("\n");
            const connues = new Set(Object.values(TIERS).map((t) => t.url));
            const urls = [...src.matchAll(/(?:src=["'"'"']|s\.src=["'"'"'])(https:\/\/[^"'"'"'`]+)/g)].map((m) => m[1]);
            for (const u of new Set(urls)) {
              if (connues.has(u)) continue;
              if (Object.keys(SANS_EMPREINTE).some((motif) => u.includes(motif))) continue;
              echecs.push("script hors inventaire : " + u);
            }

            if (echecs.length) { console.error("::error::" + echecs.join(" | ")); process.exit(1); }
            console.log("tiers : " + Object.keys(TIERS).length + " dépendances épinglées et empreintées, aucune hors inventaire");
          '

      # ⚠️ UNE ACTION RÉFÉRENCÉE PAR ÉTIQUETTE EST UNE DÉPENDANCE MOUVANTE — le défaut de `@2`,
      # retourné sur notre propre chaîne : cette forge PUBLIE sur npm. Une étiquette peut être
      # redéplacée sur un autre commit par son auteur, ou par qui prend son compte ; le SHA, lui,
      # ne désigne qu'un arbre. L'étiquette reste en commentaire : un SHA nu se relit comme du
      # bruit, et on ne saurait plus quoi comparer à la montée suivante.
      # ⚠️ ET ELLE ÉTAIT AVEUGLE DANS LES DEUX SENS, en `grep`. Elle voyait des COMMENTAIRES —
      # écrire la règle en prose rendait la CI rouge, et c'est comme ça qu'on l'a trouvée. Surtout,
      # elle NE VOYAIT PAS DES ACTIONS : son motif exigeait un nom non quoté juste après `uses: `,
      # donc ces trois lignes passaient sans un mot, constaté sur un workflow de sonde —
      #     - uses: "actions/checkout@v4"   - uses: 'actions/cache@main'   - uses:  x/y@v3
      # Même défaut que le lexer de tools/env-lues.mjs, corrigé pour la même raison : on ne lit pas
      # un format structuré avec une expression régulière. `uses:` n'est reconnu qu'en position de
      # CLÉ, hors commentaire et hors bloc `run: |`.
      - name: GitHub actions are pinned to immutable commits
        if: matrix.node == '22'
        run: node tools/actions-epinglees.mjs

      # ⚠️ ET L'ÉTIQUETTE ÉCRITE À CÔTÉ DIT-ELLE LA VÉRITÉ ? La garde ci-dessus vérifie que le SHA
      # EST un SHA. Elle ne dit rien de ce que le commentaire ANNONCE — et #253 a posé trois SHA de
      # `github/codeql-action` tagués v4.37.7 en laissant `# v3` intact. Le fichier annonçait un
      # correctif là où il posait une MAJEURE sur l'outil d'analyse de sécurité du dépôt, et la CI
      # était verte. C'est la confrontation étiquette↔condensat du Dockerfile (même PR, #274), qui
      # n'avait pas été portée du côté des actions : le raisonnement était écrit, le contrôle
      # manquait. Il faut le réseau ; si un dépôt ne répond pas, on le DIT sans rougir — une panne
      # et un mensonge ne se disent pas avec le même silence.
      - name: The tag beside each SHA tells the truth
        if: matrix.node == '22'
        run: node tools/actions-versions.mjs

      # ⚠️ LA MÊME RÈGLE, ET ELLE NE S'APPLIQUAIT QU'À MOITIÉ. Le contrôle ci-dessus refuse
      # `uses: machin@v3` depuis longtemps ; `FROM node:24-alpine` disait exactement la même chose
      # — une étiquette que son auteur redéplace quand il veut — et rien ne le regardait (P1, audit
      # externe, 21/08). Deux constructions du MÊME commit rendaient deux images : celle qu'on
      # éprouve ici, et celle qu'un auto-hébergeur obtient trois semaines plus tard. Aucune n'est
      # fausse ; rien ne disait laquelle tourne.
      - name: Container base images are pinned to a digest
        if: matrix.node == '22'
        run: node tools/images-epinglees.mjs Dockerfile

      # ⚠️ EXACTE NE SUFFIT PAS : IL FAUT AUSSI LA NÔTRE. Cette garde n'interdisait que les plages
      # (`^`, `~`) — et pendant ce temps la démo épinglait 0.1.20 et les exemples Express et Vercel
      # 0.1.7, cent onze versions en arrière, sans qu'aucune étape ne rougisse (constat d'un audit
      # externe, 21/08). Un exemple est le code que les gens RECOPIENT : celui qui copiait recevait
      # un player d'avant les correctifs P0, depuis un dépôt dont le README vante la fraîcheur.
      # On compare donc à LA version que main déclare — l'égalité stricte interdit les plages par
      # construction, l'ancienne garde est un cas particulier de celle-ci. Fenêtre assumée, SANS
      # BORNE GARANTIE : entre la fusion d'un bump et sa publication npm, les exemples pointent
      # sur une version pas encore servie. Quelques minutes quand le tag part aussitôt — mais le
      # tag est un geste HUMAIN, et s'il ne part pas, rien ici ne le force : la garde autonome de
      # publication.yml (horaire, après plus d'une heure de divergence) ouvre une issue, puis une
      # personne agit. C'est la même fenêtre que la démo, décrite dans release.yml, et c'est un
      # arbitrage accepté — pas une propriété.
      # ⚠️ DEUX VERSIONS SONT ACCEPTABLES, ET C'EST LA FENÊTRE CI-DESSUS QUI L'IMPOSE.
      #
      # Exiger la SEULE version de main rendait une PR de montée de version rouge PAR CONSTRUCTION :
      # cette version n'existe pas encore sur npm, donc le déploiement de la démo (qui installe
      # depuis le registre) échoue à chaque fois. Un contrôle qui échoue par construction cesse
      # d'être lu — il a été vu rouge et ignoré trois fois de suite le jour où on l'a corrigé, et le
      # rouge de déploiement sert aussi à autre chose. Une garde absente est un état connu ; une
      # garde qui crie faux contamine le canal.
      #
      # On accepte donc la version de main OU la dernière PUBLIÉE. Ce que la garde protège reste
      # intact : un exemple oublié plusieurs versions en arrière n'est ni l'une ni l'autre, donc il
      # rougit. Seule la fenêtre entre la fusion et la publication cesse d'être une fausse alerte.
      #
      # Si le registre est injoignable, on retombe sur la règle stricte : ne pas savoir ne doit pas
      # élargir ce qu'on autorise.
      #
      # ⚠️ CONSÉQUENCE SUR LA PROCÉDURE DE SORTIE, ET ELLE EST TENUE PAR LE CONTRÔLE, PAS PAR CE
      # COMMENTAIRE. Les exemples s'épinglent sur la DERNIÈRE PUBLIÉE, pas sur la version qu'on est
      # en train de publier : les monter dans la PR de sortie repasserait la première règle (ils
      # vaudraient la version de main) mais ferait ÉCHOUER le déploiement de la démo, qui installe
      # depuis le registre — le rouge se déplacerait du contrôle vers le déploiement sans rien
      # gagner. Leur retard d'une version est la propriété recherchée, pas un oubli.
      #
      # Cette règle a d'abord vécu ICI SEULEMENT, en prose. Le second hôte l'a relevé : quelqu'un
      # qui voudra BIEN FAIRE montera les exemples au bon moment et rallumera le rouge structurel
      # avec les meilleures intentions, sans que rien ne l'arrête. Elle se caractérise — « la version
      # épinglée doit déjà être SERVIE par le registre » — donc elle est devenue un contrôle.
      # ⚠️ CETTE GARDE ÉTAIT ROUGE DANS L'ÉTAT NORMAL DU DÉPÔT, ET ÇA LUI A COÛTÉ UNE PR (#273).
      # Elle acceptait « la version de main OU la dernière publiée » — or les deux valent la même
      # chose dès la sortie faite, donc des exemples restés une version en arrière n'étaient plus ni
      # l'une ni l'autre. Rouge sur main, sur chaque PR ouverte, sur les suivantes. Pas un oubli
      # isolé : L'ÉTAT QUI SUIT CHAQUE SORTIE. Deux personnes ont trébuché dessus dans la même
      # heure, chacune le réparant dans une PR qui parlait d'autre chose.
      #
      # Le commentaire d'ici affirmait pourtant que « leur retard d'une version est la propriété
      # recherchée ». Le texte et le contrôle se contredisaient ; c'est le contrôle qui gagne.
      #
      # LA RÈGLE TIENT MAINTENANT EN UNE LIGNE : un exemple épingle l'une des DEUX DERNIÈRES
      # VERSIONS PUBLIÉES. Elle contient les deux anciennes — la version pas encore servie reste
      # refusée (elle casserait le déploiement de la démo), l'exemple oublié plusieurs versions en
      # arrière aussi. Seul le retard d'UNE version cesse d'être rouge, et c'est précisément celui
      # que la prose appelait la propriété recherchée. Les cinq états sont au banc.
      - name: Examples pin one of the last two published versions
        if: matrix.node == '22'
        run: node tools/exemples-epingles.mjs

      # ⚠️ UN EXEMPLE QUI N'EST JAMAIS EXÉCUTÉ EST UNE AFFIRMATION, PAS UN EXEMPLE. Celui-ci
      # s'installe comme un copieur le ferait — sauf le player lui-même, pris depuis le tarball du
      # commit (la version épinglée peut ne pas encore être publiée, cf. la fenêtre ci-dessus) :
      # c'est le CODE de l'exemple qu'on éprouve contre le CODE courant, pas le registre.
      - name: The express example actually serves a document
        if: matrix.node == '22'
        run: |
          rm -rf /tmp/exsmoke && cp -r examples/express /tmp/exsmoke && cd /tmp/exsmoke
          npm i --silent "$GITHUB_WORKSPACE"/discovery-media-player-*.tgz express >/dev/null
          mkdir -p documents && cp "$GITHUB_WORKSPACE"/examples/demo/documents/sample.pdf documents/
          # PLAYER_LOCAL_ROOT : sans lui le relais refuse le fichier local — refus par défaut,
          # constaté en écrivant ce banc. C'est la variable que le README de l'exemple fait poser.
          PLAYER_LOCAL_ROOT=./documents PORT=4300 node server.js & SRV=$!
          for i in $(seq 1 20); do curl -fsS "localhost:4300/api/doc?contract=1" >/dev/null 2>&1 && break || sleep 1; done
          curl -fsS "localhost:4300/api/doc?contract=1" | grep -q '"contract"' || { echo "::error::l'exemple express ne sert pas le contrat"; kill $SRV; exit 1; }
          curl -fsS "localhost:4300/documents/sample.pdf" | grep -qi "<html\|<!doctype" || { echo "::error::l'exemple express n'ouvre pas un document local"; kill $SRV; exit 1; }
          kill $SRV
          echo "exemple express : contrat servi, document ouvert"

  # ⚠️ CE QUE `npm test` NE PEUT PAS VOIR. `jsdom` n'applique pas la CSP, et le `res` postiche des
  # essais serveur se contente d'ENREGISTRER les en-têtes. Une politique qui interdit nos propres
  # scripts passe donc les 690 essais et donne un écran blanc chez le visiteur. Il faut un moteur
  # qui refuse pour de vrai — d'où cette étape, et son navigateur.
  #
  # Séparée de `check` : un banc navigateur qui s'invite dans la commande de base la rendrait
  # inexécutable dans un conteneur nu, et personne ne la lancerait plus en boucle.
  navigateur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # ⚠️ ON NOMME LE NAVIGATEUR AVANT DE S'EN SERVIR. Le banc s'esquive en local quand il n'y a pas
      # de Chrome — c'est confortable, et ce serait un trou béant ici : le jour où l'image de la
      # forge cesse d'en embarquer un, l'étape passerait au vert sans avoir rien exercé. `CI` étant
      # posé, le banc échoue au lieu de s'esquiver ; cette ligne dit juste lequel, et depuis quand.
      - run: google-chrome --version
      - run: npm run test:e2e

  # ⚠️ `supabase/init.sql` ANNONÇAIT « UN SEUL FICHIER, SANS RIEN À LIRE AILLEURS » — ET IL ÉTAIT
  # INCOMPLET. Aucune des cinq migrations n'y figurait : un hôte neuf installait une base sans rang
  # d'écriture, sans limites de débit partagées et sans clé d'idempotence. Les sondes de schéma
  # dégradent en SILENCE, par conception, pour ne pas casser un hôte en cours de migration — donc
  # cet hôte-là ne l'apprenait jamais. Trois protections éteintes, pour toujours, sans un mot.
  #
  # ⚠️ CETTE GARDE NE LIT PAS LE TEXTE, ELLE EXÉCUTE LES DEUX. Comparer par `grep` ne prouverait que
  # la présence d'un mot ; ici on installe une base VIERGE avec init.sql, on relève sa forme, on
  # rejoue les migrations par-dessus, et on exige que RIEN n'ait bougé. C'est la formule déjà
  # employée pour docs/API.md : quand un fait existe en deux exemplaires, quelqu'un doit les
  # confronter au moins une fois — et « quelqu'un » peut être cette étape.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Un vrai Postgres, parce que le double en mémoire le dit lui-même : « pas de contraintes,
        # pas de transactions… PAS un substitut pour vérifier ce qui relève du SGBD ».
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: player
          POSTGRES_DB: player
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: player
      PSQL: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d player -qtA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: init.sql brings a virgin database up on its own
        run: $PSQL -f supabase/init.sql

      # La forme, telle que la base la rapporte : colonnes, index, fonctions. Pas le texte du
      # fichier — ce qui en RÉSULTE.
      - name: Record the shape
        run: |
          cat > /tmp/forme.sql <<'SQL'
          select 'colonne', table_name, column_name, data_type || ' ' || is_nullable, coalesce(column_default,'')
            from information_schema.columns where table_schema='public'
          union all select 'index', tablename, indexname, indexdef, ''
            from pg_indexes where schemaname='public'
          union all select 'fonction', '', p.proname, pg_get_function_identity_arguments(p.oid), ''
            from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'
          union all select 'trigger', event_object_table, trigger_name, action_timing || ' ' || event_manipulation, ''
            from information_schema.triggers where trigger_schema='public'
          union all select 'fonctiondef', '', p.proname, md5(pg_get_functiondef(p.oid)), ''
            from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'
          union all select 'triggerdef', c.relname, t.tgname, md5(pg_get_triggerdef(t.oid)), ''
            from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and not t.tgisinternal
          union all select 'publication', pubname, tablename, '', ''
            from pg_publication_tables where schemaname='public'
          union all select 'replident', relname, c.relreplident::text, '', ''
            from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and c.relkind='r'
          order by 1,2,3,4;
          SQL
          $PSQL -f /tmp/forme.sql > /tmp/avant.txt
          wc -l < /tmp/avant.txt | xargs echo "forme après init.sql : lignes ="

      - name: Replaying every migration changes nothing
        run: |
          for f in supabase/migrations/*.sql; do echo "→ $f"; $PSQL -f "$f"; done
          $PSQL -f /tmp/forme.sql > /tmp/apres.txt
          if ! diff -u /tmp/avant.txt /tmp/apres.txt; then
            echo "::error::supabase/init.sql est incomplet : une migration a encore quelque chose à ajouter. Un hôte neuf installerait une base amputée, et les sondes de schéma le lui tairaient."
            exit 1
          fi
          echo "init.sql contient déjà tout ce que les migrations apportent."

      # ⚠️ LA FORME NE VOIT NI LES PUBLICATIONS NI LE REPLICA IDENTITY SANS QU'ON LES LUI DONNE — le
      # relevé ci-dessus les inclut désormais, sans quoi la parité init/migrations ne couvrait ni
      # l'un ni l'autre (même angle mort, déjà comblé deux fois : nullabilité, triggers). Ce
      # scénario rejoue une BASE ANCIENNE : publication présente, table publiée, REPLICA FULL —
      # l'état exact qu'init.sql installait jusqu'à la 0009 — puis exige que la migration nettoie,
      # DEUX FOIS (rejouable), et qu'une base née du nouvel init.sql ne publie jamais la table.
      - name: An old base is cleaned by 0009, twice
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -qtA -c "create database ancienne"
          VIEUX="psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d ancienne -qtA"
          $VIEUX -f supabase/init.sql
          $VIEUX -c "create publication supabase_realtime"
          $VIEUX -c "alter publication supabase_realtime add table public.doc_presentation_messages"
          $VIEUX -c "alter table public.doc_presentation_messages replica identity full"
          for tour in 1 2; do $VIEUX -f supabase/migrations/0009-chat-hors-postgres-changes.sql; done
          publiees=$($VIEUX -c "select count(*) from pg_publication_tables where pubname='supabase_realtime' and schemaname='public' and tablename='doc_presentation_messages'")
          [ "$publiees" = "0" ] || { echo "::error::la table est encore publiée après 0009 (x$publiees)"; exit 1; }
          ident=$($VIEUX -c "select c.relreplident from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='doc_presentation_messages'")
          [ "$ident" = "d" ] || { echo "::error::replica identity encore '$ident' après 0009 (attendu 'd')"; exit 1; }
          echo "base ancienne nettoyée, deux passages, replident=d"

      - name: A fresh install never publishes the chat table, even when the publication pre-exists
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -qtA -c "create database neuve"
          NEUF="psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d neuve -qtA"
          $NEUF -c "create publication supabase_realtime"
          $NEUF -f supabase/init.sql
          publiees=$($NEUF -c "select count(*) from pg_publication_tables where pubname='supabase_realtime' and schemaname='public' and tablename='doc_presentation_messages'")
          [ "$publiees" = "0" ] || { echo "::error::init.sql a publié la table du chat alors que plus rien ne l'écoute"; exit 1; }
          echo "installation neuve : table jamais publiée"

      # ⚠️ LE SCELLÉ DE L'ARCHIVE PRÉTENDAIT UNE ATOMICITÉ QUE SON VERROU NE FOURNISSAIT PAS.
      # La clôture modifie `active` et `control_hash` — des colonnes NON-CLÉS — donc son UPDATE
      # prend FOR NO KEY UPDATE, que le FOR KEY SHARE du trigger NE BLOQUE PAS (matrice des verrous
      # PostgreSQL). Le trigger vérifiait « ouverte », la clôture se committait sous lui, le message
      # entrait dans l'archive. Cinquième audit, constat P1-1. Ce test est la SEULE preuve possible :
      # deux transactions réelles — PostgREST ne sait pas faire ça, psql si. Les deux sens :
      # une clôture non committée doit faire ATTENDRE puis REFUSER l'écriture ; une écriture en
      # cours doit faire attendre la clôture.
      - name: The archive seal blocks a concurrent close, both ways
        run: |
          $PSQL -c "insert into public.doc_presentations (slug, control_hash, file_url, active) values ('__course', 'h', 'https://exemple.test/x.pdf', true)"

          ( psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d player -qtA <<'SQL'
          begin;
          update public.doc_presentations set active=false, control_hash=null where slug='__course';
          select pg_sleep(2);
          commit;
          SQL
          ) &
          CLOTURE=$!
          sleep 0.6
          debut=$(date +%s%N)
          set +e
          sortie=$($PSQL -c "insert into public.doc_presentation_messages (slug, body) values ('__course', 'pendant la clôture')" 2>&1)
          code=$?
          set -e
          wait $CLOTURE
          duree=$(( ( $(date +%s%N) - debut ) / 1000000 ))
          echo "écriture pendant clôture : code=$code durée=${duree}ms"
          [ $code -ne 0 ] || { echo "::error::le message est ENTRÉ dans l'archive — le verrou du trigger ne bloque pas la clôture concurrente"; exit 1; }
          echo "$sortie" | grep -q "archivee" || { echo "::error::refusé pour une autre raison que le scellé : $sortie"; exit 1; }
          [ $duree -ge 1200 ] || { echo "::error::l'écriture n'a pas ATTENDU la clôture (${duree}ms) : les verrous ne se voient pas"; exit 1; }

          $PSQL -c "update public.doc_presentations set active=true, control_hash='h' where slug='__course'"
          ( psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d player -qtA <<'SQL'
          begin;
          insert into public.doc_presentation_messages (slug, body) values ('__course', 'avant la clôture');
          select pg_sleep(2);
          commit;
          SQL
          ) &
          ECRITURE=$!
          sleep 0.6
          debut=$(date +%s%N)
          $PSQL -c "update public.doc_presentations set active=false, control_hash=null where slug='__course'"
          duree=$(( ( $(date +%s%N) - debut ) / 1000000 ))
          wait $ECRITURE
          echo "clôture pendant écriture : durée=${duree}ms"
          [ $duree -ge 1200 ] || { echo "::error::la clôture n'a pas attendu l'écriture en cours (${duree}ms)"; exit 1; }
          n=$($PSQL -c "select count(*) from public.doc_presentation_messages where slug='__course'")
          [ "$n" = "1" ] || { echo "::error::le message écrit AVANT la clôture doit exister (n=$n)"; exit 1; }
          $PSQL -c "delete from public.doc_presentation_messages where slug='__course'"
          $PSQL -c "delete from public.doc_presentations where slug='__course'"

      # ⚠️ « REJOUABLE » DOIT AUSSI VALOIR DEPUIS UNE ANCIENNE BASE — c'est même son seul intérêt :
      # une base vierge n'a pas besoin d'être rejouée. Or l'index d'une colonne CONDITIONNELLE
      # (idem_key) était créé ligne 62 quand le rattrapage qui ajoute la colonne vivait ligne 410 :
      # une base née de l'init 0.1.64 cassait à la ligne 62, avant d'atteindre ce qui l'aurait
      # sauvée. Sixième audit. Ce scénario installe l'init HISTORIQUE (depuis le tag git), rejoue
      # l'actuel, et exige la même forme qu'une installation vierge — deux TOUTS comparés.
      - name: Yesterday's install replays today's init.sql
        run: |
          git fetch --quiet --depth 1 origin tag v0.1.64
          git show v0.1.64:supabase/init.sql > /tmp/init-v64.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -qtA -c "create database hier"
          HIER="psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d hier -qtA"
          $HIER -f /tmp/init-v64.sql
          $HIER -f supabase/init.sql
          $HIER -f /tmp/forme.sql > /tmp/forme-hier.txt
          if ! diff -u /tmp/avant.txt /tmp/forme-hier.txt; then
            echo "::error::rejouer l'init actuel sur une base 0.1.64 ne donne PAS la forme d'une installation vierge"
            exit 1
          fi
          echo "base 0.1.64 → rejeu de l'init actuel : forme identique au vierge"

      # ⚠️ CHAQUE COLONNE À DONNÉE PERSONNELLE A UNE POLITIQUE DE RÉTENTION ÉCRITE — deny-by-default.
      #
      # Le vrai sujet d'une purge n'est pas « fait-elle ce qu'elle dit » mais « ce qu'elle dit
      # couvre-t-il ce qui existe » : une donnée hors périmètre déclaré ne fait bouger aucun
      # compte, et tous les contrôles sont sincères (second hôte, 19/08). Cette garde énumère donc
      # CE QUI EXISTE — les colonnes du schéma VIVANT, par information_schema, jamais par notre
      # mémoire du fichier — et classe par FORMES (email, ip, ua, nom, corps, clé de session…),
      # pas par instances : une colonne nouvelle qui matche une forme rougit ici tant que
      # docs/RETENTION.md ne dit pas son sort (purgée après N / conservée parce que). Sur-matcher
      # coûte une ligne de documentation ; sous-matcher coûte une donnée qui survit sans politique.
      - name: Every personal-data column has a written retention policy
        run: |
          $PSQL -c "
            select table_name || '.' || column_name
            from information_schema.columns
            where table_schema = 'public'
              and (column_name ~ '(email|name|avatar|body|comment|hash|attachment|session|token|content|rating|pages|text|user)'
                   or column_name in ('ip','ua','key','client_key','attendee_key','created_by'))
            order by 1;" > /tmp/personnelles.txt
          test -s /tmp/personnelles.txt || { echo "::error::le recensement des colonnes n'a rien rendu — la sonde vise à côté"; exit 1; }
          echo "périmètre existant : $(wc -l < /tmp/personnelles.txt) colonnes à forme personnelle"
          manque=0
          while read -r col; do
            grep -qF "\`$col\`" docs/RETENTION.md 2>/dev/null || { echo "::error::$col existe dans le schéma et n'a AUCUNE politique dans docs/RETENTION.md"; manque=1; }
          done < /tmp/personnelles.txt
          [ "$manque" = "0" ] || exit 1
          echo "chaque colonne à forme personnelle a sa politique écrite"

      # ⚠️ Le fichier se dit « rejouable ». Une affirmation jamais éprouvée n'est pas une propriété.
      - name: init.sql is replayable
        run: |
          $PSQL -f supabase/init.sql
          $PSQL -f /tmp/forme.sql > /tmp/rejoue.txt
          diff -u /tmp/avant.txt /tmp/rejoue.txt || { echo "::error::rejouer init.sql modifie la base"; exit 1; }

      # ─────────────────────────────────────────────────────────────────────────────────────────
      # ⚠️ LE DOUBLE POSTGREST EN MÉMOIRE DIT LUI-MÊME CE QU'IL NE SAIT PAS FAIRE : « pas de
      # contraintes, pas de transactions… PAS un substitut pour vérifier ce qui relève du SGBD ».
      # Or l'idempotence des messages tient à une contrainte d'unicité, l'ordre des écritures de
      # pilotage à l'atomicité d'un PATCH conditionnel, et la sonde de schéma au fait que PostgREST
      # rejette le POST ENTIER sur une colonne inconnue. Trois propriétés DÉDUITES de la
      # documentation, jamais constatées. Elles le sont ici, devant un vrai PostgREST.
      # ─────────────────────────────────────────────────────────────────────────────────────────
      - name: Roles PostgREST needs
        run: |
          $PSQL <<'SQL'
          -- `authenticator` se connecte et ne peut rien ; il ENDOSSE le rôle porté par le jeton.
          -- C'est le montage standard de PostgREST, et celui de Supabase.
          create role authenticator noinherit login password 'player';
          -- `bypassrls` reproduit ce que fait `service_role` : le player n'est jamais appelé depuis
          -- un navigateur, il décide lui-même de ce qu'il sert. Sans ça, RLS sans politique bloque
          -- tout et le banc mesurerait un refus de la base, pas le comportement du player.
          create role player_test nologin bypassrls;
          grant player_test to authenticator;
          grant usage on schema public to player_test;
          grant all on all tables in schema public to player_test;
          grant all on all sequences in schema public to player_test;
          grant execute on all functions in schema public to player_test;
          SQL

      - name: A real PostgREST, in front of a real Postgres
        env:
          # Valeur de banc, pas un identifiant : elle n'ouvre qu'un Postgres jetable créé six
          # étapes plus haut et détruit avec le conteneur. PostgREST exige 32 caractères en HS256.
          JWT: banc-vraie-base-secret-de-quarante-deux-caracteres
        run: |
          echo "PLAYER_TEST_JWT_SECRET=$JWT" >> "$GITHUB_ENV"
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI="postgres://authenticator:player@localhost:5432/player" \
            -e PGRST_DB_ANON_ROLE=player_test \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_JWT_SECRET="$JWT" \
            -e PGRST_SERVER_PORT=3001 \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 40); do curl -fsS localhost:3001/ >/dev/null 2>&1 && break || sleep 1; done
          curl -fsS localhost:3001/ >/dev/null || { echo "::error::PostgREST n'a pas démarré"; docker logs postgrest; exit 1; }
          # Supabase sert PostgREST sous /rest/v1 ; un PostgREST nu le sert à la racine. Ce renvoi
          # ne touche QUE le chemin — statut, en-têtes et corps passent tels quels.
          # `setsid` + `nohup` : un simple `&` peut mourir avec le shell de l'étape, et l'étape
          # suivante n'aurait plus de renvoi — sans que rien ne dise pourquoi.
          setsid nohup node tools/prefixe-rest.cjs > /tmp/renvoi.log 2>&1 < /dev/null &
          for i in $(seq 1 20); do curl -fsS "localhost:3002/rest/v1/doc_presentations?limit=1" >/dev/null 2>&1 && break || sleep 1; done
          curl -fsS "localhost:3002/rest/v1/doc_presentations?limit=1" >/dev/null || { echo "::error::le renvoi /rest/v1 ne répond pas"; exit 1; }

      # ⚠️ Le banc REFUSE de s'esquiver quand `CI` est posé : si PostgREST ne démarrait pas, une
      # esquive silencieuse rendrait cette étape verte sans que rien n'ait été éprouvé.
      - name: What the in-memory double cannot simulate — against a real Postgres
        env:
          PLAYER_TEST_POSTGREST_URL: http://127.0.0.1:3002
        run: npm run test:base

      # ⚠️ LA CAMPAGNE DE CHARGE : elle AFFIRME ce qui est déterministe et RAPPORTE le reste.
      #
      # Un audit demandait des percentiles ; ce dépôt les avait refusés parce qu'un seuil de latence
      # rougit au hasard et finit desserré. Les deux avaient été confondus : refuser LE SEUIL
      # n'oblige pas à refuser LA MESURE. Ce banc affirme donc l'absence de 5xx, la cohérence des
      # réponses, la linéarité du coût et la non-croissance mémoire — et il IMPRIME p50/p95/p99 sans
      # jamais les comparer à quoi que ce soit. Le relevé est son produit, comme pour le banc
      # structurel : c'est là qu'on verra une dérive avant qu'un utilisateur ne la sente.
      #
      # Il a sa PROPRE configuration : un filtre par chemin n'avait pas pris et l'étape refaisait
      # tourner TOUT le banc base/ — dont une graine non idempotente, qui a échoué sur une clé
      # dupliquée. Un `include` explicite ne se laisse pas contourner et dit ce qu'il couvre.
      - name: The load campaign against a real database
        env:
          PLAYER_TEST_POSTGREST_URL: http://127.0.0.1:3002
          PLAYER_CHARGE_SPECTATEURS: "250"
        run: npm run test:campagne

      # ⚠️ LE BANC DE CHARGE COMPTE, IL NE CHRONOMÈTRE PAS — il tourne donc ici, sans base ni service :
      # ce qu'il mesure (le nombre d'allers-retours qu'un geste coûte) est déterministe. Sa SORTIE est
      # son produit : le relevé s'affiche dans le journal de la forge, et c'est là qu'on verra un geste
      # passer de 3 à 4 avant que quiconque ne s'en plaigne en production.
      - name: What each gesture costs the database
        run: npm run test:charge

      # ── LA SECONDE MOITIÉ DU CONTRAT DE RÉTENTION : LE RECENSEMENT INDÉPENDANT ───────────────
      # Le banc base vient de semer des lignes vieilles et de lancer la purge. Ce recensement — un
      # SQL nu qui ne partage NI fonction NI filtre avec server/retention.js — recompte ce qui
      # reste dans le périmètre revendiqué par docs/RETENTION.md. Un reste = la purge a menti OU
      # son périmètre ne couvre pas. Deux textes indépendants ne peuvent pas être faux de la même
      # manière ; c'est la propriété, pas un style (design arrêté avec le second hôte, 19/08).
      - name: The independent census finds nothing left in the claimed perimeter
        run: |
          $PSQL -f supabase/recensement-retention.sql > /tmp/recensement.txt
          echo "recensement (périmètre|restantes) :"; cat /tmp/recensement.txt
          restes=$(awk -F'|' '{s+=$2} END {print s+0}' /tmp/recensement.txt)
          [ "$restes" = "0" ] || { echo "::error::le recensement indépendant trouve $restes ligne(s) dans le périmètre revendiqué"; exit 1; }
          lignes=$(grep -c '|' /tmp/recensement.txt | tr -d ' ')
          [ "$lignes" = "9" ] || { echo "::error::le recensement rend $lignes périmètres au lieu de 9 — la sonde s'est déformée"; exit 1; }
          # ⚠️ Fenêtres NON STANDARD (neuvième audit) : les variables psql doivent être câblées —
          # sinon un hôte à durées personnalisées verrait le recensement contrôler une AUTRE
          # politique que sa purge. On l'exécute avec des mois resserrés et on exige 9 lignes
          # valides (le SQL tient sous substitution).
          $PSQL -v journaux_mois=1 -v presentations_mois=1 -v liens_mois=1 -f supabase/recensement-retention.sql > /tmp/recens-perso.txt
          lignes2=$(grep -c '|' /tmp/recens-perso.txt | tr -d ' ')
          [ "$lignes2" = "9" ] || { echo "::error::recensement à fenêtres personnalisées cassé ($lignes2 lignes)"; cat /tmp/recens-perso.txt; exit 1; }
          echo "recensement paramétrable : OK sous fenêtres non standard"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ⚠️ CE JOB EXÉCUTE DÉSORMAIS DE L'OUTILLAGE DU DÉPÔT, DONC IL L'INSTALLE. Il ne le faisait
      # pas — il ne servait qu'à construire l'image — et la confrontation étiquette↔condensat plus
      # bas s'en tirait parce qu'elle n'utilisait que du Node nu. Depuis que la lecture du
      # Dockerfile passe par un analyseur, ce n'est plus vrai : sans `npm ci`, l'étape échoue en
      # `ERR_MODULE_NOT_FOUND`, ce qui est arrivé à la PR qui a introduit l'analyseur.
      # Une garde qui dépend d'un paquet doit tourner là où ce paquet existe — ou ne pas en dépendre.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "22" }
      - run: npm ci --ignore-scripts
      - run: docker build -t player:ci .
      # Une image qui construit mais ne répond pas n'est pas une image qui marche.
      - name: The image answers
        run: |
          docker run -d --name player-ci -p 3000:3000 player:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz && break || sleep 1; done
          curl -fsS "localhost:3000/api/doc?contract=1" | grep -q '"contract":1'
          docker rm -f player-ci

      # ⚠️ L'ÉTIQUETTE ET LE CONDENSAT SONT DEUX EXEMPLAIRES DU MÊME FAIT, et ce dépôt sait ce que
      # deviennent les exemplaires que rien ne confronte. `node:24-alpine@sha256:…` dont le
      # condensat pointe une image Node 26 est valide pour Docker, se construit, répond, passe tout
      # ce qui précède — et raconte faux à chaque relecteur, y compris à celui qui décidera la
      # montée suivante sur le calendrier LTS. On demande donc à l'image CE QU'ELLE EMBARQUE.
      - name: The tag says what the digest contains
        run: |
          V=$(docker run --rm --entrypoint node player:ci --version)
          echo "l'image répond $V"
          node -e '
            const { readFileSync } = require("node:fs");
            import("./tools/images-epinglees.mjs").then(({ ecartMajeur }) => {
              const souci = ecartMajeur(readFileSync("Dockerfile", "utf8"), process.argv[1]);
              if (souci) { console.error("::error::" + souci); process.exit(1); }
              console.log("étiquette et condensat désignent la même majeure de Node");
            });
          ' "$V"

  # ⚠️ TROISIÈME FOIS QUE LA PUBLICATION EST LE POINT DE RUPTURE.
  #
  #   0.1.15 — publiée SANS son correctif (commit sur une branche dont la PR venait d'être fusionnée) ;
  #   0.1.25 — publiée CASSÉE (script en ligne qui ne se parse pas) ;
  #   0.1.35 — JAMAIS publiée : PR fusionnée, tag oublié. Le code était sur `main`, l'artefact nulle part.
  #
  # Les trois ont été trouvées par un HÔTE, pas ici. Le troisième cas est le plus sournois : rien
  # n'échoue. La CI est verte, la PR est fusionnée, le CHANGELOG annonce la version — et npm sert
  # toujours la précédente. Un état anormal que rien ne dit devient l'état normal.
  #
  # C'est la règle qu'on vient d'écrire pour les gardes muettes du produit (0.1.35), retournée sur
  # notre propre chaîne de livraison : si `main` déclare une version que le registre ne sert pas,
  # quelque chose est resté à moitié fait, et ça doit se voir sans qu'on pense à regarder.
  #
  # ⚠️ Ce contrôle N'ÉCHOUE PAS la CI. Entre la fusion et la fin de la publication il s'écoule
  # légitimement quelques minutes, et un échec rouge à chaque fusion apprendrait à ignorer la
  # couleur — le défaut même qu'on corrige. Il écrit un avertissement dans le résumé de la course :
  # visible pour qui vient de fusionner, silencieux quand tout est en ordre.
  #
  # ⚠️ ET IL NE SUFFIT PAS. Le second hôte a fait la remarque qui le disqualifie comme garde
  # principale : un avertissement dans un résumé ne se voit QUE SI QUELQU'UN OUVRE LA COURSE. Les
  # trois fois, personne ne l'avait ouverte — c'est un hôte qui a trouvé, en comparant le registre à
  # l'annonce. La garde qui n'a besoin de personne est dans `publication.yml` : elle tourne toute
  # seule et ouvre une issue. Celle-ci reste pour l'immédiateté ; l'autre pour la certitude.
  publication:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: main declares a version the registry does not serve
        run: |
          locale=$(node -p "require('./package.json').version")
          publiee=$(npm view discovery-media-player version 2>/dev/null || echo "")
          echo "main=$locale registre=$publiee"
          if [ "$locale" != "$publiee" ]; then
            {
              echo "### ⚠️ Version non publiée"
              echo ""
              echo "\`main\` déclare **$locale**, le registre sert **${publiee:-rien}**."
              echo ""
              echo "Si la publication vient d'être lancée, ignorez — elle prend quelques minutes."
              echo "Sinon il manque le tag :"
              echo ""
              echo '```'
              echo "git tag -a v$locale -m \"$locale\" && git push origin v$locale"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::main déclare $locale, npm sert ${publiee:-rien} — tag manquant ?"
          fi
