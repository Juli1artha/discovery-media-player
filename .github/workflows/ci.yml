name: CI

on:
  push:
    branches: [main]
  pull_request:
  # ⚠️ RELANÇABLE À LA MAIN, PARCE QUE LA FORGE S'EST TUE DEUX FOIS LE 26/08. Un incident Actions
  # (« issue with a database primary ») a laissé des courses en file pendant une heure : ni relance
  # (403 « already running ») ni annulation (409 « not been queued yet ») ne répondaient, et `ci.yml`
  # n'avait aucun déclencheur manuel. Il n'y avait littéralement rien à faire — sauf pousser un
  # commit vide pour réveiller la forge, ce que ce dépôt s'interdit.
  #
  # ⚠️ CE N'EST PAS UNE PORTE DÉROBÉE : `workflow_dispatch` n'est offert qu'à qui peut déjà écrire
  # dans le dépôt, et ce workflow ne porte que `contents: read`. Il ne publie rien, ne signe rien,
  # n'écrit nulle part — le relancer ne peut produire qu'un verdict.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # ⚠️ LA COUVERTURE EST MESURÉE POUR ÊTRE MONTRÉE, PAS POUR ÊTRE POURSUIVIE. AGENTS.md a dit
      # « délibérément non mesurée » jusqu'au 25/08 ; la décision est retournée LÀ-BAS, avec sa
      # raison — ce qui a changé n'est pas la règle (aucun test n'existe pour la couverture) mais
      # le public : les formulaires OpenSSF demandent des seuils, et un évaluateur extérieur ne
      # peut pas vérifier un nombre que personne ne publie. CE JOURNAL est la preuve publique.
      #
      # ⚠️ LES PLANCHERS SUIVENT LES REVENDICATIONS, ET ELLES ONT MONTÉ LE 25/08 AU SOIR. Le
      # formulaire Silver affirmait ≥ 80 % d'instructions (plancher posé à 80) ; le formulaire
      # Gold affirme désormais ≥ 90 % d'instructions ET ≥ 80 % de branches — les planchers passent
      # donc à 90/80. Chaque chiffre était vrai AVANT d'être affirmé (90,31 % et 83,01 % mesurés,
      # puis l'affirmation — dans cet ordre, contre-audit du 25/08 à l'appui). Le plancher défend
      # l'AFFIRMATION : s'il rougit un jour, les issues honnêtes sont un test pour un comportement
      # réel, ou le retrait de l'affirmation du formulaire — jamais un test écrit pour faire
      # remonter un nombre. La marge sur les instructions est mince (~0,3 point) : c'est le prix
      # exact de la revendication, et il se paie en tests de comportements, pas en remplissage.
      #
      # ⚠️ PÉRIMÈTRE : le code embarqué (server, context, src). Les bundles générés sont mesurés à
      # travers leurs sources TypeScript — les compter comme sortie de build doublerait les mêmes
      # lignes sous un autre nom. Les bancs eux-mêmes sont exclus : de la couverture qui se mesure
      # elle-même n'est pas une mesure. Une seconde exécution de la suite, sur Node 22 seulement :
      # le prix (≈ 40 s) est celui d'une preuve qu'on peut citer.
      - name: Statement coverage is public evidence — 90/80 are the published floors
        if: matrix.node == '22'
        run: |
          npx vitest run --coverage.enabled --coverage.provider=v8 \
            --coverage.reporter=text-summary \
            --coverage.include='server/**' --coverage.include='context/**' --coverage.include='src/**' \
            --coverage.exclude='**/__tests__/**' --coverage.exclude='**/*.generated.js' \
            --coverage.thresholds.statements=90 \
            --coverage.thresholds.branches=80

      # Les artefacts navigateur sont COMMITÉS (les plateformes serverless ne construisent rien).
      # Les reconstruire et exiger qu'ils n'aient pas bougé est la seule façon d'éviter qu'une
      # instance serve un bundle plus ancien que sa source, sans que rien ne le signale.
      - name: Generated bundles are up to date
        run: |
          npm run build
          git diff --exit-code -- server/*.generated.js \
            || { echo "::error::server/*.generated.js is stale — run 'npm run build' and commit."; exit 1; }

      # ⚠️ Le paquet doit distribuer du JS compilé et des types, jamais du TypeScript brut : un
      # consommateur sans chaîne de compilation ne pourrait rien en faire.
      - name: The published package ships compiled JS and types
        if: matrix.node == '22'
        run: |
          npm pack --silent >/dev/null
          tar tzf discovery-media-player-*.tgz > /tmp/files.txt
          grep -q 'package/dist/bridge.js'   /tmp/files.txt || { echo "::error::dist/bridge.js missing"; exit 1; }
          grep -q 'package/dist/bridge.d.ts' /tmp/files.txt || { echo "::error::dist/bridge.d.ts missing"; exit 1; }
          ! grep -q 'package/src/'  /tmp/files.txt || { echo "::error::raw TypeScript is being published"; exit 1; }
          ! grep -q '__tests__'     /tmp/files.txt || { echo "::error::tests are being published"; exit 1; }
          node --input-type=module -e "import('./dist/bridge.js').then(m => { if (typeof m.toWire !== 'function') process.exit(1); })"

      # ⚠️ « UN package.json PUBLIÉ DÉCRIT CE QUE LE MAINTENEUR PEUT FAIRE, PAS CE QUE LE
      # CONSOMMATEUR REÇOIT » (second hôte, 19/08) : le champ `scripts` n'est pas filtré par
      # `files` — il annonce donc structurellement plus que le tarball ne contient. Nos trois
      # bancs n'embarquent pas (et ne doivent pas embarquer) ; sans garde, un consommateur qui
      # lance `npm run test:e2e` récolte une erreur de configuration qui ressemble à SON problème.
      # Ce scénario installe le tarball comme un consommateur et exige le refus qui NOMME la
      # situation — pas l'erreur cryptique.
      - name: The published scripts refuse by name outside a clone
        if: matrix.node == '22'
        run: |
          rm -rf /tmp/conso && mkdir -p /tmp/conso && cd /tmp/conso
          # ⚠️ L'ÉPROUVETTE EST COMMITÉE, SES DÉPENDANCES SONT HACHÉES. Avant : `npm i <tgz>`,
          # et la dépendance de prod (pdfjs-dist + ses binaires optionnels) arrivait du registre
          # SANS empreinte — le seul maillon non épinglé de toute la CI (relevé par Scorecard,
          # Pinned-Dependencies). Désormais `npm ci` sur tools/fixture-conso (lockfile commité),
          # et le player lui-même est POSÉ depuis le tarball du commit : `tar` n'interroge aucun
          # registre. La cohérence fixture ↔ racine est confrontée par fixtureConso.test.js.
          cp "$GITHUB_WORKSPACE"/tools/fixture-conso/package.json "$GITHUB_WORKSPACE"/tools/fixture-conso/package-lock.json .
          npm ci --silent
          mkdir -p node_modules/discovery-media-player
          tar -xzf "$GITHUB_WORKSPACE"/discovery-media-player-*.tgz -C node_modules/discovery-media-player --strip-components=1
          cd node_modules/discovery-media-player
          for banc in test test:e2e test:base test:charge test:campagne test:endurance test:stats; do
            if sortie=$(npm run "$banc" 2>&1); then
              echo "::error::npm run $banc a RÉUSSI depuis une installation consommatrice — il n'a rien pu mesurer"
              exit 1
            fi
            echo "$sortie" | grep -q "Clonez le depot" || {
              echo "::error::npm run $banc échoue SANS nommer la situation — le consommateur croira que son installation est cassée"
              echo "$sortie" | tail -5
              exit 1
            }
          done
          echo "les bancs refusent en nommant la situation"

      # ⚠️ « UNE DONNÉE EXPOSÉE EST UNE PROMESSE ; UNE DONNÉE TROUVÉE EST UNE SUPPOSITION SUR
      # VOTRE ARBORESCENCE » (second hôte, 19/08 — deux consommateurs nous lisaient par chemin,
      # et rien ne permettait de le savoir). Le contrat et la politique de rétention sont donc des
      # EXPORTS du paquet : require.resolve les suit à travers tout rangement. Cette étape tient
      # la promesse depuis une installation consommatrice — un export retiré ou un fichier sorti
      # du tarball rougit ici, pas chez un hôte.
      - name: The package EXPOSES its contract and retention policy
        if: matrix.node == '22'
        run: |
          cd /tmp/conso
          node -e "
            const fs = require('fs');
            for (const sub of ['contrat', 'retention']) {
              const p = require.resolve('discovery-media-player/' + sub);
              const n = fs.readFileSync(p, 'utf8').length;
              if (n < 1000) { console.error('::error::' + sub + ' resolu mais quasi vide (' + n + ' octets)'); process.exit(1); }
              console.log(sub + ' : ' + n + ' octets, promis et tenu');
            }"

      # ⚠️ DIX SOUS-CHEMINS PROMIS, CINQ DOCUMENTÉS NULLE PART (troisième audit externe, 21/08).
      # `exports` est une promesse publique : un intégrateur qui découvre `discovery-media-player/
      # shares` ne pouvait savoir ni ce qu'il rend, ni s'il survivrait à la prochaine version. La
      # surface est désormais DÉCLARÉE une fois (tools/surface-publique.mjs, avec ses statuts) et
      # cette étape la confronte à package.json et à docs/API.md — un export ajouté sans être
      # classé rougit, un classement sans export aussi.
      - name: The public surface is declared, documented, and matches package.json
        if: matrix.node == '22'
        run: node tools/surface-publique.mjs

      # ⚠️ `docs/RETENTION.md` PARTAIT EN FRANÇAIS DANS LE TARBALL (P1, audit externe du 21/08) :
      # le document qu'un DPO consulte, exposé en plus comme `discovery-media-player/retention`,
      # pendant que tout le reste de ce qu'un intégrateur lit — README, contrat d'hôte, API,
      # configuration — est en anglais. La règle du dépôt existait (dehors en anglais, traces
      # internes en français), mais seulement dans les têtes : elle a donc été respectée jusqu'au
      # jour où elle ne l'a plus été, sans que rien ne le voie. Le périmètre se DÉRIVE — ce qui
      # voyage, se lit — plutôt que d'être une liste de plus à tenir, et il se demande à
      # `npm pack --dry-run`, PAS à `package.json#files` : npm ajoute et développe, et sur la
      # 0.1.127 un quatrième Markdown voyageait pendant que la garde annonçait en couvrir trois.
      - name: Documents that ship in the package are in English
        if: matrix.node == '22'
        run: node tools/langue-publiee.mjs

      # ⚠️ LE CHANGELOG NE VOYAGEAIT PAS, ET PERSONNE NE L'AVAIT DÉCIDÉ (constaté en publiant la
      # 0.1.134). `files` nommait le README, les licences et deux documents de `docs/` ajoutés avec
      # leur raison écrite ; le CHANGELOG n'apparaissait dans aucune discussion — pas un refus, un
      # silence. Or une absence ressemble à une décision : rien ne distinguait « on a choisi de ne
      # pas l'envoyer » de « personne n'y a pensé ». Cette garde confronte ce que le paquet PROMET
      # de porter à ce que `npm pack` dit qu'il portera, et nomme ce qu'on perd quand ça diverge.
      - name: The documents the package promises are actually in the tarball
        if: matrix.node == '22'
        run: node tools/documents-publies.mjs

      # ⚠️ NEUF DES DOUZE LIENS RELATIFS DU README MENAIENT DANS LE VIDE une fois le paquet installé
      # (0.1.134) : docs/API.md, SECURITY.md, CONTRIBUTING.md, le CLA — aucun ne voyage. Sur
      # npmjs.com la page se rend et les liens sont réécrits vers le dépôt ; dans `node_modules`, il
      # n'y a rien contre quoi les résoudre. C'était le lecteur hors ligne au nom duquel on
      # argumentait pour embarquer le CHANGELOG, et le document qu'on lui donnait renvoyait déjà
      # vers douze autres dont trois existaient chez lui. La règle n'est pas « pas de lien relatif » :
      # un lien relatif vers un fichier QUI VOYAGE fonctionne partout, y compris hors ligne.
      - name: Relative links in published documents lead somewhere in the package
        if: matrix.node == '22'
        run: node tools/liens-des-documents.mjs

      # ⚠️ UN HÔTE DOIT POUVOIR PROUVER QU'UNE MIGRATION A TOURNÉ EN SONDANT SA BASE, et pas en
      # lisant un registre : mesuré le 25/08 sur une base de production, `schema_migrations` y
      # listait 0001, 0002 et 0005 à 0011 alors que huit autres étaient appliquées. Un registre
      # n'enregistre que ce qui est passé par un chemin donné ; les effets, eux, ne mentent pas.
      #
      # Notre chaîne le permettait PAR ACCIDENT : quatre migrations redéfinissent la même fonction,
      # et seule la discipline « supprimer la signature précédente » les sépare. Une discipline que
      # rien n'écrit est tenue jusqu'au jour où elle ne l'est plus — et là, rien ne casse.
      - name: Every migration leaves a sign of its own
        if: matrix.node == '22'
        run: node tools/migrations-detectables.mjs

      # ⚠️ UN BLOC « run: » N'EST ANALYSÉ PAR PERSONNE AVANT DE S'EXÉCUTER — et pour le workflow de
      # sortie, il s'exécute APRÈS la publication npm. À la 0.1.136, une étape portait
      # `node -e '…'` entre guillemets simples avec « d'attestation » dedans : l'apostrophe fermait
      # la chaîne, bash analysait le JavaScript et butait sur une parenthèse. npm publié, image
      # publiée, AUCUNE Release, aucune attestation. Rien n'avait pu le voir : ce bloc ne tourne que
      # sur un tag. `bash -n` analyse sans exécuter, et il ne se rappelle de rien.
      - name: Every workflow run block is valid shell
        if: matrix.node == '22'
        run: node tools/shell-des-workflows.mjs

      # ⚠️ Un `grep` sans `-a` saute un fichier contenant un octet de contrôle SANS un mot : il rend
      # un nombre plus petit, d'apparence normale, sur lequel on conclut. Relevé par un hôte le
      # 27/08 sur notre propre dépôt — quatre occurrences vues, cinq existantes.
      - name: No grep over source has a silent blind spot
        if: matrix.node == '22'
        run: node tools/greps-sans-angle-mort.mjs

      # ⚠️ Un numéro de ligne est un nombre AU PRÉSENT, et le plus fragile qui soit : il ne survit à
      # aucune insertion au-dessus de lui. `AGENTS.md` en portait deux vers `docs/HOST-CONTRACT.md`,
      # faux dès le commit suivant — dans le fichier même qui enseigne la règle. Relevé par un hôte.
      - name: No navigation document points by line number
        if: matrix.node == '22'
        run: node tools/renvois-par-position.mjs

      # ⚠️ UN `.d.ts` PARFAIT DANS LE CLONE PEUT ÊTRE ABSENT DU PAQUET PUBLIÉ — il suffit que
      # `files` ne l'embarque pas, et c'est exactement ce qui était arrivé au contrat et à la
      # rétention. On compile donc un consommateur RÉEL contre le TARBALL, en mode strict et
      # avec `types: []` : ce qui prouve du même coup que lire nos types n'oblige personne à
      # installer ceux de Node.
      #
      # ⚠️ ET COMPILER NE SUFFIT PAS : des types trop permissifs compilent aussi. Le banc MUTE la
      # fixture (champ obligatoire retiré, signature fausse, requête sans en-têtes) et EXIGE le
      # rouge à chaque fois. Une garde qu'on n'a jamais vue échouer n'est pas une garde.
      - name: A TypeScript consumer compiles against the tarball, and the types bite
        if: matrix.node == '22'
        run: |
          # mktemp -d : nom imprévisible et permissions restreintes — un chemin fixe sous /tmp
          # est détournable par un lien symbolique pré-posé (CodeQL, alerte haute, corrigée ici).
          FIXTURE=$(mktemp -d)
          cp tools/fixture-types/* "$FIXTURE/"
          # ⚠️ LE COMPILATEUR EST CELUI DU DÉPÔT, PAS CELUI DU JOUR. `npm i typescript` dans une
          # fixture vierge prend la DERNIÈRE publiée : constaté le 22/08, elle rendait 7.0.2 alors
          # que ce dépôt vérifie ses propres types avec 5.9.3 — un jour rouge, un jour vert, pour
          # une raison invisible dans le diff. La version vit maintenant dans le lockfile COMMITÉ
          # de tools/fixture-conso (empreintes comprises — même geste que le banc consommateur
          # ci-dessus), et fixtureConso.test.js la confronte à celle du lockfile racine : toujours
          # un seul exemplaire du fait, et désormais haché.
          cd "$FIXTURE"
          cp "$GITHUB_WORKSPACE"/tools/fixture-conso/package.json "$GITHUB_WORKSPACE"/tools/fixture-conso/package-lock.json .
          npm ci --silent
          mkdir -p node_modules/discovery-media-player
          tar -xzf "$GITHUB_WORKSPACE"/discovery-media-player-*.tgz -C node_modules/discovery-media-player --strip-components=1
          node "$GITHUB_WORKSPACE/tools/fixture-types/eprouver.mjs" "$FIXTURE"

      # ⚠️ ET LA PROMESSE SE TIENT DEPUIS UNE INSTALLATION CONSOMMATRICE, PAS DEPUIS LE CLONE.
      # Un sous-chemin peut être déclaré, documenté, et pourtant irrésolvable chez qui installe :
      # il suffit que `files` ne l'embarque pas. C'est exactement ce qui est arrivé au contrat et
      # à la rétention, deux étapes plus haut — la même vérification, étendue à tout ce que la
      # surface annonce comme importable.
      - name: Every public subpath actually resolves for a consumer
        if: matrix.node == '22'
        run: |
          node --input-type=module -e '
            const { publics, formeImportee } = await import("./tools/surface-publique.mjs");
            const { execFileSync } = await import("node:child_process");
            const echecs = [];
            for (const sousChemin of publics()) {
              const importe = formeImportee(sousChemin);
              try {
                execFileSync(process.execPath, ["-e", "require.resolve(" + JSON.stringify(importe) + ")"],
                  { cwd: "/tmp/conso", stdio: "pipe" });
                console.log(importe + " : résolu");
              } catch {
                echecs.push(importe + " — déclaré public, irrésolvable pour un consommateur");
              }
            }
            if (echecs.length) { for (const e of echecs) console.error("::error::" + e); process.exit(1); }
          '

      # ⚠️ Le contrat d'hôte demande une version EXACTE — « une plage fait entrer une version que
      # personne n'a décidé de déployer, le jour où quelqu'un lance npm install pour autre chose ».
      # Deux exemples sur trois disaient `^0.1.0` : un intégrateur qui copie l'exemple récolte
      # exactement ce contre quoi la page qu'il vient de lire le met en garde. La cohérence entre
      # ce qu'on écrit et ce qu'on montre ne se relit pas, elle se garde.
      # ⚠️ `.env.example` est ce qu'un exploitant COPIE. Une variable documentée qui n'y figure pas
      # n'existe pas pour lui — il ne la découvre qu'en cherchant pourquoi quelque chose ne marche
      # pas. `PLAYER_AUTH_URL` a vécu une demi-journée dans ce trou, le jour même de sa sortie :
      # la doc l'annonçait, le fichier à copier l'ignorait.
      #
      # ⚠️ CETTE RÈGLE VIVAIT ICI EN SHELL, ET ELLE LISAIT DE LA PROSE COMME DE LA DONNÉE. Elle
      # relevait TOUT jeton majuscule entre accents graves de la page. Le jour où celle-ci a
      # mentionné `SIGTERM`, `SIGINT` et `SIGKILL` — des noms de SIGNAUX, dans une phrase — elle les
      # a exigés dans `.env.example`. Un contrôle qui demande de tordre la prose pour lui plaire
      # apprend à ses lecteurs à écrire pour la machine.
      #
      # ⚠️ ET LE REMÈDE ÉVIDENT ÉTAIT PIRE — mesuré avant d'être écarté. « Ne lire que les titres »
      # semblait propre : la page n'en porte que DEUX, alors qu'elle documente trente-neuf variables
      # ailleurs. La garde serait devenue verte en ne regardant presque plus rien.
      #
      # Ce qui distingue une variable d'un mot, c'est qu'elle EXISTE ailleurs — le code la lit, ou
      # l'exemple la porte. La règle vit donc dans un outil qui demande son inventaire à l'AST au
      # lieu d'en tenir un second, et qui COMPTE ce qu'il écarte.
      - name: The example env file matches the documented variables
        if: matrix.node == '22'
        run: node tools/env-exemple.mjs

      # ⚠️ LA PARITÉ DOC↔EXEMPLE NE VOIT PAS LE CODE. Les deux textes ci-dessus peuvent être
      # parfaitement d'accord… sur une liste incomplète : ELEVENLABS_API_KEY, _VOICE_ID, _MODEL et
      # PLAYER_HOST_AUTH_STORAGE_KEY ont vécu des semaines lus par le code et absents des deux —
      # un exploitant ne les découvrait qu'en lisant la source (constat d'un audit externe, 21/08 ;
      # même trou que PLAYER_AUTH_URL en son temps, un cran plus haut). Cette garde part donc du
      # CODE : toute variable que le runtime lit doit être dans CONFIGURATION.md — et la parité
      # existante la propage dans .env.example.
      #
      # ⚠️ ELLE LIT L'AST, APRÈS DEUX GÉNÉRATIONS TEXTUELLES QUI ONT ÉCHOUÉ. La v1 (grep) rougissait
      # sur un COMMENTAIRE citant une variable — une sonde qui lit du commentaire invente des
      # coupables, leçon déjà écrite sur la garde PostgREST ci-dessous. La v2 (lexer artisanal) a
      # tenu une demi-journée : un troisième audit externe (21/08) a montré qu'une regex contenant
      # un guillemet, après une parenthèse fermante, masquait TOUT le reste du fichier — un faux
      # négatif silencieux, pire qu'une garde absente puisqu'il fait croire au contrôle.
      # L'extracteur (tools/env-lues.mjs) parse désormais avec `typescript`, déjà présent pour le
      # typecheck : un commentaire, une chaîne, une regex ne sont pas des nœuds exécutés, la
      # question ne se pose plus. Il a ses PROPRES tests (tools/__tests__/envLues.test.js, dont un
      # sur du code réel), déclare ses angles morts, et REFUSE ce dont il ne peut pas lire le nom
      # — `process.env[cle]`, capture par reste, propriété calculée — au lieu de le rater.
      - name: Every variable the code reads is documented
        if: matrix.node == '22'
        run: node tools/env-lues.mjs

      # ⚠️ LES LIENS DU CHANGELOG SE SONT ARRÊTÉS À LA 0.1.41 PENDANT 77 VERSIONS. Chaque titre
      # « ## [x.y.z] » promet une référence de comparaison en pied de fichier ; personne n'écrit
      # ces lignes à la main à chaque sortie, donc elles ont cessé sans que rien ne le dise —
      # 76 titres pointaient dans le vide (constat d'un audit externe, 21/08). Même formule que
      # partout : deux exemplaires d'un fait (les titres, les références), une étape qui les
      # confronte. Le bloc se régénère mécaniquement depuis les titres — cette garde vérifie,
      # elle n'exige aucun entretien manuel.
      #
      # ⚠️ LA PRÉSENCE NE SUFFIT PAS : LES BORNES AUSSI. La première version acceptait une URL
      # présente mais FAUSSE — « compare/v0.1.40...v0.1.42 » passait alors que la version
      # précédant la 0.1.42 est la 0.1.41 (contre-audit, 21/08). L'URL attendue se DÉRIVE de
      # l'ordre réel des sections, jamais de « patch − 1 » : l'historique a au moins une
      # discontinuité (0.1.85 suit 0.1.83), et un calcul naïf l'accuserait à tort.
      # ⚠️ LA RÈGLE VIT DANS UN MODULE, PLUS EN LIGNE ICI. Le préflight de publication
      # (tools/release-preflight.mjs) doit poser exactement la même question avant un tag : deux
      # exemplaires d'une règle divergent, personne ne les confronte, et le jour où l'un se corrige
      # l'autre continue de bénir — c'est le défaut que ce dépôt traque partout ailleurs. Un seul
      # module décide (tools/changelog.mjs), il a ses tests, la forge et le préflight l'appellent.
      - name: Every changelog section has its exact comparison link
        if: matrix.node == '22'
        run: node tools/changelog.mjs

      # ⚠️ `engines` ANNONÇAIT `>=22` ET `pdfjs-dist` EXIGEAIT `>=22.13.0` (mesuré le 25/08). Entre
      # node 22.0 et 22.12, le paquet déclarait donc que tout allait bien et faisait tourner son
      # moteur de rendu — sa SEULE dépendance de production — sur une version que ce moteur déclare
      # non supportée. `engine-strict` vaut `false` par défaut : npm émet un EBADENGINE dans le
      # bruit de l'installation, puis installe.
      #
      # ⚠️ ET CETTE ÉTAPE NE POUVAIT PAS L'ATTRAPER EN TOURNANT SIMPLEMENT. `node-version: "22"`
      # résout au DERNIER 22.x : la CI atterrit toujours au-dessus du plancher, quel qu'il soit.
      # Une règle que l'environnement de vérification satisfait par construction est supposée, pas
      # vérifiée — d'où une garde qui LIT les intervalles au lieu de les éprouver par sa présence.
      - name: The declared Node floor is not more permissive than what production requires
        if: matrix.node == '22'
        run: node tools/plancher-de-node.mjs

      # ⚠️ `crypto` EST UN GLOBAL DEPUIS NODE 18, ET CE N'EST PAS LE MÊME. L'extraction du lot 3 a
      # déplacé `bot-tts` hors de `handler.js` sans emporter son `require` : `crypto.createHash(…)`
      # a désigné WebCrypto, qui n'a pas cette méthode. `no-undef` ne pouvait rien voir — la
      # variable EXISTE, elle désigne autre chose. Signalé par un hôte qui exécutait la panne.
      #
      # ⚠️ ET LA PANNE ÉTAIT TOTALE. `keyFor()` construit la clé du cache, donc il est appelé AVANT
      # de le lire : le jet précède toujours la consultation, aucun « cache hit » ne protège. 500 à
      # chaque appel, pendant deux versions, sur toute instance dont `plugins.bot` est posé.
      - name: Node-only crypto methods are called on the module, never on the global
        if: matrix.node == '22'
        run: node tools/liaison-de-crypto.mjs

      # ⚠️ LA RÈGLE A DÉJÀ ÉTÉ POSÉE UNE FOIS, ET ELLE N'A TENU QUE LÀ OÙ ELLE ÉTAIT ÉCRITE. Le
      # premier scan ZAP baseline (règle 10019, 24/08) a trouvé des refus qui partaient avec un
      # code et un corps et RIEN d'autre : pas de `Content-Type`, donc le seul corps de ce serveur
      # qu'un navigateur avait le droit de deviner. `refuserEnTexte` est née là. Un mois plus tard,
      # l'audit CODEX 5.6 en trouvait trois autres — le `500` du bout de `/doc`, sans aucun type ;
      # le `400` « aucun document demandé », typé mais sans `nosniff` ; et les deux réponses de
      # `bin/serve.js`. Une règle réappliquée à la main se réapplique mal.
      #
      # ⚠️ ET ZAP NE POUVAIT PAS LES VOIR. Le scan visite trois surfaces servies ; un `500`
      # d'exception et un `400` de paramètre manquant ne sont sur aucune d'elles. Ce qu'un scanner
      # atteint dépend de ce qu'on lui donne à visiter — la garde, elle, lit les 25 fichiers.
      # ⚠️ ET LE JSON AVAIT FAIT LA MÊME CHOSE, EN PLUS GRAND — trouvé en mesurant le texte.
      # L'aide de réponse JSON était définie TREIZE fois, à l'identique, sous quatre noms, plus
      # sept corps écrits à la main et cinq réponses inline : vingt endroits, aucun ne posant
      # `nosniff`. Ce n'est pas vingt oublis — c'est ce qu'une recette recopiée devient : la copie
      # initiale était juste, c'est la CORRECTION qui ne se propage pas. Le second volet ne compte
      # donc pas les oublis, il ferme la porte : hors de `server/reponses.js`, aucun fichier ne
      # déclare `application/json`.
      - name: Responses leave by a door, and the door sets the rule
        if: matrix.node == '22'
        run: node tools/portes-de-reponse.mjs

      # ⚠️ UNE PROCÉDURE QU'ON NE PEUT PAS EXÉCUTER EST PIRE QU'UNE ABSENCE DE PROCÉDURE, et
      # `docs/RELEASING.md` l'écrit lui-même — puis listait `ghcr.io/…:<version>` dans sa liste de
      # vérification d'après-sortie, alors que la forge publie `:v0.1.138`. Trouvé en suivant la
      # page pendant la sortie de la 0.1.138 (mesuré : `…/manifests/0.1.138` → 404,
      # `…/manifests/v0.1.138` → 200). Le `gh release view v<version>` deux lignes plus haut portait
      # déjà le `v` : l'incohérence vivait à quatre lignes d'écart, depuis des mois.
      #
      # ⚠️ ET ELLE NE POUVAIT SE VOIR QU'EN LA SUIVANT. Un registre répond 404 pour « n'existe
      # pas » et pour « tu as demandé le mauvais nom » avec les mêmes trois chiffres — donc une
      # ligne fausse est indiscernable d'un pipeline qui a sauté l'image, ce que cette liste existe
      # justement pour attraper (0.1.67 → 0.1.69, trois sorties muettes d'affilée).
      - name: A documented image reference carries the tag the forge publishes
        if: matrix.node == '22'
        run: node tools/image-documentee.mjs

      # ⚠️ UNE GARDE PLANIFIÉE QUI MEURT NE SE VOIT PAS. `publication.yml` ne fait qu'un `checkout` ;
      # quand `exemples-epingles.mjs` a gagné une dépendance à `semver` (0.1.137), sa dernière étape
      # s'est mise à jeter ERR_MODULE_NOT_FOUND avant d'avoir rien mesuré. Le job devenait rouge —
      # sur la page des exécutions planifiées, que personne n'ouvre. Pendant dix-neuf heures,
      # l'issue que cette étape entretient est restée FIGÉE sur son dernier état vrai : elle
      # annonçait 0.1.128 pendant que le registre servait 0.1.138. Une alerte périmée qui a l'air
      # vivante est pire qu'une alerte absente.
      #
      # ⚠️ CE N'EST PAS UN OUBLI, C'EST UNE DISTANCE. Celui qui ajoute un `import` à un outil ne
      # relit pas les neuf workflows pour voir lesquels le lancent — et il a raison, ce n'est pas
      # un travail de mémoire. La règle est donc portée ici, et elle suit la dépendance À TRAVERS
      # les imports : `exemples-en-retard` n'importe pas `semver`, il importe le module qui l'importe.
      - name: Every tool a workflow runs has what it needs to run
        if: matrix.node == '22'
        run: node tools/outils-servis.mjs

      # ⚠️ LA CARTE D'IDENTITÉ EST LA SEULE CHOSE QUE LES HÔTES ÉPINGLENT. Le contrat en montrait
      # une version périmée de cinq publications, à laquelle il manquait deux capacités. Un hôte
      # qui teste la présence d'une capacité d'après la doc conclut qu'elle n'existe pas. La
      # synchroniser à la main est exactement ce qui a échoué — donc on la garde.
      - name: The documented identity card matches the code
        if: matrix.node == '22'
        run: |
          node -e '
            const fs = require("node:fs");
            const src = fs.readFileSync("server/handler.js", "utf8");
            const bloc = src.slice(src.indexOf("capabilities: ["));
            const code = [...bloc.slice(0, bloc.indexOf("]")).matchAll(/"([a-z-]+)"/g)].map(m => m[1]).sort();
            const doc = fs.readFileSync("docs/HOST-CONTRACT.md", "utf8");
            const ligne = doc.split("\n").find(l => l.includes("\"capabilities\""));
            const documentees = [...ligne.matchAll(/"([a-z-]+)"/g)].map(m => m[1]).filter(c => c !== "capabilities").sort();
            const manquantes = code.filter(c => !documentees.includes(c));
            const inventees = documentees.filter(c => !code.includes(c));
            if (manquantes.length || inventees.length) {
              console.error("::error::identity card drift — missing from docs: " + (manquantes.join(", ") || "none") +
                            " | documented but absent from code: " + (inventees.join(", ") || "none"));
              process.exit(1);
            }
            // ATTENTION : cette liste ENUMERE, donc elle ne voit pas ce que personne ny a mis.
            // Trois champs de presence ont ete publies des jours hors contrat sans quelle rougisse.
            // La garde AUTORITAIRE est server/__tests__/carteContrat.test.js : elle rend une vraie
            // carte et compare TOUTES ses cles a lexemple du contrat, dans les deux sens. Ce
            // controle-ci nest quun filet grossier ; ne pas sy fier pour un champ nouveau.
            // (Pas dapostrophe ici : ce script vit dans un node -e en guillemets simples de shell.)
            // Les booléens de configuration doivent apparaître aussi : ils disent ce qui est POSÉ.
            for (const champ of ["separateIssuer", "hostShare", "hostMail", "retentionSweep"]) {
              if (!src.includes(champ + ":")) { console.error("::error::" + champ + " absent du code"); process.exit(1); }
              if (!doc.includes("\"" + champ + "\"")) { console.error("::error::" + champ + " absent du contrat"); process.exit(1); }
            }
            console.log("carte d’identité : " + code.length + " capacités, doc et code d’accord");
          '

      # ⚠️ LE COÛT D'UN PORTAGE NE DOIT PAS GRANDIR EN SILENCE. Les 49 requêtes du cœur sont de
      # la forme `table?colonne=eq.valeur` : rien n'exige la SÉMANTIQUE de PostgREST, seulement sa
      # syntaxe. Une jointure imbriquée ou un `or=()` ajouté un jour changerait ça sans que personne
      # ne le décide — et la doc annonce un chiffre qui deviendrait faux.
      - name: The database surface stays portable-shaped
        if: matrix.node == '22'
        run: |
          # `in.(…)` n'est PAS dans la liste : il se traduit par un `WHERE colonne IN (…)`, donc il
          # ne coûte rien à porter. Ce qui coûte, ce sont les JOINTURES imbriquées et les arbres
          # booléens — là, un portage cesse d'être une traduction et devient une réécriture.
          #
          # ⚠️ ON RETIRE LES COMMENTAIRES AVANT DE CHERCHER. Cette garde lisait tout le fichier, donc
          # aussi les commentaires qui EXPLIQUENT ce qu'elle interdit : écrire « select=a(b) » pour
          # dire « ceci est interdit » la déclenchait. Elle accusait alors du code parfaitement
          # portable, et la seule issue était d'écrire autour d'elle — c'est-à-dire de dégrader
          # l'explication pour satisfaire la garde.
          #
          # Une sonde qui lit du commentaire invente des coupables. Même correction que celle faite
          # le même jour sur la sonde des colonnes de schéma, pour la même raison.
          sans_commentaires=$(grep -avE '^[[:space:]]*//' server/*.js --with-filename --line-number || true)
          exotique=$(printf '%s\n' "$sans_commentaires" | grep -E 'select=[^&`"]*\(|[?&]or=\(|[?&]and=\(|offset=' || true)
          [ -z "$exotique" ] || { echo "::error::PostgREST-specific syntax raises the porting cost:"; echo "$exotique"; exit 1; }
          # ⚠️ ON COMPARE, ON N'AFFICHE PAS. Cette étape se contentait d'imprimer le compte en
          # renvoyant le lecteur vers docs/API.md — deux exemplaires du même fait, et personne pour
          # les mettre côte à côte. Le document annonçait 49 appels « dans trois fichiers » quand il
          # y en avait 51 dans quatre : l'écart s'était installé sans qu'aucune étape ne mente,
          # puisque aucune ne comparait.
          #
          # Un chiffre affiché est une invitation à vérifier ; un chiffre comparé est une garde.
          # Trouvé en appliquant la formule du second hôte : à chaque fois qu'un fait existe en deux
          # exemplaires, quelqu'un doit les confronter au moins une fois — et ici « quelqu'un » peut
          # être cette étape.
          # ⚠️ LES CINQ CHIFFRES, PAS DEUX SUR CINQ. Ce bloc comparait les sites d'appel, puis les
          # fichiers — et laissait « Tables » et « in.(…) » en prose dans la MÊME table. Les deux
          # avaient dérivé (9 pour 10, 2 pour 3), et le troisième, pourtant gardé, comptait UNE
          # MENTION EN COMMENTAIRE comme un site d'appel. Une table dont deux lignes sont vérifiées
          # se lit comme une table vérifiée : c'est pire qu'aucune garde, parce que le lecteur ne
          # peut pas savoir quelle ligne a un contrôle derrière elle.
          #
          # La dérivation vit maintenant dans un module éprouvé (tools/__tests__/surfaceBase.test.js)
          # plutôt qu'en `grep` inline : elle retire les commentaires avant de compter, elle publie
          # le nombre de chemins construits à l'exécution — ce qu'elle ne peut PAS résoudre — et elle
          # refuse quand le document cesse d'annoncer un chiffre sous une forme comparable.
          node tools/surface-base.mjs

      # ⚠️ UN SCRIPT TIERS ENTRE DANS LA PAGE AVEC NOS DROITS. Version exacte + empreinte, sinon
      # ce qui s'exécute chez le visiteur est décidé par quelqu'un d'autre, sans déploiement.
      # Cette garde ne relit PAS une liste écrite à la main : elle part de l'inventaire exporté par
      # le code, puis vérifie qu'aucune URL de script du gabarit ne lui échappe — c'est ce second
      # temps qui compte, le premier ne prouverait que sa propre cohérence.
      # ⚠️ UN INVENTAIRE QUI N'EST PAS LA SOURCE DÉRIVE — c'est exactement ce qui avait vidé
      # supabase/init.sql de ses cinq migrations. Les attentes de schéma sont désormais déclarées
      # une fois dans server/schema.js ; cette étape refuse tout appel qui les contourne, sans quoi
      # la carte d'identité annoncerait un état complet en ignorant une colonne sondée ailleurs.
      - name: Schema expectations go through the declared inventory
        if: matrix.node == '22'
        run: |
          hors=$(grep -arn 'aLaColonne(' server/*.js | grep -v '^server/schema.js:' || true)
          [ -z "$hors" ] || { echo "::error::sonde de schéma hors inventaire — utilisez attendue(nom) :"; echo "$hors"; exit 1; }
          n=$(grep -ac 'migration: "supabase/migrations/' server/schema.js)
          echo "attentes de schéma déclarées : $n"

      - name: Third-party scripts are pinned and fingerprinted
        if: matrix.node == '22'
        run: |
          node -e '
            const fs = require("node:fs");
            const { TIERS } = require("./server/handler.js");
            const echecs = [];

            for (const [cle, t] of Object.entries(TIERS)) {
              if (!/^sha384-[A-Za-z0-9+/]{60,}={0,2}$/.test(t.sri || "")) echecs.push(cle + " : empreinte absente ou mal formée");
              // Une étiquette majeure (@2) ou « latest » suit la dernière publication du tiers :
              // le code servi change alors sans déploiement, et aucune empreinte ne peut tenir.
              if (/@\d+\/|@latest|\/latest\//.test(t.url)) echecs.push(cle + " : version mouvante — " + t.url);
              if (!/\d+\.\d+\.\d+/.test(t.url)) echecs.push(cle + " : pas de version exacte — " + t.url);
            }

            // Toute URL de script du gabarit doit venir de linventaire. Deux CHARGEURS ny entrent
            // pas, et cest structurel : leur réponse change à chaque appel et ils injectent
            // eux-mêmes dautres scripts, donc aucune empreinte nest possible dessus. On les nomme
            // ici AVEC leur raison — une exception écrite se relit, une exception fondue dans le
            // décor devient la règle. Ajouter un tiers demain force donc un choix visible : épinglé
            // et empreinté, ou inscrit ici avec ce quon accepte en connaissance de cause.
            const SANS_EMPREINTE = {
              "maps.googleapis.com": "chargeur de cartes : URL versionnée par un paramètre, réponse variable",
              "accounts.google.com/gsi/client": "chargeur didentité Google : aucune version publiée",
            };
            const src = fs.readFileSync("server/handler.js", "utf8")
              .split("\n").filter((l) => !/^\s*\/\//.test(l)).join("\n");
            const connues = new Set(Object.values(TIERS).map((t) => t.url));
            const urls = [...src.matchAll(/(?:src=["'"'"']|s\.src=["'"'"'])(https:\/\/[^"'"'"'`]+)/g)].map((m) => m[1]);
            for (const u of new Set(urls)) {
              if (connues.has(u)) continue;
              if (Object.keys(SANS_EMPREINTE).some((motif) => u.includes(motif))) continue;
              echecs.push("script hors inventaire : " + u);
            }

            if (echecs.length) { console.error("::error::" + echecs.join(" | ")); process.exit(1); }
            console.log("tiers : " + Object.keys(TIERS).length + " dépendances épinglées et empreintées, aucune hors inventaire");
          '

      # ⚠️ UNE ACTION RÉFÉRENCÉE PAR ÉTIQUETTE EST UNE DÉPENDANCE MOUVANTE — le défaut de `@2`,
      # retourné sur notre propre chaîne : cette forge PUBLIE sur npm. Une étiquette peut être
      # redéplacée sur un autre commit par son auteur, ou par qui prend son compte ; le SHA, lui,
      # ne désigne qu'un arbre. L'étiquette reste en commentaire : un SHA nu se relit comme du
      # bruit, et on ne saurait plus quoi comparer à la montée suivante.
      # ⚠️ ET ELLE ÉTAIT AVEUGLE DANS LES DEUX SENS, en `grep`. Elle voyait des COMMENTAIRES —
      # écrire la règle en prose rendait la CI rouge, et c'est comme ça qu'on l'a trouvée. Surtout,
      # elle NE VOYAIT PAS DES ACTIONS : son motif exigeait un nom non quoté juste après `uses: `,
      # donc ces trois lignes passaient sans un mot, constaté sur un workflow de sonde —
      #     - uses: "actions/checkout@v4"   - uses: 'actions/cache@main'   - uses:  x/y@v3
      # Même défaut que le lexer de tools/env-lues.mjs, corrigé pour la même raison : on ne lit pas
      # un format structuré avec une expression régulière. `uses:` n'est reconnu qu'en position de
      # CLÉ, hors commentaire et hors bloc `run: |`.
      - name: GitHub actions are pinned to immutable commits
        if: matrix.node == '22'
        run: node tools/actions-epinglees.mjs

      # ⚠️ ET LE JETON QU'ELLES REÇOIVENT ? Cinq des huit workflows accordaient une permission
      # d'ÉCRITURE à la racine (relevé du 22/08) : `cla.yml` trois, `codeql.yml`, `image.yml`,
      # `image-reconcile.yml` et `publication.yml` une chacun. Aucun n'était fautif dans son
      # intention — chacun avait un job qui en avait vraiment besoin. Ce qu'ils laissaient ouvert,
      # c'est le job SUIVANT : celui que personne n'a encore écrit hérite du droit sans le demander,
      # et son auteur ne le verra pas. Un privilège qui s'accorde par oubli est l'inverse exact du
      # refus-par-défaut appliqué partout ailleurs ici.
      #
      # `release.yml` en avait déjà fait la démonstration : son job qui exécute un tarball
      # TÉLÉCHARGÉ du registre tournait avec de quoi publier sur npm, parce que les droits vivaient
      # à la racine.
      - name: No workflow grants write permission at its root
        if: matrix.node == '22'
        run: node tools/permissions-workflows.mjs

      # ⚠️ ET L'ÉTIQUETTE ÉCRITE À CÔTÉ DIT-ELLE LA VÉRITÉ ? La garde ci-dessus vérifie que le SHA
      # EST un SHA. Elle ne dit rien de ce que le commentaire ANNONCE — et #253 a posé trois SHA de
      # `github/codeql-action` tagués v4.37.7 en laissant `# v3` intact. Le fichier annonçait un
      # correctif là où il posait une MAJEURE sur l'outil d'analyse de sécurité du dépôt, et la CI
      # était verte. C'est la confrontation étiquette↔condensat du Dockerfile (même PR, #274), qui
      # n'avait pas été portée du côté des actions : le raisonnement était écrit, le contrôle
      # manquait. Il faut le réseau ; si un dépôt ne répond pas, on le DIT sans rougir — une panne
      # et un mensonge ne se disent pas avec le même silence.
      - name: The tag beside each SHA tells the truth
        if: matrix.node == '22'
        run: node tools/actions-versions.mjs

      # ⚠️ LA MÊME RÈGLE, ET ELLE NE S'APPLIQUAIT QU'À MOITIÉ. Le contrôle ci-dessus refuse
      # `uses: machin@v3` depuis longtemps ; `FROM node:24-alpine` disait exactement la même chose
      # — une étiquette que son auteur redéplace quand il veut — et rien ne le regardait (P1, audit
      # externe, 21/08). Deux constructions du MÊME commit rendaient deux images : celle qu'on
      # éprouve ici, et celle qu'un auto-hébergeur obtient trois semaines plus tard. Aucune n'est
      # fausse ; rien ne disait laquelle tourne.
      # `.zap/Dockerfile` entre dans le périmètre : l'image du scanner est une dépendance comme
      # une autre — mouvante, elle changerait les règles du garde sans qu'aucun commit ne bouge.
      - name: Container base images are pinned to a digest
        if: matrix.node == '22'
        run: node tools/images-epinglees.mjs Dockerfile .zap/Dockerfile

      # ⚠️ ET ELLE NE S'APPLIQUAIT ENCORE QU'À MOITIÉ — au FICHIER, pas à la RÈGLE. L'étape
      # ci-dessus refuse une étiquette mobile dans un `Dockerfile` ; pendant ce temps la forge
      # lançait `postgres:16-alpine` en service et `postgrest/postgrest:v12.2.3` dans un
      # `docker run` (audit CODEX 5.6, 25/08). Ces deux images-là font tourner les bancs de BASE :
      # contraintes, atomicité, migrations réelles. Une preuve produite contre un PostgreSQL qui
      # n'est pas celui qu'on croit reste une preuve, mais plus personne ne sait de quoi.
      #
      # ⚠️ LA SONDE NE LIT QUE DU YAML, ET C'EST UN CHOIX PAYÉ D'UN ÉCHEC. Un premier essai
      # cherchait les images dans les blocs `run:` : il a accusé `host` (pris dans
      # `--network host`) et deux images construites sur place, qui n'ont pas de registre et donc
      # rien à épingler — trois faux positifs sur trois trouvailles. D'où la règle d'ÉCRITURE du
      # dépôt : une image de registre se DÉCLARE (`services.*.image`, `container:`, ou un `env:`
      # nommé `IMAGE_…`), jamais dans le corps d'une commande. La garde refuse aussi un
      # `$IMAGE_…` employé sans déclaration, pour que la convention ne tienne pas au souvenir.
      - name: Registry images pulled by the forge are pinned to a digest
        if: matrix.node == '22'
        run: node tools/images-des-workflows.mjs

      # ⚠️ LE SEUL DÉFAUT DE CE DÉPÔT QU'UN COMMIT NE CORRIGE PAS. `.gitignore` exclut `.env` et
      # `.env.*`, et aucun secret n'a jamais été commité — mais `.gitignore` ne protège qu'un
      # CHEMIN, et « ça n'est jamais arrivé » décrit le passé. Un jeton collé dans un test, une clé
      # PEM dans une fixture, un `.env.example` rempli pour faire tourner la démo chez soi puis
      # commité avec le reste : les trois entrent sans qu'un seul motif les regarde.
      #
      # Et un secret poussé ne se retire pas. Réécrire l'historique n'y change rien — ce qui a été
      # public une minute est divulgué, et la seule issue est la RÉVOCATION. C'est pourquoi la même
      # garde tourne AUSSI dans `tools/git-hooks/pre-push`, avant que le dépôt distant le voie :
      # ici elle constate, là-bas elle empêche.
      - name: No plaintext credentials in the repository
        if: matrix.node == '22'
        run: node tools/secrets-en-clair.mjs

      # ⚠️ LA FRONTIÈRE AGPL/MIT N'ÉTAIT QUE DE LA PROSE. `src/bridge.ts` est MIT « délibérément,
      # et c'est le seul » ; AGENTS.md demande de ne pas déplacer de code à travers cette ligne.
      # Aucun contrôle ne tenait ces deux phrases : un fichier créé du mauvais côté ne faisait
      # rougir personne. Chaque fichier source porte désormais ses deux lignes (SPDX + copyright,
      # exigence Gold license_per_file / copyright_per_file), la licence attendue est LUE dans
      # package.json plutôt qu'écrite deux fois, et les fichiers générés la reçoivent de
      # build/bundle.mjs — s'ils rougissent, le correctif est dans la bannière du build.
      - name: Every source file names its licence and its copyright
        if: matrix.node == '22'
        run: node tools/licence-par-fichier.mjs

      # ⚠️ DEUX SEUILS, PARCE QUE LES DEUX ARBRES N'ONT PAS LE MÊME RAYON D'ACTION — et le seuil
      # est écrit ici ET dans docs/DEPENDENCIES.md, où un consommateur peut le lire sans ouvrir
      # une CI.
      #
      #   - L'arbre de PRODUCTION est ce qui tourne chez l'auto-hébergeur, à côté de ses documents
      #     commerciaux et sous ses identifiants. Il compte UNE dépendance. Le seuil y est donc
      #     `low` : tolérer quoi que ce soit reviendrait à choisir de livrer une faille connue dans
      #     un arbre qu'on peut lire en entier.
      #   - L'arbre de DÉVELOPPEMENT ne quitte jamais le dépôt (`files` filtre le tarball). Une
      #     faille y menace nos machines et cette forge, pas les instances. Le seuil est `high` :
      #     bloquer sur une modérée dans un plugin de test arrêterait la livraison de correctifs
      #     pour une menace qui ne les concerne pas — et une CI qu'on apprend à contourner ne
      #     garde plus rien.
      #
      # ⚠️ CE CONTRÔLE EXIGE LE RÉSEAU : il interroge l'avis de sécurité du registre. S'il tombe
      # pour cette raison, c'est la garde qui n'a pas pu regarder — pas la branche. On le DIT,
      # plutôt que d'imputer à l'auteur un rouge dont il n'est pas responsable.
      # ⚠️ LA GARDE NE LIT PLUS LE CODE DE SORTIE DE `npm audit`, ET C'ÉTAIT LE DÉFAUT. Il vaut
      # non-zéro pour deux raisons sans rapport — des failles trouvées, ou un registre injoignable —
      # et l'étape imputait la seconde à la branche, en annonçant une « faille connue » qui
      # n'existait pas. Le commentaire ci-dessus promettait pourtant de les distinguer.
      # `tools/failles-connues.mjs` lit le relevé lui-même et rend 2 quand il n'a rien pu voir.
      - name: Dependencies carry no known vulnerability above the documented threshold
        if: matrix.node == '22'
        run: node tools/failles-connues.mjs

      # ⚠️ EXACTE NE SUFFIT PAS : IL FAUT AUSSI LA NÔTRE. Cette garde n'interdisait que les plages
      # (`^`, `~`) — et pendant ce temps la démo épinglait 0.1.20 et les exemples Express et Vercel
      # 0.1.7, cent onze versions en arrière, sans qu'aucune étape ne rougisse (constat d'un audit
      # externe, 21/08). Un exemple est le code que les gens RECOPIENT : celui qui copiait recevait
      # un player d'avant les correctifs P0, depuis un dépôt dont le README vante la fraîcheur.
      # On compare donc à LA version que main déclare — l'égalité stricte interdit les plages par
      # construction, l'ancienne garde est un cas particulier de celle-ci. Fenêtre assumée, SANS
      # BORNE GARANTIE : entre la fusion d'un bump et sa publication npm, les exemples pointent
      # sur une version pas encore servie. Quelques minutes quand le tag part aussitôt — mais le
      # tag est un geste HUMAIN, et s'il ne part pas, rien ici ne le force : la garde autonome de
      # publication.yml (horaire, après plus d'une heure de divergence) ouvre une issue, puis une
      # personne agit. C'est la même fenêtre que la démo, décrite dans release.yml, et c'est un
      # arbitrage accepté — pas une propriété.
      # ⚠️ DEUX VERSIONS SONT ACCEPTABLES, ET C'EST LA FENÊTRE CI-DESSUS QUI L'IMPOSE.
      #
      # Exiger la SEULE version de main rendait une PR de montée de version rouge PAR CONSTRUCTION :
      # cette version n'existe pas encore sur npm, donc le déploiement de la démo (qui installe
      # depuis le registre) échoue à chaque fois. Un contrôle qui échoue par construction cesse
      # d'être lu — il a été vu rouge et ignoré trois fois de suite le jour où on l'a corrigé, et le
      # rouge de déploiement sert aussi à autre chose. Une garde absente est un état connu ; une
      # garde qui crie faux contamine le canal.
      #
      # On accepte donc la version de main OU la dernière PUBLIÉE. Ce que la garde protège reste
      # intact : un exemple oublié plusieurs versions en arrière n'est ni l'une ni l'autre, donc il
      # rougit. Seule la fenêtre entre la fusion et la publication cesse d'être une fausse alerte.
      #
      # Si le registre est injoignable, on retombe sur la règle stricte : ne pas savoir ne doit pas
      # élargir ce qu'on autorise.
      #
      # ⚠️ CONSÉQUENCE SUR LA PROCÉDURE DE SORTIE, ET ELLE EST TENUE PAR LE CONTRÔLE, PAS PAR CE
      # COMMENTAIRE. Les exemples s'épinglent sur la DERNIÈRE PUBLIÉE, pas sur la version qu'on est
      # en train de publier : les monter dans la PR de sortie repasserait la première règle (ils
      # vaudraient la version de main) mais ferait ÉCHOUER le déploiement de la démo, qui installe
      # depuis le registre — le rouge se déplacerait du contrôle vers le déploiement sans rien
      # gagner. Leur retard d'une version est la propriété recherchée, pas un oubli.
      #
      # Cette règle a d'abord vécu ICI SEULEMENT, en prose. Le second hôte l'a relevé : quelqu'un
      # qui voudra BIEN FAIRE montera les exemples au bon moment et rallumera le rouge structurel
      # avec les meilleures intentions, sans que rien ne l'arrête. Elle se caractérise — « la version
      # épinglée doit déjà être SERVIE par le registre » — donc elle est devenue un contrôle.
      # ⚠️ CETTE GARDE ÉTAIT ROUGE DANS L'ÉTAT NORMAL DU DÉPÔT, ET ÇA LUI A COÛTÉ UNE PR (#273).
      # Elle acceptait « la version de main OU la dernière publiée » — or les deux valent la même
      # chose dès la sortie faite, donc des exemples restés une version en arrière n'étaient plus ni
      # l'une ni l'autre. Rouge sur main, sur chaque PR ouverte, sur les suivantes. Pas un oubli
      # isolé : L'ÉTAT QUI SUIT CHAQUE SORTIE. Deux personnes ont trébuché dessus dans la même
      # heure, chacune le réparant dans une PR qui parlait d'autre chose.
      #
      # Le commentaire d'ici affirmait pourtant que « leur retard d'une version est la propriété
      # recherchée ». Le texte et le contrôle se contredisaient ; c'est le contrôle qui gagne.
      #
      # LA RÈGLE TIENT MAINTENANT EN UNE LIGNE : un exemple épingle l'une des DEUX DERNIÈRES
      # VERSIONS PUBLIÉES. Elle contient les deux anciennes — la version pas encore servie reste
      # refusée (elle casserait le déploiement de la démo), l'exemple oublié plusieurs versions en
      # arrière aussi. Seul le retard d'UNE version cesse d'être rouge, et c'est précisément celui
      # que la prose appelait la propriété recherchée. Les cinq états sont au banc.
      - name: Examples pin one of the last two published versions
        if: matrix.node == '22'
        run: node tools/exemples-epingles.mjs

      # ⚠️ UN EXEMPLE QUI N'EST JAMAIS EXÉCUTÉ EST UNE AFFIRMATION, PAS UN EXEMPLE. Celui-ci
      # s'installe comme un copieur le ferait — sauf le player lui-même, pris depuis le tarball du
      # commit (la version épinglée peut ne pas encore être publiée, cf. la fenêtre ci-dessus) :
      # c'est le CODE de l'exemple qu'on éprouve contre le CODE courant, pas le registre.
      - name: The express example actually serves a document
        if: matrix.node == '22'
        run: |
          rm -rf /tmp/exsmoke && cp -r examples/express /tmp/exsmoke && cd /tmp/exsmoke
          # ⚠️ On n'écrit PAS « express » ici : l'exemple le déclare (`^4.19.2`), et l'ajouter
          # réécrivait la plage dans la copie — un copieur, lui, lance `npm i` tout court.
          # (Vérifié : les deux formes installent la même version, npm respectant la plage déjà
          # déclarée ; c'est une redondance, pas un défaut de version.)
          #
          # ⚠️ ET CE `npm i` RESTE NON ÉPINGLÉ EN CONNAISSANCE DE CAUSE (Scorecard le signale).
          # L'assertion de ce banc est « s'installer comme un copieur le ferait » : un lockfile
          # d'éprouvette installerait ce que NOUS avons figé, plus ce que l'exemple déclare — le
          # banc cesserait d'éprouver l'exemple. On préfère l'assertion au point de score.
          npm i --silent "$GITHUB_WORKSPACE"/discovery-media-player-*.tgz >/dev/null
          mkdir -p documents && cp "$GITHUB_WORKSPACE"/examples/demo/documents/sample.pdf documents/
          # PLAYER_LOCAL_ROOT : sans lui le relais refuse le fichier local — refus par défaut,
          # constaté en écrivant ce banc. C'est la variable que le README de l'exemple fait poser.
          PLAYER_LOCAL_ROOT=./documents PORT=4300 node server.js & SRV=$!
          for i in $(seq 1 20); do curl -fsS "localhost:4300/api/doc?contract=1" >/dev/null 2>&1 && break || sleep 1; done
          curl -fsS "localhost:4300/api/doc?contract=1" | grep -q '"contract"' || { echo "::error::l'exemple express ne sert pas le contrat"; kill $SRV; exit 1; }
          curl -fsS "localhost:4300/documents/sample.pdf" | grep -qi "<html\|<!doctype" || { echo "::error::l'exemple express n'ouvre pas un document local"; kill $SRV; exit 1; }
          kill $SRV
          echo "exemple express : contrat servi, document ouvert"

  # ⚠️ CE QUE `npm test` NE PEUT PAS VOIR. `jsdom` n'applique pas la CSP, et le `res` postiche des
  # essais serveur se contente d'ENREGISTRER les en-têtes. Une politique qui interdit nos propres
  # scripts passe donc les 690 essais et donne un écran blanc chez le visiteur. Il faut un moteur
  # qui refuse pour de vrai — d'où cette étape, et son navigateur.
  #
  # Séparée de `check` : un banc navigateur qui s'invite dans la commande de base la rendrait
  # inexécutable dans un conteneur nu, et personne ne la lancerait plus en boucle.
  navigateur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # ⚠️ ON NOMME LE NAVIGATEUR AVANT DE S'EN SERVIR. Le banc s'esquive en local quand il n'y a pas
      # de Chrome — c'est confortable, et ce serait un trou béant ici : le jour où l'image de la
      # forge cesse d'en embarquer un, l'étape passerait au vert sans avoir rien exercé. `CI` étant
      # posé, le banc échoue au lieu de s'esquiver ; cette ligne dit juste lequel, et depuis quand.
      - run: google-chrome --version
      - run: npm run test:e2e

  # ⚠️ `supabase/init.sql` ANNONÇAIT « UN SEUL FICHIER, SANS RIEN À LIRE AILLEURS » — ET IL ÉTAIT
  # INCOMPLET. Aucune des cinq migrations n'y figurait : un hôte neuf installait une base sans rang
  # d'écriture, sans limites de débit partagées et sans clé d'idempotence. Les sondes de schéma
  # dégradent en SILENCE, par conception, pour ne pas casser un hôte en cours de migration — donc
  # cet hôte-là ne l'apprenait jamais. Trois protections éteintes, pour toujours, sans un mot.
  #
  # ⚠️ CETTE GARDE NE LIT PAS LE TEXTE, ELLE EXÉCUTE LES DEUX. Comparer par `grep` ne prouverait que
  # la présence d'un mot ; ici on installe une base VIERGE avec init.sql, on relève sa forme, on
  # rejoue les migrations par-dessus, et on exige que RIEN n'ait bougé. C'est la formule déjà
  # employée pour docs/API.md : quand un fait existe en deux exemplaires, quelqu'un doit les
  # confronter au moins une fois — et « quelqu'un » peut être cette étape.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Un vrai Postgres, parce que le double en mémoire le dit lui-même : « pas de contraintes,
        # pas de transactions… PAS un substitut pour vérifier ce qui relève du SGBD ».
        # ⚠️ ÉPINGLÉE PAR CONDENSAT, comme le Dockerfile et pour la même raison : `16-alpine`
        # désigne une image différente chaque semaine, et deux exécutions du MÊME commit ne
        # prouvent alors pas la même chose. L'étiquette reste à côté pour qu'un humain lise ce
        # qu'il est censé lire ; le condensat fait foi (audit CODEX 5.6, 25/08).
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_PASSWORD: player
          POSTGRES_DB: player
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: player
      PSQL: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d player -qtA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: init.sql brings a virgin database up on its own
        run: $PSQL -f supabase/init.sql

      # La forme, telle que la base la rapporte : colonnes, index, fonctions. Pas le texte du
      # fichier — ce qui en RÉSULTE.
      - name: Record the shape
        run: |
          cat > /tmp/forme.sql <<'SQL'
          select 'colonne', table_name, column_name, data_type || ' ' || is_nullable, coalesce(column_default,'')
            from information_schema.columns where table_schema='public'
          union all select 'index', tablename, indexname, indexdef, ''
            from pg_indexes where schemaname='public'
          union all select 'fonction', '', p.proname, pg_get_function_identity_arguments(p.oid), ''
            from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'
          union all select 'trigger', event_object_table, trigger_name, action_timing || ' ' || event_manipulation, ''
            from information_schema.triggers where trigger_schema='public'
          union all select 'fonctiondef', '', p.proname, md5(pg_get_functiondef(p.oid)), ''
            from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'
          union all select 'triggerdef', c.relname, t.tgname, md5(pg_get_triggerdef(t.oid)), ''
            from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and not t.tgisinternal
          union all select 'publication', pubname, tablename, '', ''
            from pg_publication_tables where schemaname='public'
          union all select 'replident', relname, c.relreplident::text, '', ''
            from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and c.relkind='r'
          union all select 'contrainte', rel.relname, con.conname,
                 pg_get_constraintdef(con.oid) || ' valid=' || con.convalidated::text, ''
            from pg_constraint con join pg_class rel on rel.oid=con.conrelid
            join pg_namespace n on n.oid=rel.relnamespace where n.nspname='public'
          order by 1,2,3,4;
          SQL
          $PSQL -f /tmp/forme.sql > /tmp/avant.txt
          wc -l < /tmp/avant.txt | xargs echo "forme après init.sql : lignes ="

      - name: Replaying every migration changes nothing
        run: |
          for f in supabase/migrations/*.sql; do echo "→ $f"; $PSQL -f "$f"; done
          $PSQL -f /tmp/forme.sql > /tmp/apres.txt
          if ! diff -u /tmp/avant.txt /tmp/apres.txt; then
            echo "::error::supabase/init.sql est incomplet : une migration a encore quelque chose à ajouter. Un hôte neuf installerait une base amputée, et les sondes de schéma le lui tairaient."
            exit 1
          fi
          echo "init.sql contient déjà tout ce que les migrations apportent."

      # ⚠️ LA FORME NE VOIT NI LES PUBLICATIONS NI LE REPLICA IDENTITY SANS QU'ON LES LUI DONNE — le
      # relevé ci-dessus les inclut désormais, sans quoi la parité init/migrations ne couvrait ni
      # l'un ni l'autre (même angle mort, déjà comblé deux fois : nullabilité, triggers). Ce
      # scénario rejoue une BASE ANCIENNE : publication présente, table publiée, REPLICA FULL —
      # l'état exact qu'init.sql installait jusqu'à la 0009 — puis exige que la migration nettoie,
      # DEUX FOIS (rejouable), et qu'une base née du nouvel init.sql ne publie jamais la table.
      - name: An old base is cleaned by 0009, twice
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -qtA -c "create database ancienne"
          VIEUX="psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d ancienne -qtA"
          $VIEUX -f supabase/init.sql
          $VIEUX -c "create publication supabase_realtime"
          $VIEUX -c "alter publication supabase_realtime add table public.doc_presentation_messages"
          $VIEUX -c "alter table public.doc_presentation_messages replica identity full"
          for tour in 1 2; do $VIEUX -f supabase/migrations/0009-chat-hors-postgres-changes.sql; done
          publiees=$($VIEUX -c "select count(*) from pg_publication_tables where pubname='supabase_realtime' and schemaname='public' and tablename='doc_presentation_messages'")
          [ "$publiees" = "0" ] || { echo "::error::la table est encore publiée après 0009 (x$publiees)"; exit 1; }
          ident=$($VIEUX -c "select c.relreplident from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='doc_presentation_messages'")
          [ "$ident" = "d" ] || { echo "::error::replica identity encore '$ident' après 0009 (attendu 'd')"; exit 1; }
          echo "base ancienne nettoyée, deux passages, replident=d"

      - name: A fresh install never publishes the chat table, even when the publication pre-exists
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -qtA -c "create database neuve"
          NEUF="psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d neuve -qtA"
          $NEUF -c "create publication supabase_realtime"
          $NEUF -f supabase/init.sql
          publiees=$($NEUF -c "select count(*) from pg_publication_tables where pubname='supabase_realtime' and schemaname='public' and tablename='doc_presentation_messages'")
          [ "$publiees" = "0" ] || { echo "::error::init.sql a publié la table du chat alors que plus rien ne l'écoute"; exit 1; }
          echo "installation neuve : table jamais publiée"

      # ⚠️ LE SCELLÉ DE L'ARCHIVE PRÉTENDAIT UNE ATOMICITÉ QUE SON VERROU NE FOURNISSAIT PAS.
      # La clôture modifie `active` et `control_hash` — des colonnes NON-CLÉS — donc son UPDATE
      # prend FOR NO KEY UPDATE, que le FOR KEY SHARE du trigger NE BLOQUE PAS (matrice des verrous
      # PostgreSQL). Le trigger vérifiait « ouverte », la clôture se committait sous lui, le message
      # entrait dans l'archive. Cinquième audit, constat P1-1. Ce test est la SEULE preuve possible :
      # deux transactions réelles — PostgREST ne sait pas faire ça, psql si. Les deux sens :
      # une clôture non committée doit faire ATTENDRE puis REFUSER l'écriture ; une écriture en
      # cours doit faire attendre la clôture.
      - name: The archive seal blocks a concurrent close, both ways
        run: |
          $PSQL -c "insert into public.doc_presentations (slug, control_hash, file_url, active) values ('__course', 'h', 'https://exemple.test/x.pdf', true)"

          ( psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d player -qtA <<'SQL'
          begin;
          update public.doc_presentations set active=false, control_hash=null where slug='__course';
          select pg_sleep(2);
          commit;
          SQL
          ) &
          CLOTURE=$!
          sleep 0.6
          debut=$(date +%s%N)
          set +e
          sortie=$($PSQL -c "insert into public.doc_presentation_messages (slug, body) values ('__course', 'pendant la clôture')" 2>&1)
          code=$?
          set -e
          wait $CLOTURE
          duree=$(( ( $(date +%s%N) - debut ) / 1000000 ))
          echo "écriture pendant clôture : code=$code durée=${duree}ms"
          [ $code -ne 0 ] || { echo "::error::le message est ENTRÉ dans l'archive — le verrou du trigger ne bloque pas la clôture concurrente"; exit 1; }
          echo "$sortie" | grep -q "archivee" || { echo "::error::refusé pour une autre raison que le scellé : $sortie"; exit 1; }
          [ $duree -ge 1200 ] || { echo "::error::l'écriture n'a pas ATTENDU la clôture (${duree}ms) : les verrous ne se voient pas"; exit 1; }

          $PSQL -c "update public.doc_presentations set active=true, control_hash='h' where slug='__course'"
          ( psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d player -qtA <<'SQL'
          begin;
          insert into public.doc_presentation_messages (slug, body) values ('__course', 'avant la clôture');
          select pg_sleep(2);
          commit;
          SQL
          ) &
          ECRITURE=$!
          sleep 0.6
          debut=$(date +%s%N)
          $PSQL -c "update public.doc_presentations set active=false, control_hash=null where slug='__course'"
          duree=$(( ( $(date +%s%N) - debut ) / 1000000 ))
          wait $ECRITURE
          echo "clôture pendant écriture : durée=${duree}ms"
          [ $duree -ge 1200 ] || { echo "::error::la clôture n'a pas attendu l'écriture en cours (${duree}ms)"; exit 1; }
          n=$($PSQL -c "select count(*) from public.doc_presentation_messages where slug='__course'")
          [ "$n" = "1" ] || { echo "::error::le message écrit AVANT la clôture doit exister (n=$n)"; exit 1; }
          $PSQL -c "delete from public.doc_presentation_messages where slug='__course'"
          $PSQL -c "delete from public.doc_presentations where slug='__course'"

      # ⚠️ « REJOUABLE » DOIT AUSSI VALOIR DEPUIS UNE ANCIENNE BASE — c'est même son seul intérêt :
      # une base vierge n'a pas besoin d'être rejouée. Or l'index d'une colonne CONDITIONNELLE
      # (idem_key) était créé ligne 62 quand le rattrapage qui ajoute la colonne vivait ligne 410 :
      # une base née de l'init 0.1.64 cassait à la ligne 62, avant d'atteindre ce qui l'aurait
      # sauvée. Sixième audit. Ce scénario installe l'init HISTORIQUE (depuis le tag git), rejoue
      # l'actuel, et exige la même forme qu'une installation vierge — deux TOUTS comparés.
      - name: Yesterday's install replays today's init.sql
        run: |
          git fetch --quiet --depth 1 origin tag v0.1.64
          git show v0.1.64:supabase/init.sql > /tmp/init-v64.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -qtA -c "create database hier"
          HIER="psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d hier -qtA"
          $HIER -f /tmp/init-v64.sql
          $HIER -f supabase/init.sql
          $HIER -f /tmp/forme.sql > /tmp/forme-hier.txt
          if ! diff -u /tmp/avant.txt /tmp/forme-hier.txt; then
            echo "::error::rejouer l'init actuel sur une base 0.1.64 ne donne PAS la forme d'une installation vierge"
            exit 1
          fi
          echo "base 0.1.64 → rejeu de l'init actuel : forme identique au vierge"

      # ⚠️ CHAQUE COLONNE À DONNÉE PERSONNELLE A UNE POLITIQUE DE RÉTENTION ÉCRITE — deny-by-default.
      #
      # Le vrai sujet d'une purge n'est pas « fait-elle ce qu'elle dit » mais « ce qu'elle dit
      # couvre-t-il ce qui existe » : une donnée hors périmètre déclaré ne fait bouger aucun
      # compte, et tous les contrôles sont sincères (second hôte, 19/08). Cette garde énumère donc
      # CE QUI EXISTE — les colonnes du schéma VIVANT, par information_schema, jamais par notre
      # mémoire du fichier — et classe par FORMES (email, ip, ua, nom, corps, clé de session…),
      # pas par instances : une colonne nouvelle qui matche une forme rougit ici tant que
      # docs/RETENTION.md ne dit pas son sort (purgée après N / conservée parce que). Sur-matcher
      # coûte une ligne de documentation ; sous-matcher coûte une donnée qui survit sans politique.
      - name: Every personal-data column has a written retention policy
        run: |
          $PSQL -c "
            select table_name || '.' || column_name
            from information_schema.columns
            where table_schema = 'public'
              and (column_name ~ '(email|name|avatar|body|comment|hash|attachment|session|token|content|rating|pages|text|user)'
                   or column_name in ('ip','ua','key','client_key','attendee_key','created_by'))
            order by 1;" > /tmp/personnelles.txt
          test -s /tmp/personnelles.txt || { echo "::error::le recensement des colonnes n'a rien rendu — la sonde vise à côté"; exit 1; }
          echo "périmètre existant : $(wc -l < /tmp/personnelles.txt) colonnes à forme personnelle"
          manque=0
          while read -r col; do
            grep -qF "\`$col\`" docs/RETENTION.md 2>/dev/null || { echo "::error::$col existe dans le schéma et n'a AUCUNE politique dans docs/RETENTION.md"; manque=1; }
          done < /tmp/personnelles.txt
          [ "$manque" = "0" ] || exit 1
          echo "chaque colonne à forme personnelle a sa politique écrite"

      # ⚠️ Le fichier se dit « rejouable ». Une affirmation jamais éprouvée n'est pas une propriété.
      - name: init.sql is replayable
        run: |
          $PSQL -f supabase/init.sql
          $PSQL -f /tmp/forme.sql > /tmp/rejoue.txt
          diff -u /tmp/avant.txt /tmp/rejoue.txt || { echo "::error::rejouer init.sql modifie la base"; exit 1; }

      # ⚠️ DIX TABLES DÉCLARAIENT LA RLS, ET RIEN NE LE VÉRIFIAIT. Un hôte a appliqué la 0021 le
      # 27/08 et a rapporté le geste qui manque ici : « ma première vérification lisait la table en
      # anon : 0 ligne. C'est le résultat attendu — et il était compatible avec deux explications,
      # "la RLS refuse" et "la table est vide", qui rendent exactement le même nombre sur une table
      # neuve. » Il a refait la mesure en posant une ligne d'abord. De notre côté, la propriété
      # n'était mesurée d'AUCUNE façon : `enable row level security` était écrit dix fois dans
      # `supabase/`, et zéro banc, zéro étape ne demandait à la base si elle en avait tenu compte.
      # Une posture de sécurité affirmée en commentaire et jamais confrontée est une affirmation,
      # pas une propriété.
      #
      # ⚠️ LA LISTE VIENT DES SOURCES, PAS D'ICI. Une liste écrite dans cette étape serait un second
      # exemplaire d'un fait — elle se périmerait au premier `create table` et l'étape resterait
      # verte sur une table neuve non protégée. On relève donc ce que `supabase/` DÉCLARE, et on le
      # confronte à ce que la base a RETENU.
      - name: Tables that claim row-level security actually have it, and nothing opens them
        run: |
          grep -rhoE 'alter table (public\.)?[a-z_]+[[:space:]]+enable row level security' \
            supabase/init.sql supabase/migrations/*.sql \
            | sed -E 's/alter table (public\.)?//; s/[[:space:]]+enable row level security//' \
            | sort -u > /tmp/rls-declarees.txt
          test -s /tmp/rls-declarees.txt || { echo "::error::aucune table ne déclare la RLS dans supabase/ — la sonde vise à côté"; exit 1; }
          echo "déclarées dans les sources : $(wc -l < /tmp/rls-declarees.txt) table(s)"

          $PSQL -c "select c.relname from pg_class c join pg_namespace n on n.oid = c.relnamespace
                    where n.nspname = 'public' and c.relkind = 'r' and c.relrowsecurity
                    order by 1;" > /tmp/rls-actives.txt
          manque=0
          while read -r t; do
            grep -qxF "$t" /tmp/rls-actives.txt \
              || { echo "::error::$t déclare « enable row level security » et la base ne l'a pas retenue — la posture est écrite, pas tenue"; manque=1; }
          done < /tmp/rls-declarees.txt

          # ⚠️ LE CONTRÔLE POSITIF, ET C'EST LUI QUI FAIT LA VALEUR DE L'ÉTAPE. « Aucune politique »
          # est un constat d'ABSENCE : il est maximalement confondable avec une sonde qui vise à
          # côté — un nom de vue erroné, un schéma mal filtré, et le zéro arrive tout seul. On pose
          # donc une politique dont on sait qu'elle existe, on vérifie que la sonde la VOIT, et on
          # l'enlève. Sans ce détour, le zéro qui suit ne prouverait rien.
          $PSQL -c "create table public.__rls_temoin (id int);
                    alter table public.__rls_temoin enable row level security;
                    create policy __temoin on public.__rls_temoin for select using (true);"
          vues=$($PSQL -c "select count(*) from pg_policies where schemaname = 'public' and tablename = '__rls_temoin';")
          $PSQL -c "drop table public.__rls_temoin;"
          [ "$vues" = "1" ] || { echo "::error::la sonde n'a pas vu une politique qu'on venait de poser — elle vise à côté, et son « zéro » ne prouve rien"; exit 1; }

          # ⚠️ AUCUNE POLITIQUE, ET C'EST LA POSTURE ÉCRITE PARTOUT DANS `supabase/` : sous RLS,
          # l'absence de politique REFUSE tout, et seul un rôle en `bypassrls` (`service_role`)
          # passe. Une politique ajoutée « pour débloquer un cas » retirerait cette protection sans
          # qu'aucune autre ne soit dessous — c'est précisément ce que l'hôte a signalé.
          ouvertes=$($PSQL -c "select tablename || ' ← ' || policyname from pg_policies where schemaname = 'public' order by 1;")
          if [ -n "$ouvertes" ]; then
            echo "::error::une politique ouvre une table que supabase/ dit fermée : $ouvertes"
            manque=1
          fi

          [ "$manque" = "0" ] || exit 1
          echo "$(wc -l < /tmp/rls-declarees.txt) table(s) déclarent la RLS, la base les confirme, aucune politique ne les ouvre"

      # ─────────────────────────────────────────────────────────────────────────────────────────
      # ⚠️ TROIS ÉCRITURES DE LA MÊME REQUÊTE, TROIS ANGLES MORTS, AUCUN TROUVÉ PAR SON AUTEUR
      # (28/08). Ce dépôt donne aux hôtes une requête pour vérifier qu'un `revoke select … from
      # anon, authenticated` ne tuera aucune politique. Elle a été écrite trois fois : la nôtre
      # filtrait `like '%anon%'` — un rôle sur les deux du geste ; celle qu'un hôte a proposée pour
      # la corriger n'inspectait qu'UN rôle par politique. Chacune a été trouvée fautive par
      # l'autre, jamais par son auteur, et chacune rendait un ZÉRO RASSURANT sur une base exposée.
      #
      # ⚠️ ET LA RAISON POUR LAQUELLE C'EST UN BANC ET NON UNE RELECTURE DE PLUS. Le second hôte a
      # rejoué la requête retenue chez lui : 26 politiques, et ZÉRO nommant les deux rôles. Sa
      # propre écriture y aurait donc rendu le bon résultat — « pour une raison qui n'a rien à voir
      # avec sa justesse ». Valider une sonde sur la base qu'on a sous la main, c'est la valider
      # sur un profil parmi trois. On CONSTRUIT donc les trois, au lieu de prendre celui qui existe.
      #
      # ⚠️ ET C'EST LA REQUÊTE DOCUMENTÉE QUI EST EXÉCUTÉE, PAS UNE COPIE. Elle est extraite du bloc
      # « Accès » d'`init.sql` entre deux marques. Une copie diverge — et le jour où elle diverge,
      # le banc reste vert sur un texte que personne n'applique pendant que les hôtes appliquent
      # celui du fichier. Même défaut que « un compte d'un instrument, un verdict d'un autre ».
      # ─────────────────────────────────────────────────────────────────────────────────────────
      # ⚠️ CE QUE CE BANC FAIT VARIER, ET CE QU'IL TIENT FIXE — parce qu'un axe exhaustif SE LIT
      # comme une couverture, et d'autant mieux que l'énumération est complète. Les deux défauts qui
      # ont mordu ici ne venaient PAS d'une cinquième valeur de `roles` : l'un venait de l'écart
      # entre les rôles du geste et ceux de la politique, l'autre de l'inventaire de rôles du
      # CLUSTER — qui n'est la propriété d'aucune politique. C'est un hôte qui l'a nommé.
      #
      #   VARIE   la valeur de `pg_policies.roles` : {authenticated}, {anon,authenticated}, {anon},
      #           {public} — les quatre formes possibles, `TO public, anon` retombant sur {public}
      #   VARIE   quel rôle perd le droit (cinq scénarios : un par profil, deux pour {public})
      #   VARIE   la présence des rôles `anon`/`authenticated` dans le cluster (contrôle en tête)
      #
      #   FIXE    une seule version majeure de Postgres — celle de l'image épinglée
      #   FIXE    un seul privilège : SELECT
      #   FIXE    des politiques PERMISSIVES ; aucune restrictive
      #   FIXE    aucune hiérarchie de rôles (`grant role to role`) n'est exercée ici
      #   FIXE    une politique nommant un rôle TIERS à côté d'`anon` (`{anon,svc}`) — mesurée à la
      #           main le 29/08 et correctement traitée, mais ce banc ne la rejoue pas
      #
      # Les lignes FIXE sont l'endroit d'où viendra le prochain signalement. Les écrire n'est pas une
      # clause de style : c'est ce qui empêche un lecteur de prendre une ligne pleine pour un tableau
      # plein.
      - name: The diagnostic query init.sql hands to hosts names the dead policy and the dead role, on four policy profiles
        run: |
          node tools/requete-diagnostic.mjs > /tmp/requete-retenue.sql
          echo "── la requête telle que l'hôte la lit dans init.sql, et telle qu'elle va être exécutée ──"
          sed 's/^/    /' /tmp/requete-retenue.sql

          # ⚠️ AVANT DE CRÉER QUOI QUE CE SOIT : LA REQUÊTE NE DOIT PAS ÉCHOUER LÀ OÙ `anon` N'EXISTE PAS.
          # Tout ce qui n'est pas Supabase est dans ce cas, et `has_table_privilege('anon', …)` n'y rend pas
          # faux — il LÈVE. La base de la forge n'a pas encore ces rôles à cet instant : c'est le seul
          # moment où ce contrôle est possible, et il est donc placé ici plutôt qu'à la fin.
          $PSQL <<'SQL'
          create table public.banc_pol_public (id int);
          alter table public.banc_pol_public enable row level security;
          create policy p on public.banc_pol_public for select using (true);  -- sans clause TO → {public}
          SQL
          # ⚠️ ET ON VÉRIFIE QUE LE CAS EST BIEN LÀ AVANT D'EN TIRER QUOI QUE CE SOIT : sans politique
          # `{public}`, la requête n'appellerait jamais la fonction et le contrôle ne prouverait rien.
          profil=$($PSQL -c "select roles::text from pg_policies where tablename = 'banc_pol_public';")
          [ "$profil" = "{public}" ] || { echo "::error::le contrôle « rôles absents » est vide : la politique sans clause TO devrait porter {public}, elle porte « $profil »"; exit 1; }
          $PSQL -c "select count(*) from pg_roles where rolname in ('anon','authenticated');" | grep -qx 0 \
            || { echo "::error::le contrôle « rôles absents » est vide : la base porte déjà anon/authenticated à cet instant"; exit 1; }
          sortie=$($PSQL -f /tmp/requete-retenue.sql 2>&1) \
            || { echo "::error::sur une installation SANS les rôles anon/authenticated, la requête documentée ÉCHOUE au lieu de rendre zéro ligne — un hôte non-Supabase ne peut pas la lancer : $sortie"; exit 1; }
          [ -z "$(printf '%s' "$sortie" | tr -d ' \n')" ] || { echo "::error::sans les rôles anon/authenticated, la requête devrait ne rien rendre ; elle rend « $sortie »"; exit 1; }

          # ⚠️ LES DEUX ÉCRITURES ÉCARTÉES SONT ICI EN TOUTES LETTRES, ET C'EST DÉLIBÉRÉ. Le banc ne vaut pas
          # parce que la requête retenue passe : il vaut parce qu'il DISTINGUE. Sans elles, une régression vers
          # l'une ou l'autre repasserait au vert sur le profil que ce dépôt a sous la main.
          cat > /tmp/requete-v1-etroite.sql <<'SQL'
          select tablename from pg_policies where schemaname = 'public' and roles::text like '%anon%' order by 1;
          SQL
          cat > /tmp/requete-v2-un-role.sql <<'SQL'
          select p.tablename
            from pg_policies p
            join pg_class c on c.relname = p.tablename
            join pg_namespace n on n.oid = c.relnamespace and n.nspname = p.schemaname
           where p.schemaname = 'public'
             and not has_table_privilege(
                   case when p.roles::text like '%anon%' then 'anon' else 'authenticated' end, c.oid, 'SELECT')
           order by 1;
          SQL

          # ⚠️ LA TROISIÈME ÉCRITURE ÉCARTÉE, PROPOSÉE PAR L'HÔTE QUI A TROUVÉ LE PROFIL `{public}` — et
          # qui annonçait lui-même son angle mort. Elle traite `public` en testant UN représentant (`anon`),
          # donc elle se tait là où seul `authenticated` est privé. Elle nomme aussi `public` comme rôle, ce
          # qui laisse l'hôte sans savoir QUEL droit rendre.
          cat > /tmp/requete-v4-un-representant.sql <<'SQL'
          select p.tablename, r.role from pg_policies p
            cross join lateral unnest(p.roles) as r(role)
            join pg_class c on c.relname = p.tablename
            join pg_namespace n on n.oid = c.relnamespace and n.nspname = p.schemaname
           where (r.role::text in ('anon','authenticated') or r.role::text = 'public')
             and not has_table_privilege(
                   case when r.role::text = 'public' then 'anon' else r.role::text end, c.oid, 'SELECT');
          SQL

          # Les trois profils de politique. Le troisième — celui qui nomme LES DEUX rôles — est le seul que la
          # base d'un hôte peut parfaitement ne jamais contenir : c'est pour ça qu'on le CONSTRUIT au lieu de
          # le chercher. Un hôte a mesuré 26 politiques chez lui, dont zéro nommant les deux.
          $PSQL <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create table public.banc_pol_authenticated (id int);
          create table public.banc_pol_deux          (id int);
          create table public.banc_pol_anon          (id int);
          grant select on public.banc_pol_authenticated, public.banc_pol_deux, public.banc_pol_anon
            to anon, authenticated;
          alter table public.banc_pol_authenticated enable row level security;
          alter table public.banc_pol_deux          enable row level security;
          alter table public.banc_pol_anon          enable row level security;
          create policy p on public.banc_pol_authenticated for select to authenticated       using (true);
          create policy p on public.banc_pol_deux          for select to anon, authenticated using (true);
          create policy p on public.banc_pol_anon          for select to anon                using (true);
          -- Le quatrième profil est DÉJÀ posé plus haut (`banc_pol_public`, sans clause TO) : il a servi au
          -- contrôle « rôles absents ». On lui donne maintenant les mêmes droits de départ que les autres.
          grant select on public.banc_pol_public to anon, authenticated;
          SQL

          echoue=0
          constat() { echo "::error::$1"; echoue=1; }
          sonde()   { $PSQL -f "$1" | tr -d ' ' | sed '/^$/d' | sort; }

          # ⚠️ ON GARDE LA CLASSE, PAS LA MISE EN PAGE : « la requête nomme la table morte ET le rôle mort »,
          # quel que soit l'ordre ou le nombre de ses colonnes. Épingler `public|table|p|role` ferait rougir un
          # changement de colonnes légitime comme s'il s'agissait d'un défaut de logique — et apprendrait à
          # lire ce rouge comme du bruit. La comparaison porte sur des CHAMPS ENTIERS : `authenticated` est un
          # sous-mot de `banc_pol_authenticated`, et un `grep` naïf confondrait le rôle avec la table.
          champ() { printf '%s\n' "$1" | tr '|' '\n' | grep -qxF "$2"; }
          nomme() {
            scenario="$1"; sortie="$2"; table="$3"; role="$4"
            lignes=$(printf '%s\n' "$sortie" | sed '/^$/d' | wc -l)
            [ "$lignes" = "1" ] || constat "$scenario : une seule politique est morte, la requête retenue rend $lignes ligne(s) — « $sortie »"
            champ "$sortie" "$table" || constat "$scenario : la requête retenue ne nomme pas la table morte ($table) — « $sortie »"
            champ "$sortie" "$role"  || constat "$scenario : la requête retenue ne nomme pas le rôle mort ($role) — sans lui l'hôte sait où regarder mais pas quoi rendre — « $sortie »"
          }

          # ⚠️ AUCUN FILTRE SUR NOS TABLES, ET C'EST UNE VÉRIFICATION DE PLUS. L'étape précédente vient
          # d'exiger ZÉRO politique dans `public` : la sortie de la requête est donc exactement ce que ce banc
          # a construit, ou bien quelque chose a changé ailleurs et le banc doit le dire. Elle est ainsi
          # exécutée VERBATIM — pas enveloppée dans une sous-requête qui ne serait plus l'artefact documenté.
          sain=$(sonde /tmp/requete-retenue.sql)
          [ -z "$sain" ] || constat "état sain : la requête retenue signale « $sain » alors qu'aucune politique n'est privée de son droit — faux positif"
          v1_sain=$(sonde /tmp/requete-v1-etroite.sql)

          echo "── scénario A — politique {authenticated} seule, droit retiré à authenticated ──"
          $PSQL -c "revoke select on public.banc_pol_authenticated from authenticated;"
          a3=$(sonde /tmp/requete-retenue.sql); a2=$(sonde /tmp/requete-v2-un-role.sql); a1=$(sonde /tmp/requete-v1-etroite.sql)
          echo "    retenue=[$(echo $a3)]  v2=[$(echo $a2)]  v1=[$(echo $a1)]"
          nomme "scénario A" "$a3" "banc_pol_authenticated" "authenticated"
          case "$a1" in *banc_pol_authenticated*) constat "scénario A : v1 ne devrait PAS voir la table cassée — le banc ne distingue plus rien" ;; esac
          [ "$a1" = "$v1_sain" ] || constat "scénario A : v1 devrait rendre la MÊME chose qu'à l'état sain — c'est ce qui prouve qu'elle ne mesure pas l'état"
          case "$a2" in *banc_pol_deux*) constat "scénario A : v2 signale une table saine" ;; esac
          $PSQL -c "grant select on public.banc_pol_authenticated to authenticated;"

          echo "── scénario B — politique {anon,authenticated}, droit retiré à authenticated seul ──"
          $PSQL -c "revoke select on public.banc_pol_deux from authenticated;"
          b3=$(sonde /tmp/requete-retenue.sql); b2=$(sonde /tmp/requete-v2-un-role.sql)
          echo "    retenue=[$(echo $b3)]  v2=[$(echo $b2)]"
          nomme "scénario B" "$b3" "banc_pol_deux" "authenticated"
          case "$b2" in *banc_pol_deux*) constat "scénario B : v2 voit la table cassée — or elle n'inspecte qu'un rôle par politique et devrait la manquer ; le banc ne distingue plus les deux écritures" ;; esac
          $PSQL -c "grant select on public.banc_pol_deux to authenticated;"

          echo "── scénario C — politique {anon} seule, droit retiré à anon ──"
          $PSQL -c "revoke select on public.banc_pol_anon from anon;"
          c3=$(sonde /tmp/requete-retenue.sql)
          echo "    retenue=[$(echo $c3)]"
          nomme "scénario C" "$c3" "banc_pol_anon" "anon"
          $PSQL -c "grant select on public.banc_pol_anon to anon;"

          echo "── scénario D — politique {public} (sans clause TO), droit retiré à anon ──"
          $PSQL -c "revoke select on public.banc_pol_public from anon;"
          d3=$(sonde /tmp/requete-retenue.sql); d4=$(sonde /tmp/requete-v4-un-representant.sql); d1=$(sonde /tmp/requete-v1-etroite.sql)
          echo "    retenue=[$(echo $d3)]  v4=[$(echo $d4)]  v1=[$(echo $d1)]"
          nomme "scénario D" "$d3" "banc_pol_public" "anon"
          case "$d1" in *banc_pol_public*) constat "scénario D : v1 ne devrait PAS voir la table cassée — une politique {public} ne nomme jamais anon" ;; esac
          $PSQL -c "grant select on public.banc_pol_public to anon;"

          echo "── scénario E — politique {public}, droit retiré à authenticated SEUL ──"
          $PSQL -c "revoke select on public.banc_pol_public from authenticated;"
          e3=$(sonde /tmp/requete-retenue.sql); e4=$(sonde /tmp/requete-v4-un-representant.sql)
          echo "    retenue=[$(echo $e3)]  v4=[$(echo $e4)]"
          nomme "scénario E" "$e3" "banc_pol_public" "authenticated"
          case "$e4" in *banc_pol_public*) constat "scénario E : v4 voit la table cassée — or elle ne teste qu'UN représentant de public et devrait la manquer ; le banc ne distingue plus les deux écritures" ;; esac
          $PSQL -c "grant select on public.banc_pol_public to authenticated;"

          $PSQL <<'SQL'
          drop table public.banc_pol_authenticated, public.banc_pol_deux, public.banc_pol_anon,
                     public.banc_pol_public;
          drop role anon, authenticated;
          SQL

          [ "$echoue" = "0" ] || exit 1
          echo "la requête d'init.sql nomme la table morte et le rôle mort dans les quatre profils ; v1, v2 et v4 en manquent chacune un"

      # ─────────────────────────────────────────────────────────────────────────────────────────
      # ⚠️ LE DOUBLE POSTGREST EN MÉMOIRE DIT LUI-MÊME CE QU'IL NE SAIT PAS FAIRE : « pas de
      # contraintes, pas de transactions… PAS un substitut pour vérifier ce qui relève du SGBD ».
      # Or l'idempotence des messages tient à une contrainte d'unicité, l'ordre des écritures de
      # pilotage à l'atomicité d'un PATCH conditionnel, et la sonde de schéma au fait que PostgREST
      # rejette le POST ENTIER sur une colonne inconnue. Trois propriétés DÉDUITES de la
      # documentation, jamais constatées. Elles le sont ici, devant un vrai PostgREST.
      # ─────────────────────────────────────────────────────────────────────────────────────────
      - name: Roles PostgREST needs
        run: |
          $PSQL <<'SQL'
          -- `authenticator` se connecte et ne peut rien ; il ENDOSSE le rôle porté par le jeton.
          -- C'est le montage standard de PostgREST, et celui de Supabase.
          create role authenticator noinherit login password 'player';
          -- `bypassrls` reproduit ce que fait `service_role` : le player n'est jamais appelé depuis
          -- un navigateur, il décide lui-même de ce qu'il sert. Sans ça, RLS sans politique bloque
          -- tout et le banc mesurerait un refus de la base, pas le comportement du player.
          create role player_test nologin bypassrls;
          grant player_test to authenticator;
          grant usage on schema public to player_test;
          grant all on all tables in schema public to player_test;
          grant all on all sequences in schema public to player_test;
          grant execute on all functions in schema public to player_test;
          SQL

      - name: A real PostgREST, in front of a real Postgres
        env:
          # Valeur de banc, pas un identifiant : elle n'ouvre qu'un Postgres jetable créé six
          # étapes plus haut et détruit avec le conteneur. PostgREST exige 32 caractères en HS256.
          JWT: banc-vraie-base-secret-de-quarante-deux-caracteres
          # ⚠️ L'IMAGE EST DÉCLARÉE, PAS ÉCRITE DANS LA COMMANDE — et c'est ce qui la rend
          # vérifiable. Une référence noyée dans un bloc `run:` vit dans du SHELL : aucune sonde ne
          # peut dire « ceci est une image » sans réécrire la grammaire de `docker run`, et un
          # premier essai a accusé `host` (de `--network host`) et deux images construites sur
          # place. Hissée en `env:`, elle est du YAML — lue, pas devinée. Le préfixe `IMAGE_` n'est
          # pas décoratif : c'est lui que `tools/images-des-workflows.mjs` cherche.
          IMAGE_POSTGREST: postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
        run: |
          echo "PLAYER_TEST_JWT_SECRET=$JWT" >> "$GITHUB_ENV"
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI="postgres://authenticator:player@localhost:5432/player" \
            -e PGRST_DB_ANON_ROLE=player_test \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_JWT_SECRET="$JWT" \
            -e PGRST_SERVER_PORT=3001 \
            "$IMAGE_POSTGREST"
          for i in $(seq 1 40); do curl -fsS localhost:3001/ >/dev/null 2>&1 && break || sleep 1; done
          curl -fsS localhost:3001/ >/dev/null || { echo "::error::PostgREST n'a pas démarré"; docker logs postgrest; exit 1; }
          # Supabase sert PostgREST sous /rest/v1 ; un PostgREST nu le sert à la racine. Ce renvoi
          # ne touche QUE le chemin — statut, en-têtes et corps passent tels quels.
          # `setsid` + `nohup` : un simple `&` peut mourir avec le shell de l'étape, et l'étape
          # suivante n'aurait plus de renvoi — sans que rien ne dise pourquoi.
          setsid nohup node tools/prefixe-rest.cjs > /tmp/renvoi.log 2>&1 < /dev/null &
          for i in $(seq 1 20); do curl -fsS "localhost:3002/rest/v1/doc_presentations?limit=1" >/dev/null 2>&1 && break || sleep 1; done
          curl -fsS "localhost:3002/rest/v1/doc_presentations?limit=1" >/dev/null || { echo "::error::le renvoi /rest/v1 ne répond pas"; exit 1; }

      # ⚠️ Le banc REFUSE de s'esquiver quand `CI` est posé : si PostgREST ne démarrait pas, une
      # esquive silencieuse rendrait cette étape verte sans que rien n'ait été éprouvé.
      - name: What the in-memory double cannot simulate — against a real Postgres
        env:
          PLAYER_TEST_POSTGREST_URL: http://127.0.0.1:3002
        run: npm run test:base

      # ⚠️ LA CAMPAGNE DE CHARGE : elle AFFIRME ce qui est déterministe et RAPPORTE le reste.
      #
      # Un audit demandait des percentiles ; ce dépôt les avait refusés parce qu'un seuil de latence
      # rougit au hasard et finit desserré. Les deux avaient été confondus : refuser LE SEUIL
      # n'oblige pas à refuser LA MESURE. Ce banc affirme donc l'absence de 5xx, la cohérence des
      # réponses, la linéarité du coût et la non-croissance mémoire — et il IMPRIME p50/p95/p99 sans
      # jamais les comparer à quoi que ce soit. Le relevé est son produit, comme pour le banc
      # structurel : c'est là qu'on verra une dérive avant qu'un utilisateur ne la sente.
      #
      # Il a sa PROPRE configuration : un filtre par chemin n'avait pas pris et l'étape refaisait
      # tourner TOUT le banc base/ — dont une graine non idempotente, qui a échoué sur une clé
      # dupliquée. Un `include` explicite ne se laisse pas contourner et dit ce qu'il couvre.
      - name: The load campaign against a real database
        env:
          PLAYER_TEST_POSTGREST_URL: http://127.0.0.1:3002
          # ⚠️ MILLE, ET C'EST UNE MESURE PLUTÔT QU'UNE AMBITION. « 1 000 spectateurs » figurait
          # depuis des semaines dans le « non mesuré » de l'audit, à côté de « base ralentie » et
          # « multi-processus » — trois postes rangés ensemble parce qu'ils se ressemblaient. Le
          # second s'est révélé être une ligne de code ; celui-ci est une VARIABLE. Seul le
          # troisième avait la difficulté qu'on leur prêtait à toutes.
          #
          # Ce que le passage de 250 à 1 000 éprouve vraiment, ce n'est pas le débit : c'est que
          # mille lecteurs simultanés reçoivent le MÊME état. La fenêtre pendant laquelle le cache
          # peut basculer s'allonge avec la concurrence, et c'est la seule assertion de ce banc que
          # le volume peut casser sans qu'aucun code ne soit fautif.
          PLAYER_CHARGE_SPECTATEURS: "1000"
        run: npm run test:campagne

      # ── L'ENDURANCE : CE QU'UNE RAFALE NE PEUT PAS MONTRER ────────────────────────────────────
      # ⚠️ COURT ICI, ET C'EST LE POINT. Tous les bancs de charge de ce dépôt sont INSTANTANÉS : N
      # appels lancés ensemble, un relevé, fini. Une mémoire qui monte lentement, un cache qui ne
      # sature qu'après plusieurs minutes, une boucle qui décroche quand les gestes se MÉLANGENT ne
      # se voient pas en trois secondes. Vingt-cinq secondes à chaque course prouvent que le
      # scénario tient debout ; la vraie campagne se lance à la main avec
      # `PLAYER_ENDURANCE_SECONDES=1800`.
      #
      # ⚠️ Un banc qui ne tournerait qu'à la main serait un banc MORT — ce dépôt a laissé une garde
      # de publication morte dix-neuf heures sans que personne le voie. Il tourne donc à chaque
      # course, court, plutôt que longuement et jamais.
      # ── DEUX TEXTES POUR LE MÊME CALCUL, CONFRONTÉS SUR LES MÊMES LIGNES ─────────────────────
      # ⚠️ La migration 0022 déplace l'agrégation analytique en base ; le JavaScript reste, parce
      # qu'un hôte n'applique pas forcément la dernière migration. Deux définitions du même fait
      # divergent tant que personne ne les confronte — la même règle que `init.sql` et ses
      # migrations, que `docs/API.md` et le code, que la purge de rétention et son recensement.
      # Ce banc n'affirme pas que les chiffres sont BONS : il exige qu'ils soient LES MÊMES, ce qui
      # est plus fort — une erreur ne passe que si elle est commise deux fois, séparément.
      - name: Aggregated statistics — SQL and JavaScript must agree exactly
        env:
          PLAYER_TEST_POSTGREST_URL: http://127.0.0.1:3002
        run: npm run test:stats

      - name: Endurance — the mixed scenario, over time
        env:
          # Le même renvoi /rest/v1 que les deux étapes précédentes (3002, pas le PostgREST nu de
          # 3001) ; `PLAYER_TEST_JWT_SECRET` est déjà dans $GITHUB_ENV depuis le démarrage.
          PLAYER_TEST_POSTGREST_URL: http://127.0.0.1:3002
          PLAYER_ENDURANCE_SECONDES: "25"
        run: npm run test:endurance

      # ⚠️ LE BANC DE CHARGE COMPTE, IL NE CHRONOMÈTRE PAS — il tourne donc ici, sans base ni service :
      # ce qu'il mesure (le nombre d'allers-retours qu'un geste coûte) est déterministe. Sa SORTIE est
      # son produit : le relevé s'affiche dans le journal de la forge, et c'est là qu'on verra un geste
      # passer de 3 à 4 avant que quiconque ne s'en plaigne en production.
      - name: What each gesture costs the database
        run: npm run test:charge

      # ── AUCUNE MESURE SANS BORNE EN BASE — LA CLASSE, PAS LE CAS ─────────────────────────────
      # ⚠️ LA 0020 A BORNÉ DEUX TABLES SUR TROIS, ET RIEN NE L'A DIT. `commercial_doc_views` et
      # `commercial_doc_sessions` ont reçu leurs contraintes le 25/08, après qu'un visiteur eut
      # posté `page: 2147483647` ; `commercial_doc_internal_sessions` porte exactement les mêmes
      # colonnes, écrites par le même code borné, et n'avait rien reçu. Une absence ne s'écrit nulle
      # part : il a fallu un audit externe pour la voir, un jour plus tard.
      #
      # Cette sonde ne garde donc pas la troisième table — elle garde la RÈGLE : toute colonne de
      # mesure, dans n'importe quelle table, porte une contrainte VALIDÉE. Une quatrième table
      # ajoutée demain avec un `max_page` rougira jusqu'à ce qu'elle soit bornée, et personne
      # n'aura à s'en souvenir.
      #
      # `convalidated` et pas seulement l'existence : une contrainte posée `not valid` et jamais
      # validée protège les écritures nouvelles et laisse passer l'historique — c'est un état
      # intermédiaire légitime PENDANT une migration, jamais un état d'arrivée.
      #
      # ⚠️ CE QUE CETTE SONDE NE REGARDE PAS, DIT PLUTÔT QUE SOUS-ENTENDU. Elle surveille les cinq
      # noms de colonnes que RAPPORTE UN VISITEUR (`page`, `max_page`, `num_pages`, `seconds`,
      # `total_seconds`) — la classe exacte du défaut de la 0020. Elle ne surveille PAS
      # `current_page` (deux tables), qui est écrite par le présentateur et qu'aucune agrégation ne
      # parcourt : elle n'est pas bornée en base aujourd'hui, et c'est une décision consignée ici,
      # pas un oubli. Le jour où une agrégation la lit, elle rejoint la liste.
      - name: No measurement column without a validated bound
        run: |
          nues=$($PSQL <<'SQL'
          select c.relname || '.' || a.attname
            from pg_attribute a
            join pg_class c on c.oid = a.attrelid
            join pg_namespace n on n.oid = c.relnamespace
           where n.nspname = 'public' and c.relkind = 'r'
             and a.attnum > 0 and not a.attisdropped
             and a.attname in ('page', 'max_page', 'num_pages', 'seconds', 'total_seconds')
             and not exists (
               select 1 from pg_constraint k
                where k.conrelid = c.oid and k.contype = 'c' and k.convalidated
                  and a.attnum = any (k.conkey))
           order by 1;
          SQL
          )
          # ⚠️ ANTI-VACUITÉ : si la requête ne voyait plus AUCUNE colonne de mesure, elle rendrait
          # zéro coupable et la garde se féliciterait sur une base vide. On exige d'abord qu'elle
          # en trouve — c'est la sonde qu'on vérifie, avant ce qu'elle affirme.
          vues=$($PSQL -c "select count(*) from pg_attribute a join pg_class c on c.oid = a.attrelid join pg_namespace n on n.oid = c.relnamespace where n.nspname='public' and c.relkind='r' and a.attnum>0 and not a.attisdropped and a.attname in ('page','max_page','num_pages','seconds','total_seconds')")
          [ "$vues" -ge 6 ] || { echo "::error::la sonde ne voit que $vues colonne(s) de mesure — elle ne regarde plus au bon endroit"; exit 1; }
          echo "colonnes de mesure examinées : $vues"
          [ -z "$nues" ] || { echo "::error::colonne(s) de mesure sans contrainte VALIDÉE : $(echo "$nues" | tr '\n' ' ')"; exit 1; }
          echo "toute colonne de mesure porte une borne validée"

      # ── LE CHEMIN DE RÉPARATION D'UNE MIGRATION N'EST JAMAIS JOUÉ ICI — SAUF SI ON L'EXIGE ─────
      # ⚠️ UN ANGLE MORT PAR CONSTRUCTION, ET IL A CACHÉ UNE MIGRATION CASSÉE PENDANT UN JOUR.
      # L'étape « Replaying every migration changes nothing » exige que `init.sql` porte déjà tout
      # ce que les migrations apportent. C'est une bonne propriété, et elle a un prix qui n'était
      # écrit nulle part : les migrations tournent alors TOUJOURS sur une base propre, où leurs
      # `update` de rabattement ne touchent aucune ligne. Le seul code qu'un hôte à l'historique
      # chargé exécutera vraiment est exactement celui que la forge n'exécutait jamais.
      #
      # ⚠️ CE QUE ÇA A LAISSÉ PASSER, reproduit le 26/08 contre un vrai PostgreSQL 16. Une contrainte
      # `not valid` ne contrôle pas l'historique, mais elle contrôle TOUTE LIGNE RÉÉCRITE. Les 0020
      # et 0023 posaient toutes leurs contraintes, PUIS rabattaient colonne par colonne : réparer
      # `page` réécrivait une ligne dont `max_page` était encore hors plage, et la contrainte posée
      # dix lignes plus haut refusait. La 0020 échouait donc sur la ligne MÊME de l'incident du
      # 25/08 — `pageLue` déduit `max_page` de `page`, les deux valaient 2147483647 — et laissait la
      # base à moitié migrée : bornes posées, jamais validées, historique intact.
      #
      # ⚠️ CETTE SONDE GARDE LA CLASSE, PAS LES TROIS TABLES D'AUJOURD'HUI. Elle retire toutes les
      # contraintes `ck_%_borne`, sème dans CHAQUE table de mesure une ligne dont toutes les
      # colonnes sont hors plage et une seconde dont une seule l'est (les autres NULLES), rejoue la
      # chaîne entière, puis exige quatre choses : qu'aucune migration n'échoue, qu'il ne reste
      # aucune valeur hors plage, que les bornes finissent VALIDÉES, et que les cellules NULLES
      # soient encore nulles. Cette dernière n'est pas décorative : `greatest(null, 0)` vaut `0` en
      # PostgreSQL, donc une écriture groupée sans garde transforme une mesure INCONNUE en zéro
      # mesuré — silencieusement, et avec un code de sortie vert.
      #
      # Éprouvée par mutation : les deux migrations d'avant rougissent, le retrait du `case` rougit
      # sur le compte des nulles.
      - name: A poisoned base is repaired by its migrations, not stopped by them
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -qtA -c "create database empoisonnee"
          POI="psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d empoisonnee -qtA"
          $POI -f supabase/init.sql > /dev/null

          # La même liste de colonnes que la sonde ci-dessus, et pour la même raison : ce qu'un
          # visiteur RAPPORTE. Une quatrième table portant un `max_page` sera empoisonnée sans que
          # personne ait à s'en souvenir. Elle est injectée par substitution plutôt que par
          # expansion : les corps SQL ci-dessous contiennent des `$$` et des antislashs qu'un
          # heredoc non protégé mangerait.
          MESURES="'page', 'max_page', 'num_pages', 'seconds', 'total_seconds'"

          cat > /tmp/poison.sql <<'SQL'
          do $$
          declare k record;
          begin
            for k in select c.relname as tab, con.conname as nom from pg_constraint con
                       join pg_class c on c.oid = con.conrelid
                       join pg_namespace n on n.oid = c.relnamespace
                      where n.nspname='public' and con.contype='c' and con.conname like 'ck\_%\_borne'
            loop execute format('alter table public.%I drop constraint %I', k.tab, k.nom); end loop;
          end $$;

          do $$
          declare t record; cols text; valsa text; valsb text; mes text;
          begin
            for t in select c.oid as reloid, c.relname as tab, array_agg(a.attname order by a.attnum) as mesures
                       from pg_class c join pg_namespace n on n.oid = c.relnamespace
                       join pg_attribute a on a.attrelid = c.oid
                      where n.nspname='public' and c.relkind='r' and a.attnum>0 and not a.attisdropped
                        and a.attname in (@MESURES@)
                      group by c.oid, c.relname
            loop
              -- Les colonnes NOT NULL sans défaut reçoivent une valeur synthétique typée : la
              -- graine ne connaît aucune table par son nom, elle les découvre.
              select string_agg(quote_ident(a.attname), ', ' order by a.attnum),
                     string_agg(case when format_type(a.atttypid,null) like 'timestamp%' then 'now()'
                                     when format_type(a.atttypid,null) in ('integer','bigint','smallint') then '0'
                                     when format_type(a.atttypid,null)='jsonb' then '''{}''::jsonb'
                                     when format_type(a.atttypid,null)='boolean' then 'false'
                                     else quote_literal('poison-a-'||a.attname) end, ', ' order by a.attnum),
                     string_agg(case when format_type(a.atttypid,null) like 'timestamp%' then 'now()'
                                     when format_type(a.atttypid,null) in ('integer','bigint','smallint') then '0'
                                     when format_type(a.atttypid,null)='jsonb' then '''{}''::jsonb'
                                     when format_type(a.atttypid,null)='boolean' then 'false'
                                     else quote_literal('poison-b-'||a.attname) end, ', ' order by a.attnum)
                into cols, valsa, valsb
                from pg_attribute a
               where a.attrelid=t.reloid and a.attnum>0 and not a.attisdropped and a.attnotnull
                 and not exists (select 1 from pg_attrdef d where d.adrelid=a.attrelid and d.adnum=a.attnum)
                 and not (a.attname = any (t.mesures));
              select string_agg(quote_ident(m), ', ') into mes from unnest(t.mesures) as m;
              -- Ligne A : TOUTES les colonnes de mesure hors plage — le cas que des `update`
              -- séparés ne savent pas réparer.
              execute format('insert into public.%I (%s, %s) values (%s, %s)', t.tab, cols, mes, valsa,
                (select string_agg('2147483647', ', ') from unnest(t.mesures)));
              -- Ligne B : une seule hors plage, en négatif, les autres NULLES.
              execute format('insert into public.%I (%s, %s) values (%s, %s)', t.tab, cols, mes, valsb,
                (select string_agg(case when i=1 then '-7' else 'null' end, ', ')
                   from unnest(t.mesures) with ordinality as u(m, i)));
            end loop;
          end $$;
          SQL

          # Deux relevés génériques : aucune table n'y est nommée, donc aucun ne rétrécit en
          # silence le jour où le schéma bouge.
          cat > /tmp/nuls.sql <<'SQL'
          select coalesce(sum(((xpath('/row/c/text()', query_to_xml(
                   format('select count(*) as c from public.%I where %I is null', c.relname, a.attname),
                   false, true, '')))[1]::text)::bigint), 0)
            from pg_attribute a join pg_class c on c.oid=a.attrelid
            join pg_namespace n on n.oid=c.relnamespace
           where n.nspname='public' and c.relkind='r' and a.attnum>0 and not a.attisdropped
             and a.attname in (@MESURES@);
          SQL
          cat > /tmp/horsplage.sql <<'SQL'
          select coalesce(sum(((xpath('/row/c/text()', query_to_xml(
                   format('select count(*) as c from public.%I where %I is not null and (%I < 0 or %I > %s)',
                          c.relname, a.attname, a.attname, a.attname,
                          case when a.attname in ('seconds','total_seconds') then 86400 else 10000 end),
                   false, true, '')))[1]::text)::bigint), 0)
            from pg_attribute a join pg_class c on c.oid=a.attrelid
            join pg_namespace n on n.oid=c.relnamespace
           where n.nspname='public' and c.relkind='r' and a.attnum>0 and not a.attisdropped
             and a.attname in (@MESURES@);
          SQL
          sed -i "s/@MESURES@/$MESURES/g" /tmp/poison.sql /tmp/nuls.sql /tmp/horsplage.sql
          $POI -f /tmp/poison.sql > /dev/null

          # ⚠️ ANTI-VACUITÉ, DEUX FOIS : une graine qui ne sème rien rend une base saine, et une
          # base saine se lit exactement comme une base réparée.
          tables=$($POI -c "select count(distinct c.relname) from pg_attribute a join pg_class c on c.oid=a.attrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and a.attnum>0 and not a.attisdropped and a.attname in ($MESURES)")
          [ "$tables" -ge 3 ] || { echo "::error::seulement $tables table(s) de mesure — la graine ne regarde plus au bon endroit"; exit 1; }
          hors_avant=$($POI -f /tmp/horsplage.sql)
          nuls_avant=$($POI -f /tmp/nuls.sql)
          [ "$hors_avant" -ge 12 ] || { echo "::error::la graine n'a semé que $hors_avant valeur(s) hors plage"; exit 1; }
          echo "$tables tables empoisonnées, $hors_avant valeurs hors plage, $nuls_avant cellules nulles à préserver"

          for f in supabase/migrations/*.sql; do
            $POI -f "$f" > /dev/null \
              || { echo "::error::$f échoue sur une base à l'historique hors plage — c'est-à-dire sur la donnée qu'elle vient réparer. Un exploitant ne relance pas une migration qui s'arrête à mi-chemin."; exit 1; }
          done

          hors_apres=$($POI -f /tmp/horsplage.sql)
          [ "$hors_apres" = "0" ] || { echo "::error::$hors_apres valeur(s) encore hors plage après la chaîne complète"; exit 1; }
          nuls_apres=$($POI -f /tmp/nuls.sql)
          [ "$nuls_apres" = "$nuls_avant" ] || { echo "::error::$nuls_avant cellules nulles avant, $nuls_apres après — une mesure INCONNUE a été réécrite en zéro mesuré"; exit 1; }
          nues=$($POI -c "select count(*) from pg_constraint where conname like 'ck\_%\_borne' and not convalidated")
          [ "$nues" = "0" ] || { echo "::error::$nues borne(s) restée(s) NON VALIDÉES : la migration s'est arrêtée entre poser et valider"; exit 1; }
          validees=$($POI -c "select count(*) from pg_constraint where conname like 'ck\_%\_borne' and convalidated")
          [ "$validees" -ge 9 ] || { echo "::error::seulement $validees borne(s) revalidées"; exit 1; }
          echo "base empoisonnée réparée : $hors_avant valeurs rabattues, $nuls_avant nulles préservées, $validees bornes revalidées"

      # ── LA SECONDE MOITIÉ DU CONTRAT DE RÉTENTION : LE RECENSEMENT INDÉPENDANT ───────────────
      # Le banc base vient de semer des lignes vieilles et de lancer la purge. Ce recensement — un
      # SQL nu qui ne partage NI fonction NI filtre avec server/retention.js — recompte ce qui
      # reste dans le périmètre revendiqué par docs/RETENTION.md. Un reste = la purge a menti OU
      # son périmètre ne couvre pas. Deux textes indépendants ne peuvent pas être faux de la même
      # manière ; c'est la propriété, pas un style (design arrêté avec le second hôte, 19/08).
      - name: The independent census finds nothing left in the claimed perimeter
        run: |
          $PSQL -f supabase/recensement-retention.sql > /tmp/recensement.txt
          echo "recensement (périmètre|restantes) :"; cat /tmp/recensement.txt
          restes=$(awk -F'|' '{s+=$2} END {print s+0}' /tmp/recensement.txt)
          [ "$restes" = "0" ] || { echo "::error::le recensement indépendant trouve $restes ligne(s) dans le périmètre revendiqué"; exit 1; }
          lignes=$(grep -c '|' /tmp/recensement.txt | tr -d ' ')
          # ⚠️ LE COMPTE EST ÉCRIT ICI POUR QU'UN PÉRIMÈTRE AJOUTÉ SOIT DÉCLARÉ, PAS DÉCOUVERT. Un
          # recensement qui rétrécit sans qu'on le dise se lit comme un recensement qui trouve zéro.
          # 10 depuis la 0.1.140 : le cache de voix (`doc_tts_objects`) est entré dans le périmètre.
          [ "$lignes" = "10" ] || { echo "::error::le recensement rend $lignes périmètres au lieu de 10 — la sonde s'est déformée"; exit 1; }
          # ⚠️ Fenêtres NON STANDARD (neuvième audit) : les variables psql doivent être câblées —
          # sinon un hôte à durées personnalisées verrait le recensement contrôler une AUTRE
          # politique que sa purge. On l'exécute avec des mois resserrés et on exige 10 lignes
          # valides (le SQL tient sous substitution). `voix_mois` est passé pour la même raison que
          # les trois autres : une variable non câblée retomberait sur son défaut EN SILENCE.
          $PSQL -v journaux_mois=1 -v presentations_mois=1 -v liens_mois=1 -v voix_mois=1 -f supabase/recensement-retention.sql > /tmp/recens-perso.txt
          lignes2=$(grep -c '|' /tmp/recens-perso.txt | tr -d ' ')
          [ "$lignes2" = "10" ] || { echo "::error::recensement à fenêtres personnalisées cassé ($lignes2 lignes)"; cat /tmp/recens-perso.txt; exit 1; }
          echo "recensement paramétrable : OK sous fenêtres non standard"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ⚠️ CE JOB EXÉCUTE DÉSORMAIS DE L'OUTILLAGE DU DÉPÔT, DONC IL L'INSTALLE. Il ne le faisait
      # pas — il ne servait qu'à construire l'image — et la confrontation étiquette↔condensat plus
      # bas s'en tirait parce qu'elle n'utilisait que du Node nu. Depuis que la lecture du
      # Dockerfile passe par un analyseur, ce n'est plus vrai : sans `npm ci`, l'étape échoue en
      # `ERR_MODULE_NOT_FOUND`, ce qui est arrivé à la PR qui a introduit l'analyseur.
      # Une garde qui dépend d'un paquet doit tourner là où ce paquet existe — ou ne pas en dépendre.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "22" }
      - run: npm ci --ignore-scripts
      - run: docker build -t player:ci .
      # Une image qui construit mais ne répond pas n'est pas une image qui marche.
      - name: The image answers
        run: |
          docker run -d --name player-ci -p 3000:3000 player:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz && break || sleep 1; done
          curl -fsS "localhost:3000/api/doc?contract=1" | grep -q '"contract":1'
          docker rm -f player-ci

      # ⚠️ L'ÉTIQUETTE ET LE CONDENSAT SONT DEUX EXEMPLAIRES DU MÊME FAIT, et ce dépôt sait ce que
      # deviennent les exemplaires que rien ne confronte. `node:24-alpine@sha256:…` dont le
      # condensat pointe une image Node 26 est valide pour Docker, se construit, répond, passe tout
      # ce qui précède — et raconte faux à chaque relecteur, y compris à celui qui décidera la
      # montée suivante sur le calendrier LTS. On demande donc à l'image CE QU'ELLE EMBARQUE.
      - name: The tag says what the digest contains
        run: |
          V=$(docker run --rm --entrypoint node player:ci --version)
          echo "l'image répond $V"
          node -e '
            const { readFileSync } = require("node:fs");
            import("./tools/images-epinglees.mjs").then(({ ecartMajeur }) => {
              const souci = ecartMajeur(readFileSync("Dockerfile", "utf8"), process.argv[1]);
              if (souci) { console.error("::error::" + souci); process.exit(1); }
              console.log("étiquette et condensat désignent la même majeure de Node");
            });
          ' "$V"

  # ⚠️ TROISIÈME FOIS QUE LA PUBLICATION EST LE POINT DE RUPTURE.
  #
  #   0.1.15 — publiée SANS son correctif (commit sur une branche dont la PR venait d'être fusionnée) ;
  #   0.1.25 — publiée CASSÉE (script en ligne qui ne se parse pas) ;
  #   0.1.35 — JAMAIS publiée : PR fusionnée, tag oublié. Le code était sur `main`, l'artefact nulle part.
  #
  # Les trois ont été trouvées par un HÔTE, pas ici. Le troisième cas est le plus sournois : rien
  # n'échoue. La CI est verte, la PR est fusionnée, le CHANGELOG annonce la version — et npm sert
  # toujours la précédente. Un état anormal que rien ne dit devient l'état normal.
  #
  # C'est la règle qu'on vient d'écrire pour les gardes muettes du produit (0.1.35), retournée sur
  # notre propre chaîne de livraison : si `main` déclare une version que le registre ne sert pas,
  # quelque chose est resté à moitié fait, et ça doit se voir sans qu'on pense à regarder.
  #
  # ⚠️ Ce contrôle N'ÉCHOUE PAS la CI. Entre la fusion et la fin de la publication il s'écoule
  # légitimement quelques minutes, et un échec rouge à chaque fusion apprendrait à ignorer la
  # couleur — le défaut même qu'on corrige. Il écrit un avertissement dans le résumé de la course :
  # visible pour qui vient de fusionner, silencieux quand tout est en ordre.
  #
  # ⚠️ ET IL NE SUFFIT PAS. Le second hôte a fait la remarque qui le disqualifie comme garde
  # principale : un avertissement dans un résumé ne se voit QUE SI QUELQU'UN OUVRE LA COURSE. Les
  # trois fois, personne ne l'avait ouverte — c'est un hôte qui a trouvé, en comparant le registre à
  # l'annonce. La garde qui n'a besoin de personne est dans `publication.yml` : elle tourne toute
  # seule et ouvre une issue. Celle-ci reste pour l'immédiateté ; l'autre pour la certitude.
  publication:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: main declares a version the registry does not serve
        run: |
          locale=$(node -p "require('./package.json').version")
          publiee=$(npm view discovery-media-player version 2>/dev/null || echo "")
          echo "main=$locale registre=$publiee"
          if [ "$locale" != "$publiee" ]; then
            {
              echo "### ⚠️ Version non publiée"
              echo ""
              echo "\`main\` déclare **$locale**, le registre sert **${publiee:-rien}**."
              echo ""
              echo "Si la publication vient d'être lancée, ignorez — elle prend quelques minutes."
              echo "Sinon il manque le tag :"
              echo ""
              echo '```'
              echo "git tag -a v$locale -m \"$locale\" && git push origin v$locale"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::main déclare $locale, npm sert ${publiee:-rien} — tag manquant ?"
          fi
