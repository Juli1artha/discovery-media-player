name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Les artefacts navigateur sont COMMITÉS (les plateformes serverless ne construisent rien).
      # Les reconstruire et exiger qu'ils n'aient pas bougé est la seule façon d'éviter qu'une
      # instance serve un bundle plus ancien que sa source, sans que rien ne le signale.
      - name: Generated bundles are up to date
        run: |
          npm run build
          git diff --exit-code -- server/*.generated.js \
            || { echo "::error::server/*.generated.js is stale — run 'npm run build' and commit."; exit 1; }

      # ⚠️ Le paquet doit distribuer du JS compilé et des types, jamais du TypeScript brut : un
      # consommateur sans chaîne de compilation ne pourrait rien en faire.
      - name: The published package ships compiled JS and types
        if: matrix.node == '22'
        run: |
          npm pack --silent >/dev/null
          tar tzf discovery-media-player-*.tgz > /tmp/files.txt
          grep -q 'package/dist/bridge.js'   /tmp/files.txt || { echo "::error::dist/bridge.js missing"; exit 1; }
          grep -q 'package/dist/bridge.d.ts' /tmp/files.txt || { echo "::error::dist/bridge.d.ts missing"; exit 1; }
          ! grep -q 'package/src/'  /tmp/files.txt || { echo "::error::raw TypeScript is being published"; exit 1; }
          ! grep -q '__tests__'     /tmp/files.txt || { echo "::error::tests are being published"; exit 1; }
          node --input-type=module -e "import('./dist/bridge.js').then(m => { if (typeof m.toWire !== 'function') process.exit(1); })"

      # ⚠️ Le contrat d'hôte demande une version EXACTE — « une plage fait entrer une version que
      # personne n'a décidé de déployer, le jour où quelqu'un lance npm install pour autre chose ».
      # Deux exemples sur trois disaient `^0.1.0` : un intégrateur qui copie l'exemple récolte
      # exactement ce contre quoi la page qu'il vient de lire le met en garde. La cohérence entre
      # ce qu'on écrit et ce qu'on montre ne se relit pas, elle se garde.
      # ⚠️ `.env.example` est ce qu'un exploitant COPIE. Une variable documentée qui n'y figure pas
      # n'existe pas pour lui — il ne la découvre qu'en cherchant pourquoi quelque chose ne marche
      # pas. `PLAYER_AUTH_URL` a vécu une demi-journée dans ce trou, le jour même de sa sortie :
      # la doc l'annonçait, le fichier à copier l'ignorait.
      - name: The example env file matches the documented variables
        if: matrix.node == '22'
        run: |
          grep -oE '`[A-Z][A-Z0-9_]{2,}`' docs/CONFIGURATION.md | tr -d '`' | sort -u > /tmp/doc.txt
          grep -oE '^[A-Z][A-Z0-9_]+'     .env.example          | sort -u > /tmp/env.txt
          diff=$(comm -3 /tmp/doc.txt /tmp/env.txt) || true
          [ -z "$diff" ] || { echo "::error::.env.example and docs/CONFIGURATION.md disagree:"; echo "$diff"; exit 1; }

      # ⚠️ LA CARTE D'IDENTITÉ EST LA SEULE CHOSE QUE LES HÔTES ÉPINGLENT. Le contrat en montrait
      # une version périmée de cinq publications, à laquelle il manquait deux capacités. Un hôte
      # qui teste la présence d'une capacité d'après la doc conclut qu'elle n'existe pas. La
      # synchroniser à la main est exactement ce qui a échoué — donc on la garde.
      - name: The documented identity card matches the code
        if: matrix.node == '22'
        run: |
          node -e '
            const fs = require("node:fs");
            const src = fs.readFileSync("server/handler.js", "utf8");
            const bloc = src.slice(src.indexOf("capabilities: ["));
            const code = [...bloc.slice(0, bloc.indexOf("]")).matchAll(/"([a-z-]+)"/g)].map(m => m[1]).sort();
            const doc = fs.readFileSync("docs/HOST-CONTRACT.md", "utf8");
            const ligne = doc.split("\n").find(l => l.includes("\"capabilities\""));
            const documentees = [...ligne.matchAll(/"([a-z-]+)"/g)].map(m => m[1]).filter(c => c !== "capabilities").sort();
            const manquantes = code.filter(c => !documentees.includes(c));
            const inventees = documentees.filter(c => !code.includes(c));
            if (manquantes.length || inventees.length) {
              console.error("::error::identity card drift — missing from docs: " + (manquantes.join(", ") || "none") +
                            " | documented but absent from code: " + (inventees.join(", ") || "none"));
              process.exit(1);
            }
            // Les booléens de configuration doivent apparaître aussi : ils disent ce qui est POSÉ.
            for (const champ of ["separateIssuer", "hostShare", "hostMail"]) {
              if (!src.includes(champ + ":")) { console.error("::error::" + champ + " absent du code"); process.exit(1); }
              if (!doc.includes("\"" + champ + "\"")) { console.error("::error::" + champ + " absent du contrat"); process.exit(1); }
            }
            console.log("carte d’identité : " + code.length + " capacités, doc et code d’accord");
          '

      # ⚠️ LE COÛT D'UN PORTAGE NE DOIT PAS GRANDIR EN SILENCE. Les 49 requêtes du cœur sont de
      # la forme `table?colonne=eq.valeur` : rien n'exige la SÉMANTIQUE de PostgREST, seulement sa
      # syntaxe. Une jointure imbriquée ou un `or=()` ajouté un jour changerait ça sans que personne
      # ne le décide — et la doc annonce un chiffre qui deviendrait faux.
      - name: The database surface stays portable-shaped
        if: matrix.node == '22'
        run: |
          # `in.(…)` n'est PAS dans la liste : il se traduit par un `WHERE colonne IN (…)`, donc il
          # ne coûte rien à porter. Ce qui coûte, ce sont les JOINTURES imbriquées et les arbres
          # booléens — là, un portage cesse d'être une traduction et devient une réécriture.
          #
          # ⚠️ ON RETIRE LES COMMENTAIRES AVANT DE CHERCHER. Cette garde lisait tout le fichier, donc
          # aussi les commentaires qui EXPLIQUENT ce qu'elle interdit : écrire « select=a(b) » pour
          # dire « ceci est interdit » la déclenchait. Elle accusait alors du code parfaitement
          # portable, et la seule issue était d'écrire autour d'elle — c'est-à-dire de dégrader
          # l'explication pour satisfaire la garde.
          #
          # Une sonde qui lit du commentaire invente des coupables. Même correction que celle faite
          # le même jour sur la sonde des colonnes de schéma, pour la même raison.
          sans_commentaires=$(grep -vE '^[[:space:]]*//' server/*.js --with-filename --line-number || true)
          exotique=$(printf '%s\n' "$sans_commentaires" | grep -E 'select=[^&`"]*\(|[?&]or=\(|[?&]and=\(|offset=' || true)
          [ -z "$exotique" ] || { echo "::error::PostgREST-specific syntax raises the porting cost:"; echo "$exotique"; exit 1; }
          # ⚠️ ON COMPARE, ON N'AFFICHE PAS. Cette étape se contentait d'imprimer le compte en
          # renvoyant le lecteur vers docs/API.md — deux exemplaires du même fait, et personne pour
          # les mettre côte à côte. Le document annonçait 49 appels « dans trois fichiers » quand il
          # y en avait 51 dans quatre : l'écart s'était installé sans qu'aucune étape ne mente,
          # puisque aucune ne comparait.
          #
          # Un chiffre affiché est une invitation à vérifier ; un chiffre comparé est une garde.
          # Trouvé en appliquant la formule du second hôte : à chaque fois qu'un fait existe en deux
          # exemplaires, quelqu'un doit les confronter au moins une fois — et ici « quelqu'un » peut
          # être cette étape.
          n=$(grep -ho 'PLAYER\.db\.\(request\|selectAll\)' server/*.js | wc -l | tr -d ' ')
          annonce=$(grep -oE '\| Call sites \| \*\*[0-9]+\*\*' docs/API.md | grep -oE '[0-9]+')
          echo "surface base : $n appels — docs/API.md annonce $annonce"
          [ "$n" = "$annonce" ] || { echo "::error::docs/API.md annonce $annonce appels, le code en compte $n. Mettez le document à jour."; exit 1; }

      # ⚠️ UN SCRIPT TIERS ENTRE DANS LA PAGE AVEC NOS DROITS. Version exacte + empreinte, sinon
      # ce qui s'exécute chez le visiteur est décidé par quelqu'un d'autre, sans déploiement.
      # Cette garde ne relit PAS une liste écrite à la main : elle part de l'inventaire exporté par
      # le code, puis vérifie qu'aucune URL de script du gabarit ne lui échappe — c'est ce second
      # temps qui compte, le premier ne prouverait que sa propre cohérence.
      - name: Third-party scripts are pinned and fingerprinted
        if: matrix.node == '22'
        run: |
          node -e '
            const fs = require("node:fs");
            const { TIERS } = require("./server/handler.js");
            const echecs = [];

            for (const [cle, t] of Object.entries(TIERS)) {
              if (!/^sha384-[A-Za-z0-9+/]{60,}={0,2}$/.test(t.sri || "")) echecs.push(cle + " : empreinte absente ou mal formée");
              // Une étiquette majeure (@2) ou « latest » suit la dernière publication du tiers :
              // le code servi change alors sans déploiement, et aucune empreinte ne peut tenir.
              if (/@\d+\/|@latest|\/latest\//.test(t.url)) echecs.push(cle + " : version mouvante — " + t.url);
              if (!/\d+\.\d+\.\d+/.test(t.url)) echecs.push(cle + " : pas de version exacte — " + t.url);
            }

            // Toute URL de script du gabarit doit venir de linventaire. Deux CHARGEURS ny entrent
            // pas, et cest structurel : leur réponse change à chaque appel et ils injectent
            // eux-mêmes dautres scripts, donc aucune empreinte nest possible dessus. On les nomme
            // ici AVEC leur raison — une exception écrite se relit, une exception fondue dans le
            // décor devient la règle. Ajouter un tiers demain force donc un choix visible : épinglé
            // et empreinté, ou inscrit ici avec ce quon accepte en connaissance de cause.
            const SANS_EMPREINTE = {
              "maps.googleapis.com": "chargeur de cartes : URL versionnée par un paramètre, réponse variable",
              "accounts.google.com/gsi/client": "chargeur didentité Google : aucune version publiée",
            };
            const src = fs.readFileSync("server/handler.js", "utf8")
              .split("\n").filter((l) => !/^\s*\/\//.test(l)).join("\n");
            const connues = new Set(Object.values(TIERS).map((t) => t.url));
            const urls = [...src.matchAll(/(?:src=["'"'"']|s\.src=["'"'"'])(https:\/\/[^"'"'"'`]+)/g)].map((m) => m[1]);
            for (const u of new Set(urls)) {
              if (connues.has(u)) continue;
              if (Object.keys(SANS_EMPREINTE).some((motif) => u.includes(motif))) continue;
              echecs.push("script hors inventaire : " + u);
            }

            if (echecs.length) { console.error("::error::" + echecs.join(" | ")); process.exit(1); }
            console.log("tiers : " + Object.keys(TIERS).length + " dépendances épinglées et empreintées, aucune hors inventaire");
          '

      - name: Examples pin an exact version
        if: matrix.node == '22'
        run: |
          bad=$(grep -l '"discovery-media-player": *"[\^~]' examples/*/package.json || true)
          [ -z "$bad" ] || { echo "::error::a version range in: $bad"; exit 1; }
          grep -q '">=22"' examples/demo/package.json || { echo "::error::examples must declare node >=22"; exit 1; }

  # ⚠️ CE QUE `npm test` NE PEUT PAS VOIR. `jsdom` n'applique pas la CSP, et le `res` postiche des
  # essais serveur se contente d'ENREGISTRER les en-têtes. Une politique qui interdit nos propres
  # scripts passe donc les 690 essais et donne un écran blanc chez le visiteur. Il faut un moteur
  # qui refuse pour de vrai — d'où cette étape, et son navigateur.
  #
  # Séparée de `check` : un banc navigateur qui s'invite dans la commande de base la rendrait
  # inexécutable dans un conteneur nu, et personne ne la lancerait plus en boucle.
  navigateur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # ⚠️ ON NOMME LE NAVIGATEUR AVANT DE S'EN SERVIR. Le banc s'esquive en local quand il n'y a pas
      # de Chrome — c'est confortable, et ce serait un trou béant ici : le jour où l'image de la
      # forge cesse d'en embarquer un, l'étape passerait au vert sans avoir rien exercé. `CI` étant
      # posé, le banc échoue au lieu de s'esquiver ; cette ligne dit juste lequel, et depuis quand.
      - run: google-chrome --version
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t player:ci .
      # Une image qui construit mais ne répond pas n'est pas une image qui marche.
      - name: The image answers
        run: |
          docker run -d --name player-ci -p 3000:3000 player:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz && break || sleep 1; done
          curl -fsS "localhost:3000/api/doc?contract=1" | grep -q '"contract":1'
          docker rm -f player-ci

  # ⚠️ TROISIÈME FOIS QUE LA PUBLICATION EST LE POINT DE RUPTURE.
  #
  #   0.1.15 — publiée SANS son correctif (commit sur une branche dont la PR venait d'être fusionnée) ;
  #   0.1.25 — publiée CASSÉE (script en ligne qui ne se parse pas) ;
  #   0.1.35 — JAMAIS publiée : PR fusionnée, tag oublié. Le code était sur `main`, l'artefact nulle part.
  #
  # Les trois ont été trouvées par un HÔTE, pas ici. Le troisième cas est le plus sournois : rien
  # n'échoue. La CI est verte, la PR est fusionnée, le CHANGELOG annonce la version — et npm sert
  # toujours la précédente. Un état anormal que rien ne dit devient l'état normal.
  #
  # C'est la règle qu'on vient d'écrire pour les gardes muettes du produit (0.1.35), retournée sur
  # notre propre chaîne de livraison : si `main` déclare une version que le registre ne sert pas,
  # quelque chose est resté à moitié fait, et ça doit se voir sans qu'on pense à regarder.
  #
  # ⚠️ Ce contrôle N'ÉCHOUE PAS la CI. Entre la fusion et la fin de la publication il s'écoule
  # légitimement quelques minutes, et un échec rouge à chaque fusion apprendrait à ignorer la
  # couleur — le défaut même qu'on corrige. Il écrit un avertissement dans le résumé de la course :
  # visible pour qui vient de fusionner, silencieux quand tout est en ordre.
  #
  # ⚠️ ET IL NE SUFFIT PAS. Le second hôte a fait la remarque qui le disqualifie comme garde
  # principale : un avertissement dans un résumé ne se voit QUE SI QUELQU'UN OUVRE LA COURSE. Les
  # trois fois, personne ne l'avait ouverte — c'est un hôte qui a trouvé, en comparant le registre à
  # l'annonce. La garde qui n'a besoin de personne est dans `publication.yml` : elle tourne toute
  # seule et ouvre une issue. Celle-ci reste pour l'immédiateté ; l'autre pour la certitude.
  publication:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: main declares a version the registry does not serve
        run: |
          locale=$(node -p "require('./package.json').version")
          publiee=$(npm view discovery-media-player version 2>/dev/null || echo "")
          echo "main=$locale registre=$publiee"
          if [ "$locale" != "$publiee" ]; then
            {
              echo "### ⚠️ Version non publiée"
              echo ""
              echo "\`main\` déclare **$locale**, le registre sert **${publiee:-rien}**."
              echo ""
              echo "Si la publication vient d'être lancée, ignorez — elle prend quelques minutes."
              echo "Sinon il manque le tag :"
              echo ""
              echo '```'
              echo "git tag -a v$locale -m \"$locale\" && git push origin v$locale"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::main déclare $locale, npm sert ${publiee:-rien} — tag manquant ?"
          fi
