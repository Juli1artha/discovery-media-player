name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Les artefacts navigateur sont COMMITÉS (les plateformes serverless ne construisent rien).
      # Les reconstruire et exiger qu'ils n'aient pas bougé est la seule façon d'éviter qu'une
      # instance serve un bundle plus ancien que sa source, sans que rien ne le signale.
      - name: Generated bundles are up to date
        run: |
          npm run build
          git diff --exit-code -- server/*.generated.js \
            || { echo "::error::server/*.generated.js is stale — run 'npm run build' and commit."; exit 1; }

      # ⚠️ Le paquet doit distribuer du JS compilé et des types, jamais du TypeScript brut : un
      # consommateur sans chaîne de compilation ne pourrait rien en faire.
      - name: The published package ships compiled JS and types
        if: matrix.node == '22'
        run: |
          npm pack --silent >/dev/null
          tar tzf discovery-media-player-*.tgz > /tmp/files.txt
          grep -q 'package/dist/bridge.js'   /tmp/files.txt || { echo "::error::dist/bridge.js missing"; exit 1; }
          grep -q 'package/dist/bridge.d.ts' /tmp/files.txt || { echo "::error::dist/bridge.d.ts missing"; exit 1; }
          ! grep -q 'package/src/'  /tmp/files.txt || { echo "::error::raw TypeScript is being published"; exit 1; }
          ! grep -q '__tests__'     /tmp/files.txt || { echo "::error::tests are being published"; exit 1; }
          node --input-type=module -e "import('./dist/bridge.js').then(m => { if (typeof m.toWire !== 'function') process.exit(1); })"

      # ⚠️ Le contrat d'hôte demande une version EXACTE — « une plage fait entrer une version que
      # personne n'a décidé de déployer, le jour où quelqu'un lance npm install pour autre chose ».
      # Deux exemples sur trois disaient `^0.1.0` : un intégrateur qui copie l'exemple récolte
      # exactement ce contre quoi la page qu'il vient de lire le met en garde. La cohérence entre
      # ce qu'on écrit et ce qu'on montre ne se relit pas, elle se garde.
      # ⚠️ `.env.example` est ce qu'un exploitant COPIE. Une variable documentée qui n'y figure pas
      # n'existe pas pour lui — il ne la découvre qu'en cherchant pourquoi quelque chose ne marche
      # pas. `PLAYER_AUTH_URL` a vécu une demi-journée dans ce trou, le jour même de sa sortie :
      # la doc l'annonçait, le fichier à copier l'ignorait.
      - name: The example env file matches the documented variables
        if: matrix.node == '22'
        run: |
          grep -oE '`[A-Z][A-Z0-9_]{2,}`' docs/CONFIGURATION.md | tr -d '`' | sort -u > /tmp/doc.txt
          grep -oE '^[A-Z][A-Z0-9_]+'     .env.example          | sort -u > /tmp/env.txt
          diff=$(comm -3 /tmp/doc.txt /tmp/env.txt) || true
          [ -z "$diff" ] || { echo "::error::.env.example and docs/CONFIGURATION.md disagree:"; echo "$diff"; exit 1; }

      # ⚠️ LA CARTE D'IDENTITÉ EST LA SEULE CHOSE QUE LES HÔTES ÉPINGLENT. Le contrat en montrait
      # une version périmée de cinq publications, à laquelle il manquait deux capacités. Un hôte
      # qui teste la présence d'une capacité d'après la doc conclut qu'elle n'existe pas. La
      # synchroniser à la main est exactement ce qui a échoué — donc on la garde.
      - name: The documented identity card matches the code
        if: matrix.node == '22'
        run: |
          node -e '
            const fs = require("node:fs");
            const src = fs.readFileSync("server/handler.js", "utf8");
            const bloc = src.slice(src.indexOf("capabilities: ["));
            const code = [...bloc.slice(0, bloc.indexOf("]")).matchAll(/"([a-z-]+)"/g)].map(m => m[1]).sort();
            const doc = fs.readFileSync("docs/HOST-CONTRACT.md", "utf8");
            const ligne = doc.split("\n").find(l => l.includes("\"capabilities\""));
            const documentees = [...ligne.matchAll(/"([a-z-]+)"/g)].map(m => m[1]).filter(c => c !== "capabilities").sort();
            const manquantes = code.filter(c => !documentees.includes(c));
            const inventees = documentees.filter(c => !code.includes(c));
            if (manquantes.length || inventees.length) {
              console.error("::error::identity card drift — missing from docs: " + (manquantes.join(", ") || "none") +
                            " | documented but absent from code: " + (inventees.join(", ") || "none"));
              process.exit(1);
            }
            // Les booléens de configuration doivent apparaître aussi : ils disent ce qui est POSÉ.
            for (const champ of ["separateIssuer", "hostShare", "hostMail"]) {
              if (!src.includes(champ + ":")) { console.error("::error::" + champ + " absent du code"); process.exit(1); }
              if (!doc.includes("\"" + champ + "\"")) { console.error("::error::" + champ + " absent du contrat"); process.exit(1); }
            }
            console.log("carte d’identité : " + code.length + " capacités, doc et code d’accord");
          '

      # ⚠️ LE COÛT D'UN PORTAGE NE DOIT PAS GRANDIR EN SILENCE. Les 49 requêtes du cœur sont de
      # la forme `table?colonne=eq.valeur` : rien n'exige la SÉMANTIQUE de PostgREST, seulement sa
      # syntaxe. Une jointure imbriquée ou un `or=()` ajouté un jour changerait ça sans que personne
      # ne le décide — et la doc annonce un chiffre qui deviendrait faux.
      - name: The database surface stays portable-shaped
        if: matrix.node == '22'
        run: |
          # `in.(…)` n'est PAS dans la liste : il se traduit par un `WHERE colonne IN (…)`, donc il
          # ne coûte rien à porter. Ce qui coûte, ce sont les JOINTURES imbriquées et les arbres
          # booléens — là, un portage cesse d'être une traduction et devient une réécriture.
          exotique=$(grep -nE 'select=[^&`"]*\(|[?&]or=\(|[?&]and=\(|offset=' server/*.js || true)
          [ -z "$exotique" ] || { echo "::error::PostgREST-specific syntax raises the porting cost:"; echo "$exotique"; exit 1; }
          n=$(grep -ho 'PLAYER\.db\.\(request\|selectAll\)' server/*.js | wc -l | tr -d ' ')
          echo "surface base : $n appels — chiffre annoncé dans docs/API.md"

      - name: Examples pin an exact version
        if: matrix.node == '22'
        run: |
          bad=$(grep -l '"discovery-media-player": *"[\^~]' examples/*/package.json || true)
          [ -z "$bad" ] || { echo "::error::a version range in: $bad"; exit 1; }
          grep -q '">=22"' examples/demo/package.json || { echo "::error::examples must declare node >=22"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t player:ci .
      # Une image qui construit mais ne répond pas n'est pas une image qui marche.
      - name: The image answers
        run: |
          docker run -d --name player-ci -p 3000:3000 player:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz && break || sleep 1; done
          curl -fsS "localhost:3000/api/doc?contract=1" | grep -q '"contract":1'
          docker rm -f player-ci
