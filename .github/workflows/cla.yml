name: CLA

# Un CLA que personne ne signe est pire que pas de CLA : il fabrique une confiance qui n'est
# adossée à rien, et le jour où on compte dessus — une licence commerciale à accorder — on
# découvre que les contributions fusionnées ne sont couvertes par aucune signature. La
# vérification est donc automatique, et bloquante.

on:
  # ⚠️ `pull_request_target` s'exécute dans le contexte du dépôt de BASE, avec ses droits en
  # écriture. C'est nécessaire ici (il faut pouvoir écrire le registre des signatures sur une PR
  # venue d'un fork), et c'est aussi le piège classique de GitHub Actions : ce workflow ne doit
  # JAMAIS récupérer ni exécuter le code de la PR. Il ne fait aucun `checkout`, aucun `npm ci`,
  # aucun script du dépôt — il lit un commentaire et écrit un fichier JSON. Si quelqu'un ajoute un
  # `actions/checkout` ci-dessous, il donne à n'importe quel inconnu les droits d'écriture du
  # dépôt : la relecture de ce fichier compte plus que celle de la plupart du code.
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write          # relancer la vérification après signature
  contents: write         # écrire le registre des signatures (branche dédiée)
  pull-requests: write    # poser le commentaire et le statut

jobs:
  cla:
    runs-on: ubuntu-latest
    # Le bot ne se répond pas à lui-même, et ne se déclenche que sur la phrase de signature.
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/Juli1artha/discovery-media-player/blob/main/CLA.md
          # Registre sur une branche à part : l'historique de `main` raconte le code, pas les
          # signatures. Elles restent dans le dépôt — vérifiables par n'importe qui, y compris
          # par le contributeur qui veut relire ce qu'il a signé.
          branch: cla-signatures
          # Le mainteneur est le CONCÉDANT : il ne s'accorde pas une licence à lui-même. Les bots
          # ne produisent pas d'œuvre de l'esprit — rien à concéder non plus.
          allowlist: Juli1artha,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: |
            Merci pour cette contribution. Il manque une chose, une seule fois et pour toujours :
            la signature du [CLA](https://github.com/Juli1artha/discovery-media-player/blob/main/CLA.md).

            **Vous gardez le droit d'auteur sur votre travail.** Vous accordez une licence, avec
            droit de sous-licencier — c'est ce qui permet au cœur de rester AGPL tout en autorisant
            une licence commerciale pour les organisations qui ne peuvent pas vivre avec la clause
            réseau. Sans accord de chacun, cette seconde licence devient impossible, définitivement.

            Pour signer, répondez ici avec exactement cette ligne :

            ---
            Thanks for this contribution. One thing is missing — once, and for good: signing the
            [CLA](https://github.com/Juli1artha/discovery-media-player/blob/main/CLA.md).

            **You keep the copyright in your work.** You grant a licence, with the right to
            sublicense — which is what lets the core stay AGPL while a commercial licence remains
            possible for organisations that cannot live with the network clause. Without everyone's
            permission, that second licence becomes impossible, permanently.

            To sign, reply here with exactly this line:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "✅ CLA signé — merci. Cette signature couvre toutes vos contributions à venir sur ce dépôt."
