name: CLA

# Un CLA que personne ne signe est pire que pas de CLA : il fabrique une confiance qui n'est
# adossée à rien, et le jour où on compte dessus — une licence commerciale à accorder — on
# découvre que les contributions fusionnées ne sont couvertes par aucune signature. La
# vérification est donc automatique, et bloquante.
#
# ⚠️ ELLE NE PASSE PLUS PAR UNE ACTION TIERCE. `contributor-assistant/github-action` est ARCHIVÉE
# depuis le 23/03/2026 (archived=true, constaté par l'API) et prévenait déjà qu'elle visait un
# runtime Node retiré. Tant que ce contrôle n'était que signalé, en dépendre était supportable ;
# depuis qu'il est REQUIS par la protection de `main`, une action non maintenue tient la porte de
# toutes les contributions. Le jour où la forge retire ce qu'elle utilise, plus aucune PR ne
# passe — et personne n'aura été prévenu.
#
# ⚠️ LE MOMENT ÉTAIT LE BON : le registre était VIDE. Aucun contributeur externe n'avait encore
# eu à signer, donc il n'y avait aucune signature à déplacer, donc aucune à perdre. Une dette se
# rembourse quand elle ne coûte rien.
#
# Le remplaçant vit dans tools/cla/ : des règles pures (regles.mjs, 28 tests dans
# tools/__tests__/cla.test.js) et la mécanique (verifier.mjs). Même sémantique qu'avant : même
# phrase de signature, même registre, même branche, même dispenses, et toujours BLOQUANT.

on:
  # ⚠️ `pull_request_target` s'exécute dans le contexte du dépôt de BASE, avec ses droits en
  # écriture. C'est nécessaire ici (écrire le registre depuis une PR venue d'un fork), et c'est
  # le piège classique de GitHub Actions : ce workflow ne doit JAMAIS récupérer ni exécuter le
  # code de la PR. Le checkout ci-dessous prend explicitement la branche par DÉFAUT, et le
  # vérificateur ne lit aucun fichier de la PR — seulement des données d'API. Si quelqu'un ajoute
  # un `ref:` pointant la tête de la PR, ou un `npm ci`, il donne à n'importe quel inconnu les
  # droits d'écriture du dépôt.
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write         # écrire le registre des signatures (branche dédiée)
  pull-requests: write    # poser et mettre à jour le commentaire
  issues: write           # un commentaire de PR est un commentaire d'issue

concurrency:
  # Deux signatures postées coup sur coup réécriraient le registre en même temps ; la seconde
  # écraserait la première. On sérialise par PR.
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # ⚠️ CE NOM EST UN CONTRAT AVEC LE RULESET. `cla` figure dans les contrôles REQUIS de `main` :
  # le renommer ferait attendre à la forge un contrôle qui n'arrive jamais, et bloquerait toutes
  # les PR sans que rien n'explique pourquoi. Il ne se change qu'avec le ruleset, dans le même
  # geste.
  cla:
    runs-on: ubuntu-latest
    # Le bot ne se répond pas à lui-même. Sur un commentaire, on ne réveille le contrôle que pour
    # la phrase de signature ou « recheck » — tout le reste serait du bruit à chaque échange.
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       github.event.comment.user.type != 'Bot' &&
       (contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') ||
        github.event.comment.body == 'recheck'))
    steps:
      # ⚠️ LA BRANCHE PAR DÉFAUT, JAMAIS LA TÊTE DE LA PR — voir l'avertissement plus haut.
      # `persist-credentials: false` : le jeton du checkout n'a rien à faire dans l'arbre.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      # Aucun `npm ci` : le vérificateur n'a aucune dépendance, exprès. Ce qui s'exécute ici avec
      # les droits d'écriture du dépôt doit tenir dans ce qu'on peut relire.
      - name: Vérifier les signatures
        env:
          CLA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLA_PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          CLA_EVENEMENT: ${{ github.event_name }}
          CLA_COMMENTAIRE: ${{ github.event.comment.body }}
          CLA_AUTEUR_COMMENTAIRE: ${{ github.event.comment.user.login }}
          CLA_AUTEUR_ID: ${{ github.event.comment.user.id }}
        run: node tools/cla/verifier.mjs
