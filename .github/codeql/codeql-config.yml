name: "Discovery Media Player"

# ⚠️ POURQUOI UNE RÈGLE EST RETIRÉE, ET POURQUOI CE N'EST PAS « IGNORER UNE ALERTE ».
#
# `js/user-controlled-bypass` signale toute condition contrôlée par l'utilisateur qui garde une
# action sensible. Ce cœur est construit autour d'un AIGUILLAGE : `body.action === "docshare.list"`
# choisit le gestionnaire, et l'autorisation vit DANS chaque branche — jeton vérifié puis
# `canManageShares`, ou secret comparé en temps constant. La règle ne peut pas distinguer un
# dispatcher d'un contrôle de droits : elle produit 33 alertes, toutes sur la même forme.
#
# Trente-trois alertes de bruit ne rendent pas un dépôt plus sûr : elles apprennent à passer la
# liste sans la lire, et c'est ce jour-là qu'une vraie se perd dedans. Le 14/08/2026, les 33 ont
# été analysées une par une avant ce retrait — l'une portait un résidu réel (`body.internal`), qui
# a été CORRIGÉ et non écarté : borné, limité en débit, journalisé, et fermable par
# `PLAYER_INTERNAL_STRICT=1`.
#
# Ce qui remplace la règle ici : des tests qui portent sur l'autorisation de chaque branche, et une
# relecture qui sait ce qu'elle regarde. Détail complet : docs/AUDIT-2026-08-14-SUIVI.md
# ⚠️ CE QU'ON N'A PAS FAIT : EXCLURE `examples/`.
#
# `js/missing-rate-limiting` réclame un limiteur devant chaque route qui touche le disque, et vise
# cinq routes de l'exemple Express. Aucune ne le mérite (les raisons sont dans le fichier lui-même),
# et elles reviennent sous un NOUVEAU numéro dès qu'un commentaire décale une ligne.
#
# La tentation était d'ajouter `paths-ignore: examples/**`. C'est le mauvais échange : un exemple
# est le code que les gens RECOPIENT en production. Cesser de l'analyser pour supprimer cinq
# alertes connues, c'est laisser passer la sixième — celle qu'on n'a pas encore vue.
#
# On garde donc l'analyse complète sur `examples/`, et ces cinq-là se suppriment une par une, sur
# place, avec leur raison écrite à côté (`// codeql[js/missing-rate-limiting]`). Le coût est de les
# reposer si les routes bougent ; il est assumé.
query-filters:
  - exclude:
      id: js/user-controlled-bypass
