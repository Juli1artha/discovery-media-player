name: "Discovery Media Player"

# ⚠️ POURQUOI UNE RÈGLE EST RETIRÉE, ET POURQUOI CE N'EST PAS « IGNORER UNE ALERTE ».
#
# `js/user-controlled-bypass` signale toute condition contrôlée par l'utilisateur qui garde une
# action sensible. Ce cœur est construit autour d'un AIGUILLAGE : `body.action === "docshare.list"`
# choisit le gestionnaire, et l'autorisation vit DANS chaque branche — jeton vérifié puis
# `canManageShares`, ou secret comparé en temps constant. La règle ne peut pas distinguer un
# dispatcher d'un contrôle de droits : elle produit 33 alertes, toutes sur la même forme.
#
# Trente-trois alertes de bruit ne rendent pas un dépôt plus sûr : elles apprennent à passer la
# liste sans la lire, et c'est ce jour-là qu'une vraie se perd dedans. Le 14/08/2026, les 33 ont
# été analysées une par une avant ce retrait — l'une portait un résidu réel (`body.internal`), qui
# a été CORRIGÉ et non écarté : borné, limité en débit, journalisé, et fermable par
# `PLAYER_INTERNAL_STRICT=1`.
#
# Ce qui remplace la règle ici : des tests qui portent sur l'autorisation de chaque branche, et une
# relecture qui sait ce qu'elle regarde. Détail complet : docs/AUDIT-2026-08-14-SUIVI.md
# ⚠️ `js/missing-rate-limiting` SUR `examples/` : ÉCARTÉE À LA MAIN, ET IL N'Y A PAS MIEUX.
#
# La règle réclame un limiteur devant chaque route qui touche le disque, et vise cinq routes de
# l'exemple Express. Aucune ne le mérite — les raisons sont écrites dans le fichier lui-même, à
# côté de chaque route. Elles reviennent sous un NOUVEAU numéro dès qu'un commentaire décale une
# ligne, ce qui use la liste et apprend à la parcourir sans la lire.
#
# ⚠️ CE QUI NE MARCHE PAS : les commentaires de suppression `// codeql[js/...]`. Ils ont été posés
# le 14/08/2026, sur leur propre ligne juste avant chaque route, et MESURÉS sur le commit fusionné
# (731bba2) : les alertes sont remontées identiques. Le code scanning de GitHub ne les honore pas —
# c'est un mécanisme du CLI (`AlertSuppression.ql`), pas du service. Ils ont été retirés : un
# marqueur qui ressemble à une mécanique sans en être une est pire que rien, parce que le suivant
# le croira.
#
# ⚠️ CE QU'ON N'A PAS FAIT : `paths-ignore: examples/**`. C'était la ligne qui règle tout, et c'est
# le mauvais échange — un exemple est le code que les gens RECOPIENT en production. Cesser de
# l'analyser pour supprimer cinq alertes connues, c'est laisser passer la sixième, celle qu'on n'a
# pas encore vue.
#
# Il reste donc l'écartement à la main, avec motif, dans l'onglet Security. C'est manuel et ça se
# refait quand les routes bougent ; c'est le prix pour garder l'analyse entière là où elle compte.
query-filters:
  - exclude:
      id: js/user-controlled-bypass
