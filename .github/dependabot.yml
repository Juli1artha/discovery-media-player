version: 2
updates:
  # ⚠️ Groupé et mensuel, délibérément. Ce paquet n'a AUCUNE dépendance de production : tout ce
  # qui suit est de l'outillage de test. Une PR par mise à jour et par semaine noierait les vraies
  # contributions sous du bruit, et personne ne relirait plus rien.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      dev-tooling:
        patterns: ["*"]
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "chore(ci)" }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(docker)" }
    # ⚠️ Les correctifs de la ligne courante passent ; le changement de MAJEURE, non. Il se
    # décide sur le calendrier LTS de Node — Dependabot ne sait pas qu'une version est « Current »
    # et a proposé la 26 le jour de sa sortie, deux mois avant qu'elle soit soutenue. Une PR verte
    # qui fait tourner la prod sur une base non LTS reste une PR verte : c'est la relecture, pas
    # la CI, qui attrape ça — donc on ne la propose plus du tout.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
